<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diana Seo — Essay</title>
  <meta name="description" content="An essay by Diana Seo, founder of Oriya.">
  <meta name="theme-color" content="#fbfbf9">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fbfbf9'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='54' fill='%23b9542d' text-anchor='middle'%3EDS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fbfbf9;--bg-2:#f4f3ee;--panel:#ffffff;--line:rgba(28,27,25,0.12);--line-2:rgba(28,27,25,0.06);
      --text:#1c1b19;--text-2:#57554e;--text-3:#97958b;
      --accent:#b9542d;--accent-line:rgba(185,84,45,0.26);--accent-dim:rgba(185,84,45,0.09);
      --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Inter",-apple-system,sans-serif;--serif:"Instrument Serif",Georgia,serif;
      --ease:cubic-bezier(0.16,1,0.3,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;font-size:16px;
      background-image:radial-gradient(800px 460px at 50% -8%,rgba(185,84,45,0.05),transparent 60%);min-height:100vh;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--accent-dim);color:var(--text)}
    .wrap{max-width:680px;margin:0 auto;padding:34px 24px 90px}
    .page{opacity:0;transform:translateY(6px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
    .page.in{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.page{opacity:1;transform:none;transition:none}}

    .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-bottom:40px}
    .crumb a{transition:color .2s var(--ease)}
    .crumb a:hover{color:var(--accent)}
    .crumb .sep{color:var(--text-3)}
    .crumb .here{color:var(--text-2)}

    .e-meta{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-bottom:14px}
    .e-meta .tag{color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-dim);border-radius:6px;padding:2px 8px}
    .e-meta .draft{border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--text-3)}
    h1.e-title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5.4vw,46px);line-height:1.12;letter-spacing:0.005em;color:var(--text);margin-bottom:10px}
    .e-dek{font-size:18px;color:var(--text-2);font-style:italic;font-family:var(--serif);margin-bottom:30px;padding-bottom:26px;border-bottom:1px solid var(--line)}

    /* listen affordance — a utility (hear it on a commute), never faked intimacy.
       Her words, an AI voice, disclaimed in the open. Only on long-form essays. */
    .listen{margin:0 0 30px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
    .listen-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
    .listen-btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12.5px;color:var(--text);border:1px solid var(--accent-line);background:var(--accent-dim);border-radius:9px;padding:9px 14px;cursor:pointer;transition:border-color .2s var(--ease),color .2s var(--ease),box-shadow .3s var(--ease)}
    .listen-btn:hover{border-color:var(--accent);color:var(--accent)}
    /* soft accent pulse while playing — the "it's live" cue, restrained (motion only during playback) */
    .listen.playing .listen-btn{border-color:var(--accent);color:var(--accent);animation:lpulse 2.4s ease-in-out infinite}
    @keyframes lpulse{0%,100%{box-shadow:0 0 0 0 rgba(185,84,45,0)}50%{box-shadow:0 0 0 4px var(--accent-dim)}}
    .lp-ico{width:0;height:0;border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent currentColor}
    .listen.playing .lp-ico{border:0;width:9px;height:11px;background:linear-gradient(currentColor 0 0) 0/3px 100% no-repeat,linear-gradient(currentColor 0 0) 100%/3px 100% no-repeat}
    .listen-tag{font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
    /* now-playing equalizer — Spotify's live bars, but thin + accent + on-brand. Bounces only
       while .playing; freezes (paused mid-bounce) on pause; flattens under reduced-motion. */
    .eq{display:none;align-items:flex-end;gap:2px;height:15px;margin-left:1px}
    .listen.playing .eq{display:inline-flex}
    .eq i{width:3px;height:100%;background:var(--accent);border-radius:2px;transform-origin:bottom;transform:scaleY(.3);animation:eqb .9s ease-in-out infinite}
    .eq i:nth-child(2){animation-duration:.72s;animation-delay:-.18s}
    .eq i:nth-child(3){animation-duration:1.08s;animation-delay:-.4s}
    .eq i:nth-child(4){animation-duration:.82s;animation-delay:-.1s}
    .eq i:nth-child(5){animation-duration:.96s;animation-delay:-.3s}
    @keyframes eqb{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
    .listen-prog{display:none;align-items:center;gap:10px;margin-top:13px}
    .listen.ready .listen-prog{display:flex}
    .listen-bar{flex:1;height:4px;background:var(--line);border-radius:3px;cursor:pointer;position:relative}
    .listen-bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .12s linear}
    .listen-time{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
    .listen-note{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin:11px 0 0;line-height:1.55}
    .listen-audio{display:none}
    /* podcast-style skip — appears once audio is ready; jumps the read +/-10s */
    .listen-skip{display:none;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--text-2);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;transition:border-color .2s var(--ease),color .2s var(--ease)}
    .listen.ready .listen-skip{display:inline-flex}
    .listen-skip:hover{border-color:var(--accent-line);color:var(--accent)}
    .listen-skip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @media(prefers-reduced-motion:reduce){
      .listen.playing .listen-btn{animation:none}
      .eq i{animation:none;transform:scaleY(.55)}
      .listen-bar>i{transition:none}
    }

    .e-body p{margin:0 0 20px;color:var(--text);font-size:16.5px}
    /* inline citations — understated underline, never a button; the prose stays the object */
    .e-body p a{color:inherit;text-decoration:underline;text-decoration-color:var(--accent-line);text-decoration-thickness:1px;text-underline-offset:3px;transition:color .2s var(--ease),text-decoration-color .2s var(--ease)}
    .e-body p a:hover{color:var(--accent);text-decoration-color:var(--accent)}
    .e-body > p:first-of-type::first-letter{font-family:var(--serif);font-size:54px;float:left;line-height:.82;padding:4px 12px 0 0;color:var(--accent)}

    .e-nav{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}
    .e-nav a{flex:1;border:1px solid var(--line);border-radius:11px;padding:14px 16px;transition:all .22s var(--ease);min-width:0}
    .e-nav a:hover{border-color:var(--accent-line);background:var(--panel)}
    .e-nav .dir{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
    .e-nav .nt{font-size:13.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .e-nav a:hover .nt{color:var(--text)}
    .e-nav .next{text-align:right}
    .e-nav a.disabled{opacity:.32;pointer-events:none}

    .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--text-2);margin-top:34px;border:1px solid var(--line);border-radius:9px;padding:9px 14px;transition:all .2s var(--ease)}
    .back:hover{border-color:var(--accent-line);color:var(--accent)}

    .nf{text-align:center;padding:60px 0}
    .nf h1{font-family:var(--serif);font-size:32px;margin-bottom:10px}
    .nf p{color:var(--text-2);margin-bottom:22px}

    /* reading progress — position-driven, not animated; hairline-thin so it informs without performing */
    .prog{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;z-index:60;pointer-events:none}

    /* cursor spotlight — cohesive with the ledger + /stack */
    .spot{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .45s var(--ease);
      background:radial-gradient(240px 240px at var(--mx,-999px) var(--my,-999px),rgba(185,84,45,0.07),transparent 68%)}
    .spot.on{opacity:1}
    @media(prefers-reduced-motion:reduce){.spot{display:none}}
    .page{position:relative;z-index:1}

    /* staggered block reveal on open — the on-brand alternative to a typewriter.
       Generalized to every body block (paragraphs, pull-quotes, figures) so figures
       join the same stagger. */
    .e-body>*{opacity:0;transform:translateY(8px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
    .e-body>*.in{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.e-body>*{opacity:1;transform:none;transition:none}}

    /* ── transcript sync: click a line to jump; the line being read is marked ──
       An accent bar sits in the left gutter (no layout shift). Marked lines get a
       pointer + a faint bar on hover; the active line's bar fills + text darkens. */
    .e-body.seekable > [data-seek]{cursor:pointer}
    .e-body > [data-seek]{position:relative}
    .e-body > [data-seek]::before{content:"";position:absolute;left:-16px;top:2px;bottom:2px;width:2px;
      background:var(--accent);border-radius:2px;opacity:0;transform:scaleY(.35);transform-origin:top center;
      transition:opacity .3s var(--ease),transform .35s var(--ease)}
    .e-body.seekable > [data-seek]:hover::before{opacity:.4;transform:scaleY(1)}
    .e-body > [data-seek].reading::before{opacity:1;transform:scaleY(1)}
    /* focus dim only while a listen is engaged — reading the page keeps full contrast */
    .e-body{transition:color .35s var(--ease)}
    .e-body.listening > [data-seek]{color:var(--text-2);transition:color .35s var(--ease)}
    .e-body.listening > [data-seek].reading{color:var(--text)}
    @media(max-width:560px){.e-body > [data-seek]::before{left:-12px}}
    @media(prefers-reduced-motion:reduce){.e-body > [data-seek]::before{transition:none}.e-body > [data-seek]{transition:none}}

    /* ── typed figure system (evidence, not decoration): pull-quote · mono table · hand-built SVG ── */
    .e-body .e-quote{margin:30px 0;padding:2px 0 2px 22px;border-left:2px solid var(--accent-line);
      font-family:var(--serif);font-size:26px;line-height:1.3;letter-spacing:0.01em;color:var(--text)}
    .e-body .e-quote cite{display:block;margin-top:11px;font-family:var(--mono);font-size:11px;font-style:normal;letter-spacing:0.04em;color:var(--text-3)}
    .e-body .e-fig{margin:32px 0}
    .e-body .e-fig svg{display:block;width:100%;height:auto}
    .e-body .e-figlabel{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}
    .e-body .e-cap{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:11px;line-height:1.55;max-width:60ch}
    .e-body .e-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;
      border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .e-body .e-table th,.e-body .e-table td{padding:10px 14px;border-bottom:1px solid var(--line-2)}
    .e-body .e-table tbody th{text-align:left;color:var(--text-2);font-weight:500}
    .e-body .e-table tbody td{text-align:right;color:var(--text);font-weight:500}
    .e-body .e-table tbody tr:last-child th,.e-body .e-table tbody tr:last-child td{border-bottom:0}
    .e-body .e-table tbody tr:hover th,.e-body .e-table tbody tr:hover td{background:var(--panel)}
    .e-body .e-table-cols thead th{text-align:left;color:var(--text-3);font-weight:500;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
    .e-body .e-table-cols tbody td{text-align:left;color:var(--text);font-weight:400;font-size:12px;line-height:1.5;vertical-align:top;width:50%}
    .e-body .e-table-cols tbody td:first-child{color:var(--text-2);border-right:1px solid var(--line-2)}

    /* ── interactive card deck (Control Plane series): a fanned display-card stack
       you cycle like a carousel — a modern mechanic worn in the house skin (paper
       cards, hairlines, mono labels, one accent). Deals itself once on scroll-in;
       front card tilts to the pointer; collapses to a readable vertical stack under
       reduced-motion. Content-justified: it visualizes the series' spine question. */
    .e-body .e-deck{margin:36px 0}
    .deck-stage{position:relative;-webkit-user-select:none;user-select:none;outline:none}
    .deck-cards{position:relative;height:var(--deck-h,264px);perspective:1500px}
    .deck-card{position:absolute;top:0;left:0;right:0;margin:0 auto;width:min(344px,90%);
      transform-style:preserve-3d;cursor:pointer;
      transition:transform .62s var(--ease),opacity .5s var(--ease)}
    .deck-inner{position:relative;min-height:200px;background:var(--panel);border:1px solid var(--line);
      border-radius:16px;padding:22px 22px 20px;transform-style:preserve-3d;
      box-shadow:0 1px 2px rgba(28,27,25,0.03);
      transition:transform .25s var(--ease),box-shadow .4s var(--ease),border-color .3s var(--ease)}
    .deck-inner::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:0 3px 3px 0;
      background:var(--accent);opacity:0;transition:opacity .4s var(--ease)}
    .deck-card.front{cursor:default}
    .deck-card.front .deck-inner{border-color:var(--accent-line);
      box-shadow:0 26px 50px -28px rgba(28,27,25,0.55),0 2px 0 rgba(28,27,25,0.02)}
    .deck-card.front .deck-inner::before{opacity:1}
    .deck-stage:focus-visible .deck-card.front .deck-inner{box-shadow:0 26px 50px -28px rgba(28,27,25,0.55),0 0 0 2px var(--accent-line)}
    .dc-n{position:absolute;top:2px;right:2px;font-family:var(--mono);font-size:12px;color:var(--text-3);letter-spacing:0.06em}
    .dc-kicker{font-family:var(--mono);font-size:10px;letter-spacing:0.17em;text-transform:uppercase;color:var(--accent)}
    .dc-title{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.12;color:var(--text);margin:9px 0 15px;letter-spacing:0.005em}
    .dc-axes{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-2);padding-top:14px;margin:0}
    .dc-ax{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;margin:0}
    .dc-ax dt{font-family:var(--mono);font-size:9px;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-3)}
    .dc-ax dd{margin:0;font-size:13.5px;line-height:1.42;color:var(--text-2)}
    .dc-ax.see dd{color:var(--text)}
    .deck-ui{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:18px}
    .deck-nav{font-family:var(--mono);font-size:15px;line-height:1;color:var(--text-2);width:33px;height:33px;
      border:1px solid var(--line);border-radius:50%;background:var(--panel);cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;transition:border-color .2s var(--ease),color .2s var(--ease)}
    .deck-nav:hover{border-color:var(--accent-line);color:var(--accent)}
    .deck-dots{display:flex;gap:8px}
    .deck-dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer;
      transition:background .3s var(--ease),transform .3s var(--ease)}
    .deck-dot.on{background:var(--accent);transform:scale(1.3)}
    /* reduced-motion / static: readable vertical stack, no overlap, no controls */
    .deck-stage.static .deck-cards{height:auto;perspective:none;display:flex;flex-direction:column;gap:12px}
    .deck-stage.static .deck-card{position:relative;transform:none!important;opacity:1!important;width:100%;margin:0}
    .deck-stage.static .deck-inner{border-color:var(--line)}
    .deck-stage.static .deck-inner::before{opacity:1}
    .deck-stage.static .deck-ui{display:none}
    @media(max-width:560px){
      .deck-cards{height:var(--deck-h,292px)}
      .dc-title{font-size:22px}
    }
    @media(prefers-reduced-motion:reduce){
      .deck-card,.deck-inner{transition:none}
    }

    /* citation row — a source named flatly under the paragraph that discounts it; never a perk chip */
    .e-ref{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin:-6px 0 24px}
    .e-ref a{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--text-2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;transition:all .2s var(--ease)}
    .e-ref a .arr{color:var(--text-3);transition:transform .2s var(--ease)}
    .e-ref a:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-dim)}
    .e-ref a:hover .arr{transform:translate(2px,-2px);color:var(--accent)}
    .e-ref-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:0.02em}

    /* ── section thesis headers (Control Plane series only): a mono kicker + a one-line
       CLAIM that carries the argument when read alone — never a topic label. Rendered
       from a separate sections[] array so body indices (and audio marks) never shift. ── */
    .e-body .e-sec{margin:44px 0 20px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:22px}
    .e-body .e-sec:first-child{margin-top:4px;padding-top:0;border-top:0}
    .e-sec .es-k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
    .e-sec .es-t{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(20px,3.1vw,25px);line-height:1.26;letter-spacing:0.005em;color:var(--text)}

    /* ── scroll-spy rail (desktop ≥1080px): a hairline section index tracking reading
       position. Mono labels, one accent on the active tick; it disappears into the skin
       and carries no motion beyond the active-state colour change. Hidden on narrow
       viewports — the in-body thesis headers + top progress bar do the wayfinding there. ── */
    .spy{position:fixed;top:50%;left:max(18px,calc((100vw - 680px)/2 - 174px));transform:translateY(-50%);
      z-index:40;display:none;flex-direction:column;gap:1px;width:160px}
    .spy-item{display:flex;align-items:center;gap:11px;padding:7px 0;background:none;border:0;cursor:pointer;
      text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:0.02em;color:var(--text-3);
      transition:color .25s var(--ease)}
    .spy-tick{flex:none;width:14px;height:1px;background:var(--line);transition:background .25s var(--ease),width .25s var(--ease)}
    .spy-k{min-width:0;line-height:1.3}
    .spy-item:hover{color:var(--text-2)}
    .spy-item:hover .spy-tick{background:var(--text-3);width:20px}
    .spy-item.on{color:var(--accent)}
    .spy-item.on .spy-tick{background:var(--accent);width:26px}
    @media(min-width:1080px){.spy.ready{display:flex}}
    @media(prefers-reduced-motion:reduce){.spy-item,.spy-tick{transition:none}}

    /* ── inline citation (primary sources): a bracketed superscript marker that reveals a
       source card on hover/focus/tap. Never a button in the flow; the prose stays the object.
       Attaches inside an existing <p> (after the sourced phrase), so it adds no .e-body child
       and the transcript-sync marks are untouched. ── */
    .cite{position:relative;display:inline-block}
    .cite-mk{font-family:var(--mono);font-size:0.64em;font-weight:500;color:var(--accent);cursor:pointer;
      padding:0 1px;vertical-align:super;line-height:0;transition:color .2s var(--ease);outline:none}
    .cite-mk::before{content:"["}
    .cite-mk::after{content:"]"}
    .cite:hover .cite-mk,.cite.open .cite-mk,.cite-mk:focus-visible{color:var(--text)}
    .cite-card{position:absolute;left:0;bottom:calc(100% + 9px);z-index:50;width:272px;max-width:76vw;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px 13px;
      box-shadow:0 18px 42px -22px rgba(28,27,25,0.5);
      opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
    .cite:hover .cite-card,.cite:focus-within .cite-card,.cite.open .cite-card{opacity:1;transform:none;pointer-events:auto}
    .cite-src{display:block;font-family:var(--mono);font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
    .cite-note{display:block;font-size:12.5px;line-height:1.5;color:var(--text-2);margin-bottom:11px}
    .cite-link{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--text-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;transition:border-color .2s var(--ease),color .2s var(--ease)}
    .cite-link:hover{border-color:var(--accent-line);color:var(--accent)}
    .cite-link .carr{color:var(--text-3);transition:transform .2s var(--ease)}
    .cite-link:hover .carr{transform:translate(2px,-2px);color:var(--accent)}
    @media(prefers-reduced-motion:reduce){.cite-card{transition:none;transform:none}}

    /* keep-reading loop — related essays + cross-links into stack/reading */
    .related{margin-top:46px;padding-top:26px;border-top:1px solid var(--line)}
    .rel-head{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
    .rel-list{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
    .rel-row{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:baseline;padding:11px 10px;border-radius:9px;border:1px solid transparent;transition:all .2s var(--ease)}
    .rel-row:hover{background:var(--panel);border-color:var(--line)}
    .rel-row .rmk{font-family:var(--mono);color:var(--text-3);font-size:13px;transition:all .2s var(--ease)}
    .rel-row:hover .rmk{color:var(--accent);transform:translateX(2px)}
    .rel-row .rt{font-size:15px;font-weight:500;color:var(--text);min-width:0;display:inline-block;transform-origin:left center;transition:transform .28s var(--ease),color .2s var(--ease)}
    .rel-row:hover .rt{color:var(--accent);transform:translateX(2px)}
    .rel-row .rc{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap;justify-self:end}
    .rel-cross{display:flex;flex-wrap:wrap;gap:10px}
    .rel-cross a{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--text-2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;transition:all .2s var(--ease)}
    .rel-cross a span{color:var(--text-3);transition:transform .2s var(--ease)}
    .rel-cross a:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-dim)}
    .rel-cross a:hover span{transform:translateX(2px);color:var(--accent)}
    @media(max-width:520px){.rel-row{grid-template-columns:16px 1fr}.rel-row .rc{grid-column:2;justify-self:start;margin-top:2px}}

    /* end-of-essay contact coda — the conversion point at peak conviction. Her own
       voice, a specific qualifying prompt (not "contact me"), operator-fast tell. */
    .essay-cta{margin:40px 0 0;padding:20px 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
    .essay-cta p{font-size:15px;color:var(--text-2);line-height:1.62;margin:0 0 15px}
    .essay-cta .cta-link{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-dim);border-radius:9px;padding:9px 14px;transition:border-color .2s var(--ease)}
    .essay-cta .cta-link:hover{border-color:var(--accent)}
    .essay-cta .cta-link span{transition:transform .2s var(--ease)}
    .essay-cta .cta-link:hover span{transform:translate(2px,-2px)}

    @media(max-width:560px){
      .wrap{padding:26px 18px 76px}
      .crumb{margin-bottom:30px}
      .e-body .e-quote{font-size:22px;padding-left:16px}
      .e-body .e-table{font-size:11.5px}
      .e-body .e-table th,.e-body .e-table td{padding:8px 10px}
      /* prev/next stack full-width — two ellipsized half-cards tell you nothing on a phone */
      .e-nav{flex-direction:column}
      .e-nav .next{text-align:left}
      .e-nav .nt{white-space:normal}
    }
  </style>
</head>
<body>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <div class="spot" id="spot" aria-hidden="true"></div>
  <div class="page" id="page"><div class="wrap" id="wrap"></div></div>
  <nav class="spy" id="spy" aria-label="Sections in this essay"></nav>
  <script src="essays.js"></script>
  <script src="audio-manifest.js"></script>
  <script>
  (function(){
    var ESSAYS = window.ESSAYS || [];
    var ERAS = window.ERAS || [];
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
    function q(name){ return new URLSearchParams(window.location.search).get(name); }

    var wrap = document.getElementById("wrap");

    /* pick up to 3 related essays: same category first, then same era, then anything */
    function related(idx){
      var e=ESSAYS[idx], out=[], seen={}; seen[idx]=1;
      function add(pred){ for(var j=0;j<ESSAYS.length && out.length<3;j++){ if(!seen[j] && pred(ESSAYS[j])){ seen[j]=1; out.push(ESSAYS[j]); } } }
      add(function(x){return x.category===e.category;});
      add(function(x){return x.era===e.era;});
      add(function(){return true;});
      return out;
    }
    /* staggered block reveal — on-brand alternative to a typewriter (every body block) */
    function reveal(){
      var blocks = wrap.querySelectorAll(".e-body > *");
      if(reduce){ blocks.forEach(function(p){ p.classList.add("in"); }); }
      else { blocks.forEach(function(p,idx){ setTimeout(function(){ p.classList.add("in"); }, 80 + Math.min(idx*40,320)); }); }
    }

    /* body block renderer. A bare string stays a <p> (all existing essays untouched);
       typed blocks add evidence-grade figures — pull-quote, mono table, hand-built SVG.
       Gated to real-or-illustrative per the honesty bar; raw SVG is our own authored markup. */
    function tableFig(b){
      var label = b.label?'<div class="e-figlabel">'+esc(b.label)+'</div>':'';
      var cap = b.cap?'<figcaption class="e-cap">'+esc(b.cap)+'</figcaption>':'';
      if(b.cols){ // two-column contrast table (structure, e.g. optimizer vs operator)
        var head="<thead><tr><th>"+esc(b.cols[0])+"</th><th>"+esc(b.cols[1])+"</th></tr></thead>";
        var crows=(b.rows||[]).map(function(r){ return "<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td></tr>"; }).join("");
        return '<figure class="e-fig">'+label+'<table class="e-table e-table-cols">'+head+'<tbody>'+crows+'</tbody></table>'+cap+'</figure>';
      }
      var rows = (b.rows||[]).map(function(r){
        return "<tr><th scope=\"row\">"+esc(r[0])+"</th><td>"+esc(r[1])+"</td></tr>";
      }).join("");
      return '<figure class="e-fig">'+label+'<table class="e-table"><tbody>'+rows+'</tbody></table>'+cap+'</figure>';
    }
    /* interactive comparison deck — a fanned card stack cycled like a carousel.
       Authored blocks only (our own markup, all text escaped); wired in wireDecks(). */
    function deckFig(b){
      var label = b.label?'<div class="e-figlabel">'+esc(b.label)+'</div>':'';
      var cap = b.cap?'<figcaption class="e-cap">'+esc(b.cap)+'</figcaption>':'';
      var cards = (b.cards||[]).map(function(c,i){
        var n = c.n || ("0"+(i+1)).slice(-2);
        return '<article class="deck-card" data-i="'+i+'" tabindex="-1" role="group" aria-roledescription="card" aria-label="'+esc((c.kicker||"")+" — "+(c.title||""))+'">'+
          '<div class="deck-inner">'+
            '<span class="dc-n">'+esc(n)+'</span>'+
            '<span class="dc-kicker">'+esc(c.kicker||"")+'</span>'+
            '<h3 class="dc-title">'+esc(c.title||"")+'</h3>'+
            '<dl class="dc-axes">'+
              '<div class="dc-ax see"><dt>sees</dt><dd>'+esc(c.see||"")+'</dd></div>'+
              '<div class="dc-ax stop"><dt>stops</dt><dd>'+esc(c.stop||"")+'</dd></div>'+
            '</dl>'+
          '</div></article>';
      }).join("");
      var dots = (b.cards||[]).map(function(_,i){
        return '<button class="deck-dot'+(i===0?' on':'')+'" type="button" aria-label="Show card '+(i+1)+'"'+(i===0?' aria-selected="true"':'')+'></button>';
      }).join("");
      return '<figure class="e-fig e-deck" data-deck>'+label+
        '<div class="deck-stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="'+esc(b.aria||b.label||"card deck")+'">'+
          '<div class="deck-cards">'+cards+'</div>'+
          '<div class="deck-ui">'+
            '<button class="deck-nav deck-prev" type="button" aria-label="Previous card">‹</button>'+
            '<div class="deck-dots">'+dots+'</div>'+
            '<button class="deck-nav deck-next" type="button" aria-label="Next card">›</button>'+
          '</div>'+
        '</div>'+cap+'</figure>';
    }
    /* markdown-style [text](url) links inside paragraphs — escape first, then linkify,
       so body strings still can't carry raw HTML. External links open in a new tab. */
    function para(s){
      var h = esc(s).replace(/\[([^\]]+)\]\(([^()\s]+)\)/g, function(_, txt, href){
        var ext = /^https?:\/\//.test(href);
        return '<a href="'+href+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+txt+'</a>';
      });
      return "<p>"+h+"</p>";
    }
    function blockHtml(b){
      if(typeof b==="string") return para(b);
      if(!b || !b.t) return "";
      if(b.t==="p") return para(b.text);
      if(b.t==="quote") return '<blockquote class="e-quote">'+esc(b.text)+(b.by?'<cite>'+esc(b.by)+'</cite>':'')+'</blockquote>';
      if(b.t==="table") return tableFig(b);
      if(b.t==="deck") return deckFig(b);
      if(b.t==="svg") return '<figure class="e-fig">'+(b.svg||"")+(b.cap?'<figcaption class="e-cap">'+esc(b.cap)+'</figcaption>':'')+'</figure>';
      if(b.t==="ref") return '<div class="e-ref"><a href="'+esc(b.href)+'" target="_blank" rel="noopener">'+esc(b.text)+' <span class="arr">↗</span></a>'+(b.meta?'<span class="e-ref-meta">'+esc(b.meta)+'</span>':'')+'</div>';
      return "";
    }
    /* stamp the body index onto each block's root element, so the transcript-sync
       seek-map can look a block up by attribute (querySelector('[data-b="N"]'))
       instead of by child position. That makes injected section headers (which carry
       no data-b) transparent to the audio marks — no reindex, no manifest edit. */
    function stampB(html,i){ return html.replace(/^<([a-zA-Z0-9]+)/, '<$1 data-b="'+i+'"'); }
    /* section thesis header, rendered from the essay's sections[] array (Control Plane
       series only). A separate .e-body child that carries no data-b — pure navigation. */
    function secHeadHtml(sections,i){
      if(!sections) return "";
      for(var s=0;s<sections.length;s++){
        if(sections[s].at===i){
          return '<h2 class="e-sec" id="sec-'+s+'" data-sec="'+s+'">'+
            '<span class="es-k">'+esc(sections[s].kicker||"")+'</span>'+
            '<span class="es-t">'+esc(sections[s].thesis||"")+'</span></h2>';
        }
      }
      return "";
    }
    /* inline citation marker — a designed source-card reveal. Primary sources only:
       we upgrade a claim that already has a real, held source; we never invent one.
       Injected AFTER the sourced phrase inside the paragraph's own HTML, so it adds no
       .e-body child (audio marks stay put). Marker is a role=button span (so a tap
       toggles the card rather than navigating); the real link lives inside the card. */
    function citeMarkerHtml(n,c){
      var host=""; try{ host=c.href?c.href.replace(/^https?:\/\//,"").replace(/\/$/,""):""; }catch(_){}
      var link=c.href?'<a class="cite-link" href="'+esc(c.href)+'" target="_blank" rel="noopener">'+esc(host||c.label||"source")+' <span class="carr" aria-hidden="true">↗</span></a>':'';
      return '<span class="cite">'+
        '<span class="cite-mk" role="button" tabindex="0" aria-label="Source: '+esc(c.label||"citation")+'">'+n+'</span>'+
        '<span class="cite-card" role="note">'+
          '<span class="cite-src">'+esc(c.label||"Source")+'</span>'+
          (c.note?'<span class="cite-note">'+esc(c.note)+'</span>':'')+
          link+
        '</span></span>';
    }
    /* find the (escaped) sourced phrase in the rendered paragraph HTML and splice the
       marker in right after it. First occurrence only; silently skips if not found. */
    function applyCites(html,i,cites,ctr){
      if(!cites) return html;
      for(var ci=0;ci<cites.length;ci++){
        var c=cites[ci]; if(c.at!==i || !c.phrase) continue;
        var needle=esc(c.phrase), pos=html.indexOf(needle);
        if(pos<0) continue;
        ctr.n++;
        var cut=pos+needle.length;
        html=html.slice(0,cut)+citeMarkerHtml(ctr.n,c)+html.slice(cut);
      }
      return html;
    }
    /* honest reading time — counted off the actual body text, ~220 wpm */
    function readMins(e){
      var w = 0;
      (e.body||[]).forEach(function(b){
        var t = typeof b==="string" ? b : (b && b.text) || "";
        if(t) w += t.split(/\s+/).length;
      });
      return Math.max(1, Math.round(w/220));
    }
    var curIdx = -1;
    function render(idx){
      curIdx = idx;
      var e = ESSAYS[idx];
      var eraLabel = (ERAS.filter(function(x){return x.key===e.era;})[0]||{}).label || "Writing";
      document.title = e.title + " — Diana Seo";
      var md = document.querySelector('meta[name="description"]');
      if(md && e.dek) md.setAttribute("content", e.dek);
      var prev = idx>0 ? ESSAYS[idx-1] : null;
      var next = idx<ESSAYS.length-1 ? ESSAYS[idx+1] : null;
      /* section headers (from sections[]) + inline citations (from cites[]) attach
         without adding/removing narrated body children, then each block is stamped
         with its body index for the attribute-based seek lookup. */
      var citeCtr={n:0};
      var bodyHtml = (e.body||[]).map(function(b,bi){
        return secHeadHtml(e.sections,bi) + stampB(applyCites(blockHtml(b),bi,e.cites,citeCtr),bi);
      }).join("");
      var au = (window.ESSAY_AUDIO||{})[e.slug];
      var hasMarks = au && au.marks && au.marks.length;
      var skipHtml =
        '<button class="listen-skip listen-back" type="button" aria-label="Back 10 seconds">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 8 7 12l4 4"/><path d="M7 12h7a4 4 0 1 1 0 8h-3"/></svg>10</button>'+
        '<button class="listen-skip listen-fwd" type="button" aria-label="Forward 10 seconds">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 8l4 4-4 4"/><path d="M17 12h-7a4 4 0 1 0 0 8h3"/></svg>10</button>';
      var noteTxt = hasMarks
        ? 'Synthetic narration — Diana’s words, read by an AI voice, not her own. Tap any line to jump there.'
        : 'Synthetic narration — Diana’s words, read by an AI voice, not her own.';
      var listenHtml = au ?
        '<div class="listen">'+
          '<div class="listen-row">'+
            '<button class="listen-btn" type="button" aria-label="Play AI narration of this essay">'+
              '<span class="lp-ico" aria-hidden="true"></span><span class="lp-txt">Listen · '+au.min+' min</span>'+
            '</button>'+
            skipHtml+
            '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>'+
            '<span class="listen-tag">AI voice</span>'+
          '</div>'+
          '<div class="listen-prog"><div class="listen-bar"><i></i></div><span class="listen-time">0:00 / 0:00</span></div>'+
          '<p class="listen-note">'+noteTxt+'</p>'+
          '<audio class="listen-audio" preload="metadata" src="audio/essays/'+encodeURIComponent(e.slug)+'.mp3"></audio>'+
        '</div>' : '';
      var relRows = related(idx).map(function(r){
        return '<a class="rel-row" href="essay.html?id='+encodeURIComponent(r.slug)+'"><span class="rmk">›</span>'+
          '<span class="rt">'+esc(r.title)+'</span><span class="rc">'+esc(r.category)+' · '+esc(r.period)+'</span></a>';
      }).join("");

      wrap.innerHTML =
        '<nav class="crumb"><a href="index.html">Diana Seo</a><span class="sep">/</span><a href="index.html">Writing</a><span class="sep">/</span><span class="here">'+esc(eraLabel)+'</span></nav>'+
        '<div class="e-meta"><span class="tag">'+esc(e.category)+'</span><span>'+esc(e.period)+'</span><span>'+readMins(e)+' min</span>'+(e.pinned?'<span class="draft">pinned</span>':'')+(e.status && e.status!=="live"?'<span class="draft">'+esc(e.status)+'</span>':'')+'</div>'+
        '<h1 class="e-title">'+esc(e.title)+'</h1>'+
        '<p class="e-dek">'+esc(e.dek)+'</p>'+
        listenHtml+
        '<div class="e-body">'+bodyHtml+'</div>'+
        '<section class="essay-cta">'+
          '<p>If something here is a problem you’re actually living — the growth loop that won’t compound, the developer tool engineers love but enterprises won’t buy yet, the inference bill outrunning the product — tell me what you’re wrestling with. I read every one.</p>'+
          '<a class="cta-link" href="mailto:diana@oriya.app?subject='+encodeURIComponent("Re: "+e.title)+'">Write to Diana <span>↗</span></a>'+
        '</section>'+
        '<section class="related">'+
          '<div class="rel-head">Keep reading</div>'+
          '<div class="rel-list">'+relRows+'</div>'+
          '<div class="rel-cross"><a href="stack.html">Stack — how I build <span>→</span></a><a href="reading.html">Reading — the canon <span>→</span></a></div>'+
        '</section>'+
        '<nav class="e-nav">'+
          (prev?'<a href="essay.html?id='+encodeURIComponent(prev.slug)+'"><div class="dir">← Newer</div><div class="nt">'+esc(prev.title)+'</div></a>':'<a class="disabled"><div class="dir">← Newer</div><div class="nt">—</div></a>')+
          (next?'<a class="next" href="essay.html?id='+encodeURIComponent(next.slug)+'"><div class="dir">Older →</div><div class="nt">'+esc(next.title)+'</div></a>':'<a class="next disabled"><div class="dir">Older →</div><div class="nt">—</div></a>')+
        '</nav>'+
        '<a class="back" href="index.html">← All writing</a>';
      /* scroll-spy rail: built only for essays that carry sections (the Control Plane
         series); cleared otherwise so every other essay is visually unchanged. */
      var spyEl=document.getElementById("spy");
      if(spyEl){
        if(e.sections && e.sections.length){
          spyEl.innerHTML=e.sections.map(function(s,si){
            return '<button class="spy-item" type="button" data-to="sec-'+si+'">'+
              '<span class="spy-tick" aria-hidden="true"></span><span class="spy-k">'+esc(s.kicker||"")+'</span></button>';
          }).join("");
          spyEl.classList.add("ready");
        } else { spyEl.innerHTML=""; spyEl.classList.remove("ready"); }
      }
      reveal();
      wireListen();
      wireDecks();
      wireSpy();
      wireCites();
    }

    /* scroll-spy: track which section thesis is being read and let the rail jump to it.
       Re-wired each render (SPA nav); the observer is disconnected first so detached
       nodes don't leak. Click-scroll respects prefers-reduced-motion. */
    var spyObserver=null;
    function wireSpy(){
      if(spyObserver){ spyObserver.disconnect(); spyObserver=null; }
      var spyEl=document.getElementById("spy");
      if(!spyEl || !spyEl.classList.contains("ready")) return;
      var items=Array.prototype.slice.call(spyEl.querySelectorAll(".spy-item"));
      var heads=Array.prototype.slice.call(wrap.querySelectorAll(".e-sec"));
      if(!items.length || !heads.length) return;
      function activate(k){ for(var j=0;j<items.length;j++) items[j].classList.toggle("on", j===k); }
      items.forEach(function(it){
        it.addEventListener("click", function(){
          var t=document.getElementById(it.getAttribute("data-to")); if(!t) return;
          t.scrollIntoView({behavior:reduce?"auto":"smooth", block:"start"});
        });
      });
      activate(0);
      if("IntersectionObserver" in window){
        var vis={};
        spyObserver=new IntersectionObserver(function(entries){
          entries.forEach(function(en){ var k=heads.indexOf(en.target); if(k>=0) vis[k]=en.isIntersecting; });
          var best=-1; for(var k=0;k<heads.length;k++){ if(vis[k]){ best=k; break; } }
          if(best>=0) activate(best);
        }, {rootMargin:"-14% 0px -72% 0px", threshold:0});
        heads.forEach(function(h){ spyObserver.observe(h); });
      }
    }

    /* inline citations: a tap/click on the bracketed marker toggles its source card
       (hover/focus already reveal it via CSS). stopPropagation keeps the tap from also
       firing the tap-to-seek transcript handler on the paragraph. */
    function closeCites(){ var o=wrap.querySelectorAll(".cite.open"); Array.prototype.forEach.call(o,function(c){ c.classList.remove("open"); }); }
    /* keep the source card inside the viewport regardless of where the marker wraps —
       shift it left if it would overrun the right edge, but never past the left edge. */
    function placeCard(box){
      var card=box.querySelector(".cite-card"); if(!card) return;
      card.style.left="0px";
      var r=card.getBoundingClientRect(), pad=10, dx=0;
      if(r.right>window.innerWidth-pad) dx=(window.innerWidth-pad)-r.right;
      if(r.left+dx<pad) dx=pad-r.left;
      if(dx) card.style.left=dx+"px";
    }
    function wireCites(){
      var boxes=wrap.querySelectorAll(".cite");
      Array.prototype.forEach.call(boxes, function(box){
        var mk=box.querySelector(".cite-mk");
        box.addEventListener("mouseenter", function(){ placeCard(box); });
        if(!mk) return;
        function toggle(ev){ ev.stopPropagation(); ev.preventDefault();
          var was=box.classList.contains("open"); closeCites(); if(!was){ box.classList.add("open"); placeCard(box); } }
        mk.addEventListener("click", toggle);
        mk.addEventListener("focus", function(){ placeCard(box); });
        mk.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" ") toggle(ev); });
      });
    }
    document.addEventListener("click", function(ev){ if(!ev.target.closest(".cite")) closeCites(); });
    document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeCites(); });

    /* interactive card deck: fanned display-card stack, cycled like a carousel.
       Deals itself once on scroll-in (staggered), front card tilts to the pointer,
       arrows/dots/click cycle it. Reduced-motion → static readable stack. */
    function wireDecks(){
      var decks = wrap.querySelectorAll("[data-deck]");
      Array.prototype.forEach.call(decks, function(fig){
        var stage = fig.querySelector(".deck-stage");
        var cards = Array.prototype.slice.call(fig.querySelectorAll(".deck-card"));
        var dots  = Array.prototype.slice.call(fig.querySelectorAll(".deck-dot"));
        var N = cards.length; if(!N || !stage) return;
        var active = 0, dealt = false;
        if(reduce){ stage.classList.add("static"); return; }

        function metrics(){
          var narrow = window.innerWidth < 560;
          return { x:narrow?15:34, y:narrow?10:13, rot:narrow?2.6:5, sc:0.055, op:0.19 };
        }
        function place(){
          var m = metrics(), i;
          for(i=0;i<N;i++){
            var c=cards[i], rank=(i-active+N)%N, front=rank===0;
            c.classList.toggle("front", front);
            c.setAttribute("aria-hidden", front?"false":"true");
            c.setAttribute("tabindex", front?"0":"-1");
            c.style.zIndex = String(N - rank);
            if(!dealt){ c.style.opacity="0"; c.style.transform="translate3d(0,24px,0) scale(.92)"; continue; }
            c.style.opacity = String(Math.max(0.3, 1 - rank*m.op));
            c.style.transform = "translate3d("+(rank*m.x)+"px,"+(rank*m.y)+"px,0) rotate("+(rank*m.rot)+"deg) scale("+(1-rank*m.sc)+")";
          }
          for(i=0;i<dots.length;i++){ dots[i].classList.toggle("on", i===active); dots[i].setAttribute("aria-selected", i===active?"true":"false"); }
        }
        function go(k){ active=(k%N+N)%N; place(); }
        function deal(){
          if(dealt) return; dealt=true;
          for(var i=0;i<N;i++){ cards[i].style.transitionDelay=(((i-active+N)%N)*55)+"ms"; }
          place();
          setTimeout(function(){ for(var j=0;j<N;j++) cards[j].style.transitionDelay=""; }, 850);
        }

        cards.forEach(function(c){ c.addEventListener("click", function(){
          if(!dealt){ deal(); return; }
          var i=+c.getAttribute("data-i");
          if(i===active) go(active+1); else go(i);
        }); });
        var prev=fig.querySelector(".deck-prev"), next=fig.querySelector(".deck-next");
        if(prev) prev.addEventListener("click", function(){ deal(); go(active-1); });
        if(next) next.addEventListener("click", function(){ deal(); go(active+1); });
        dots.forEach(function(d,i){ d.addEventListener("click", function(){ deal(); go(i); }); });
        /* arrows cycle the deck when it (or a child) has focus — swallow the event so
           the page-level ←/→ essay nav doesn't also fire. */
        stage.addEventListener("keydown", function(ev){
          if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){
            ev.preventDefault(); ev.stopPropagation(); deal(); go(active+(ev.key==="ArrowRight"?1:-1));
          }
        });
        /* front card tilts toward the pointer — decoupled from the fan transform */
        stage.addEventListener("pointermove", function(ev){
          if(!dealt) return;
          var front=cards[active], inner=front&&front.querySelector(".deck-inner"); if(!inner) return;
          var r=front.getBoundingClientRect();
          var px=(ev.clientX-r.left)/r.width-0.5, py=(ev.clientY-r.top)/r.height-0.5;
          inner.style.transform="rotateY("+(px*7).toFixed(2)+"deg) rotateX("+(-py*7).toFixed(2)+"deg)";
        });
        stage.addEventListener("pointerleave", function(){
          cards.forEach(function(c){ var inner=c.querySelector(".deck-inner"); if(inner) inner.style.transform=""; });
        });
        window.addEventListener("resize", function(){ if(dealt && document.body.contains(fig)) place(); });

        place(); // resting (undealt): a tight pile
        if("IntersectionObserver" in window){
          var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ deal(); io.disconnect(); } }); }, {threshold:0.3});
          io.observe(fig);
        } else { deal(); }
      });
    }

    /* wire the listen player (native <audio> under a house-styled control).
       Re-run every render; the SPA nav replaces innerHTML, so the old audio
       element is detached and playback stops on its own — no leak. */
    function fmtT(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
    function wireListen(){
      var box=wrap.querySelector(".listen"); if(!box) return;
      var au=box.querySelector(".listen-audio"), btn=box.querySelector(".listen-btn"),
          bar=box.querySelector(".listen-bar"), fill=box.querySelector(".listen-bar > i"),
          tspan=box.querySelector(".listen-time"), txt=box.querySelector(".lp-txt"),
          bk=box.querySelector(".listen-back"), fw=box.querySelector(".listen-fwd");
      function showMeta(){ box.classList.add("ready"); tspan.textContent="0:00 / "+fmtT(au.duration); }
      if(au.readyState>=1) showMeta();                    // metadata already cached
      au.addEventListener("loadedmetadata", showMeta);
      btn.addEventListener("click", function(){ if(au.paused){ au.play().catch(function(){}); } else { au.pause(); } });
      if(bk) bk.addEventListener("click", function(){ au.currentTime=Math.max(0,au.currentTime-10); });
      if(fw) fw.addEventListener("click", function(){ au.currentTime=Math.min(au.duration||1e9,au.currentTime+10); });
      au.addEventListener("play", function(){ box.classList.add("playing"); if(eBody) eBody.classList.add("listening"); txt.textContent="Pause"; });
      au.addEventListener("pause", function(){ box.classList.remove("playing"); txt.textContent="Resume"; });
      au.addEventListener("ended", function(){ box.classList.remove("playing"); if(eBody) eBody.classList.remove("listening"); txt.textContent="Replay"; fill.style.width="0%"; setReading(-1); });

      /* ── transcript sync: map each timing mark to its body block ──
         au.marks = [{b:<bodyBlockIndex==.e-body child index>, t:<startSec>}] */
      var eBody=wrap.querySelector(".e-body");
      var meta=(window.ESSAY_AUDIO||{})[ESSAYS[curIdx].slug]||{};
      var MK=meta.marks;
      var segs=[];                        // [{el, t}] in play order
      if(eBody && MK && MK.length){
        eBody.classList.add("seekable");
        for(var mi=0;mi<MK.length;mi++){
          /* look up by stamped body index, not child position, so injected section
             headers don't shift the mapping (marks reference original body indices). */
          var el=eBody.querySelector('[data-b="'+MK[mi].b+'"]');
          if(el){ el.setAttribute("data-seek",""); segs.push({el:el, t:MK[mi].t}); }
        }
      }
      var lastSeg=-1;
      function setReading(k){
        if(k===lastSeg) return;
        if(lastSeg>=0 && segs[lastSeg]) segs[lastSeg].el.classList.remove("reading");
        if(k>=0 && segs[k]) segs[k].el.classList.add("reading");
        lastSeg=k;
      }
      function activeSeg(tCur){
        var k=-1; for(var j=0;j<segs.length;j++){ if(segs[j].t<=tCur+0.04) k=j; else break; } return k;
      }
      /* click a line -> seek to its start + play (podcast transcript behaviour).
         Ignore clicks on inline links/figures so citations still navigate. */
      if(segs.length){
        eBody.addEventListener("click", function(ev){
          if(ev.target.closest("a") || ev.target.closest(".cite")) return;
          var line=ev.target.closest("[data-seek]"); if(!line) return;
          for(var j=0;j<segs.length;j++){ if(segs[j].el===line){
            au.currentTime=segs[j].t+0.001; eBody.classList.add("listening"); setReading(j);
            au.play().catch(function(){}); break;
          } }
        });
      }

      au.addEventListener("timeupdate", function(){
        if(au.duration){ fill.style.width=(au.currentTime/au.duration*100)+"%"; }
        tspan.textContent=fmtT(au.currentTime)+" / "+fmtT(au.duration);
        if(segs.length) setReading(activeSeg(au.currentTime));
      });
      bar.addEventListener("click", function(ev){
        if(!au.duration) return; var r=bar.getBoundingClientRect();
        au.currentTime=Math.min(au.duration, Math.max(0,(ev.clientX-r.left)/r.width)*au.duration);
      });
    }

    var id = q("id");
    var i = -1;
    for(var k=0;k<ESSAYS.length;k++){ if(ESSAYS[k].slug===id){ i=k; break; } }

    if(i<0){
      document.title = "Not found — Diana Seo";
      wrap.innerHTML = '<div class="nf"><h1>Essay not found</h1><p>That piece isn’t in the ledger.</p><a class="back" href="index.html">← All writing</a></div>';
    } else {
      render(i);
      try{ history.replaceState({i:i},"","essay.html?id="+encodeURIComponent(ESSAYS[i].slug)); }catch(_){}

      /* reload-free essay↔essay transition — mechanic approved, metaphor buried (Dawn+Sable):
         a ~16px opacity-led nudge, interruptible (rapid clicks cancel-and-jump, never queue). */
      var animGen=0, busy=false;
      function idxOfSlug(s){ for(var j=0;j<ESSAYS.length;j++){ if(ESSAYS[j].slug===s) return j; } return -1; }
      function swap(idx,push){
        render(idx);
        window.scrollTo(0,0);
        if(push){ try{ history.pushState({i:idx},"","essay.html?id="+encodeURIComponent(ESSAYS[idx].slug)); }catch(_){} }
      }
      function navTo(idx,dir,push){
        if(idx<0||idx>=ESSAYS.length||idx===curIdx) return;
        if(reduce || busy){ animGen++; busy=false; wrap.style.transition="none"; wrap.style.opacity="1"; wrap.style.transform="none"; swap(idx,push); return; }
        busy=true; var g=++animGen;
        wrap.style.transition="opacity .19s var(--ease),transform .19s var(--ease)";
        wrap.style.opacity="0"; wrap.style.transform="translateX("+(dir>0?-16:16)+"px)";
        setTimeout(function(){
          if(g!==animGen) return;
          swap(idx,push);
          wrap.style.transition="none";
          wrap.style.opacity="0"; wrap.style.transform="translateX("+(dir>0?16:-16)+"px)";
          requestAnimationFrame(function(){
            if(g!==animGen) return;
            wrap.style.transition="opacity .22s var(--ease),transform .22s var(--ease)";
            wrap.style.opacity="1"; wrap.style.transform="none";
            setTimeout(function(){ if(g===animGen) busy=false; },240);
          });
        },150);
      }
      wrap.addEventListener("click", function(ev){
        if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey||ev.button!==0) return;
        var a=ev.target.closest('a[href^="essay.html?id="]'); if(!a) return;
        var slug=decodeURIComponent((a.getAttribute("href").split("?")[1]||"").replace(/^id=/,""));
        var t=idxOfSlug(slug); if(t<0) return;
        ev.preventDefault();
        navTo(t, t>curIdx?1:-1, true);
      });
      window.addEventListener("popstate", function(){
        var t=idxOfSlug(q("id")||""); if(t<0||t===curIdx) return;
        navTo(t, t>curIdx?1:-1, false);
      });
      /* ←/→ walk the ledger — same direction semantics as the prev/next cards */
      document.addEventListener("keydown", function(ev){
        if(ev.metaKey||ev.ctrlKey||ev.altKey) return;
        var t=ev.target;
        if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
        if(ev.key==="ArrowLeft" && curIdx>0){ navTo(curIdx-1,-1,true); }
        else if(ev.key==="ArrowRight" && curIdx<ESSAYS.length-1){ navTo(curIdx+1,1,true); }
      });
    }

    /* cursor spotlight */
    var spot=document.getElementById("spot");
    if(spot && !reduce){
      var sraf=null,smx=0,smy=0;
      window.addEventListener("pointermove",function(e){
        smx=e.clientX; smy=e.clientY;
        if(!sraf) sraf=requestAnimationFrame(function(){
          spot.style.setProperty("--mx",smx+"px");
          spot.style.setProperty("--my",smy+"px");
          spot.classList.add("on"); sraf=null;
        });
      },{passive:true});
      document.addEventListener("mouseleave",function(){ spot.classList.remove("on"); });
    }

    /* reading progress */
    var prog=document.getElementById("prog");
    if(prog){
      var praf=null;
      function drawProg(){
        var h=document.documentElement;
        var max=h.scrollHeight-window.innerHeight;
        prog.style.transform="scaleX("+(max>0?Math.min(1,Math.max(0,(window.scrollY||h.scrollTop)/max)):0)+")";
        praf=null;
      }
      window.addEventListener("scroll",function(){ if(!praf) praf=requestAnimationFrame(drawProg); },{passive:true});
      drawProg();
    }

    requestAnimationFrame(function(){ document.getElementById("page").classList.add("in"); });
  })();
  </script>
</body>
</html>
