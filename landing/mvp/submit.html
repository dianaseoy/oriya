<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Oriya · Submit your score</title>
  <!-- ManualProofUpload — the whole submission pipeline's front end.
       POST /api/manual-submit forwards one email (screenshot attached) to
       team@oriya.app; the founder normalizes by hand. If the endpoint isn't
       configured yet it falls back to a prefilled mail draft. No OCR, no AI,
       no accounts — premium chrome over a deliberately manual workflow.
       Success moment = a message from Ori (deterministic caddy read + optional
       tap-to-play voice note via /api/caddy-voice; the note only mounts if TTS
       succeeds, so a 503 leaves a clean text-only message). -->
  <style>
    :root { --bg:#0B0C0E; --panel:#101114; --line:#23252B; --text:#E6E7EA; --dim:#8A8F98; --accent:#7FB79E; --amber:#D7A25C; }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--text); font:15px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:440px; margin:0 auto; padding:32px 18px 80px; }
    .mono { font-family:ui-monospace,"JetBrains Mono",monospace; }
    .kicker { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
    h1 { font-size:22px; font-weight:600; letter-spacing:-0.02em; margin-top:6px; }
    .dim { color:var(--dim); } .sm { font-size:12.5px; } .xs { font-size:11px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:16px; }
    label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:16px 0 6px; }
    input, select { width:100%; font:inherit; background:#0D0E11; border:1px solid var(--line); border-radius:9px; color:var(--text); padding:11px 12px; outline:none; }
    input:focus, select:focus { border-color:var(--accent); }
    .devices { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .dev { border:1px solid var(--line); border-radius:10px; background:#0D0E11; color:var(--text); padding:11px 12px; font:inherit; font-size:13.5px; cursor:pointer; text-align:left; transition:all .2s ease; }
    .dev:hover { border-color:#3A3D45; }
    .dev.on { border-color:var(--accent); background:rgba(127,183,158,.07); }
    .drop { border:1.5px dashed var(--line); border-radius:10px; padding:18px; text-align:center; cursor:pointer; transition:all .2s ease; }
    .drop:hover, .drop.over { border-color:var(--accent); }
    .drop.over { background:rgba(127,183,158,.05); }
    .drop img { max-width:100%; max-height:160px; border-radius:8px; }
    .rm { display:block; margin:10px auto 0; background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:7px; padding:5px 14px; font:inherit; font-size:12px; cursor:pointer; }
    .rm:hover { color:var(--text); border-color:#3A3D45; }
    .banner { border:1px solid rgba(215,162,92,.4); background:rgba(215,162,92,.08); border-radius:10px; padding:12px 14px; font-size:13px; margin-top:16px; }
    .btn { width:100%; margin-top:20px; position:relative; overflow:hidden; background:var(--accent); color:#0B0C0E; border:0; border-radius:10px; padding:13px; font:inherit; font-weight:600; cursor:pointer; transition:all .2s ease; }
    .btn:hover { filter:brightness(1.08); }
    .btn::after { content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); background-size:220% 100%; background-position:200% 0; opacity:0; transition:opacity .2s ease; pointer-events:none; }
    .btn:hover::after { opacity:1; animation:shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    @media (prefers-reduced-motion: reduce) { .btn:hover::after { animation:none; opacity:0; } }
    .btn:disabled { opacity:.5; cursor:default; }
    .rm { transition:all .2s ease; }
    .err { color:var(--amber); font-size:12px; margin-top:10px; }
    .success h2 { font-size:24px; font-weight:600; letter-spacing:-0.02em; }
    /* Ori's message — voice-note pattern. Arrives complete (no typing theater);
       motion is the approved fade-up only. */
    .msg-kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:20px; }
    .msg { border:1px solid rgba(127,183,158,.3); background:rgba(127,183,158,.06); border-radius:14px; border-top-left-radius:4px; padding:14px 16px; margin-top:8px; text-align:left; }
    .avatar { width:26px; height:26px; flex:none; border-radius:99px; border:1px solid rgba(127,183,158,.5); background:rgba(127,183,158,.1); color:var(--accent); font-weight:600; font-size:14px; display:inline-flex; align-items:center; justify-content:center; }
    .msg-head { display:flex; align-items:center; gap:8px; }
    .sender { font-size:12px; font-weight:600; }
    .vtag { font-size:10px; color:var(--dim); }
    .msg-body { font-size:13.5px; line-height:1.55; margin-top:9px; }
    .vnote { display:flex; align-items:center; gap:10px; max-width:250px; margin-top:12px; border:1px solid rgba(127,183,158,.3); background:rgba(127,183,158,.07); border-radius:10px; padding:8px 10px; }
    .vplay { width:32px; height:32px; flex:none; border:0; border-radius:99px; background:var(--accent); color:#0B0C0E; font-size:11px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .vplay:hover { filter:brightness(1.08); }
    .wave { display:flex; align-items:center; gap:2px; height:16px; flex:1; }
    .wave span { width:3px; border-radius:2px; background:var(--dim); opacity:.55; }
    .wave span.on { background:var(--accent); opacity:1; }
    .vdur { font-size:11px; min-width:30px; text-align:right; }
    .arrive { opacity:0; animation:arrive .45s ease forwards; }
    @keyframes arrive { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .arrive { animation:none; opacity:1; transform:none; } }
  </style>
</head>
<body>
  <div id="root" class="wrap"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const DEVICES = ["Oura", "Whoop", "Garmin", "Apple Health"];
    // Instant normalization — same factors as landing/mvp/logic.js + worker/submit.js.
    // Raw device score → one comparable 0-100 Oriya Index, computed on the spot.
    const MODEL = { "Oura": [0.97, 2.5], "Whoop": [0.92, -1.0], "Garmin": [0.95, 0.0], "Apple Health": [0.90, 1.0] };
    const oriyaIndex = (raw, device) => {
      const [factor, offset] = MODEL[device] || [1.0, 0.0];
      return Math.max(0, Math.min(100, Math.round(raw * factor + offset)));
    };

    // Same event-key shape as try.html's track() so the two dataLayers merge.
    window.dataLayer = window.dataLayer || [];
    function track(event, props) {
      const payload = Object.assign({ event: event, ts: Date.now() }, props || {});
      window.dataLayer.push(payload);
      try { if (window.ORIYA_INGEST_URL && navigator.sendBeacon) navigator.sendBeacon(window.ORIYA_INGEST_URL, JSON.stringify(payload)); } catch (e) {}
    }

    /* Ori's read. Unlike /try (where the index is already baseline-relative and
       par is the fixed 71), this page has no server baseline — so "your par" is
       the average of YOUR prior submissions kept in this browser, and the first
       card gets a welcome line instead of a fabricated gap. Canon holds: over
       par = beating your own usual; copy is descriptive, never advice. */
    const HISTORY_KEY = "oriya:mvp-history";
    const dayKey = () => new Date().toISOString().slice(0, 10);
    const readHistory = () => {
      try { const v = JSON.parse(localStorage.getItem(HISTORY_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; }
    };
    function personalPar() {
      const past = readHistory().filter((h) => h.day !== dayKey() && typeof h.oriya === "number");
      if (!past.length) return null;
      return Math.round(past.reduce((s, h) => s + h.oriya, 0) / past.length);
    }
    function logHistory(oriya) {
      const rest = readHistory().filter((h) => h.day !== dayKey());
      rest.push({ day: dayKey(), oriya: oriya });
      // 7-day window — the par lives on the same clock as the board
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(rest.slice(-7))); } catch (e) {}
    }

    function caddyLine(oriya, par, side) {
      const founders = side === "Founders", operators = side === "Operators";
      const device = side === "Oura" || side === "Whoop" ? side : "";
      // First card: warm welcome, side-flavored, never a verdict — the old
      // "guess at your par / better than your ring" line read cold and cocky.
      if (par == null) {
        if (founders) return "Welcome in — first card reads " + oriya + ", Founders' side. Day one has no par: nothing to beat yet, just a starting point that's all yours. Each morning from here teaches me what a good day looks like for you. Your first real read is waiting tomorrow.";
        if (operators) return "Welcome in — first card reads " + oriya + ", Operators' side. No par on day one — this number is a starting point, not a verdict. Give me a few mornings and I'll learn your rhythm. Your first real read is waiting tomorrow.";
        if (device) return "First card down — " + oriya + ", straight off your " + device + ". No par yet: yours comes from your own mornings, nobody else's. Log tomorrow and the picture starts to sharpen. Good to have you on the board.";
        return "Welcome to the board — your first card reads " + oriya + ". Day one has no par: this number is a starting point, not a verdict. Every morning from here teaches me what a good day looks like for you. Your first real read lands tomorrow.";
      }
      const gap = oriya - par;
      if (gap > 0) {
        if (founders) return "Sitting " + gap + " over your par today. You control the calendar and it shows. Capitalize on the clear air.";
        if (operators) return gap + " over par. Machine-like discipline through a launch window. The system is clean. Keep executing.";
        if (device) return gap + " over your par — and your " + device + " knows it. Post it before the board fills up.";
        return "You're " + gap + " over your par. That's you beating your own usual morning — the number earned it, not the algo. Clear air up there. Bank it and let the board see the gap.";
      }
      if (gap < 0) {
        const n = Math.abs(gap);
        if (founders) return "You're " + n + " under your par. The schedule is yours, but the crunch is catching up. Soft morning. Protect the baseline.";
        if (operators) return n + " under par today. Heavy headwind on the operational baseline. The margin is thin. Steady round.";
        return n + " under your par this morning. Not a bad number — a heavier one than your usual. Headwind on the card today. Soft round, still a round. It's logged; that's the streak.";
      }
      if (founders) return "Level with your par. Holding your usual on a full calendar — steady air, keep it.";
      if (operators) return "Dead level with par. The machine is running exactly at spec. Hold the line.";
      return "Dead level with your par. No drama, no gift — you posted exactly your usual morning. That's a signal too. Hold the line and log it.";
    }

    // Static waveform — fixed heights, no audio analysis; the playhead sweep
    // just tints bars by elapsed fraction.
    const WAVE = [3, 6, 9, 5, 11, 13, 7, 4, 9, 6, 11, 8, 5, 10, 13, 6, 3, 7, 9, 5, 8, 11, 4, 6];

    function OriMessage({ oriya, par, side }) {
      const line = caddyLine(oriya, par, side);
      const team = side === "Operators" ? "operators" : "founders";
      const [voiceUrl, setVoiceUrl] = useState(null);
      const [playing, setPlaying] = useState(false);
      const [dur, setDur] = useState(0);
      const [at, setAt] = useState(0);
      const audioRef = useRef(null);
      const fetched = useRef(false);
      useEffect(() => {
        if (fetched.current) return;
        fetched.current = true;
        track("caddy_message_shown", { oriya: oriya, team: team, gap: par == null ? null : oriya - par });
        // One background TTS call per submission; the voice note only mounts on
        // success — a 503 (key not wired yet) leaves a clean text-only message.
        fetch("/api/caddy-voice", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: line, team: team }),
        })
          .then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
          .then((b) => { setVoiceUrl(URL.createObjectURL(b)); track("caddy_voice_ready", { team: team }); })
          .catch((e) => track("caddy_voice_failed", { team: team, status: String(e && e.message || e) }));
      }, []);
      const toggle = () => {
        const a = audioRef.current;
        if (!a) return;
        if (a.paused) { a.play(); track("caddy_voice_played", { team: team }); } else { a.pause(); }
      };
      const lit = dur > 0 ? Math.floor((at / dur) * WAVE.length) : 0;
      const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
      return (
        <div className="arrive" style={{ animationDelay: ".35s" }}>
          <p className="msg-kicker">Ori left you a read</p>
          <div className="msg">
            <div className="msg-head">
              <span className="avatar">o</span>
              <span className="sender">Ori · your caddy</span>
              <span className="vtag">v0.1</span>
            </div>
            <p className="msg-body">{line}</p>
            {voiceUrl && (
              <div className="vnote arrive">
                <button type="button" className="vplay" onClick={toggle} aria-label={playing ? "Pause Ori's voice note" : "Play Ori's voice note"}>{playing ? "❚❚" : "▶"}</button>
                <span className="wave" aria-hidden="true">{WAVE.map((h, i) => <span key={i} className={i < lit ? "on" : ""} style={{ height: h }} />)}</span>
                <span className="vdur mono dim">{dur ? fmt(playing || at > 0 ? at : dur) : "· · ·"}</span>
                <audio ref={audioRef} src={voiceUrl} preload="metadata"
                  onLoadedMetadata={(e) => setDur(isFinite(e.target.duration) ? e.target.duration : 0)}
                  onTimeUpdate={(e) => setAt(e.target.currentTime)}
                  onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
                  onEnded={() => { setPlaying(false); setAt(0); }} />
              </div>
            )}
          </div>
        </div>
      );
    }
    const CHALLENGES = ["Founders vs Operators", "Marina Run Club", "Ring vs Band", "Open board"];
    // Exact-title map to the /try board details (no entry for Open board on purpose)
    const TRY_ID = { "Founders vs Operators": "founders", "Marina Run Club": "marina", "Ring vs Band": "devicewars" };
    // Two-sided challenges get an in-form picker (panel, 2026-07-13) — Marina's
    // sides ("Marina RC"/"Stanford") don't match this page's shorter title, so
    // it keeps the outbound "see the live board" link instead of a picker.
    const SIDES = { "Founders vs Operators": ["Founders", "Operators"], "Ring vs Band": ["Oura", "Whoop"] };
    const params = new URLSearchParams(location.search);
    // /try deep-links "Title — Side" (side already picked there) — split it so
    // the side lands in its own field instead of riding inside the title string.
    const paramRaw = (params.get("challenge") || "").slice(0, 80);
    let paramChallenge = paramRaw, paramSide = "";
    const dash = paramRaw.indexOf(" — ");
    if (dash > 0) {
      const base = paramRaw.slice(0, dash), side = paramRaw.slice(dash + 3);
      if (SIDES[base] && SIDES[base].indexOf(side) >= 0) { paramChallenge = base; paramSide = side; }
    }
    // surface unrecognized challenge titles as the first option instead of silently snapping to the default.
    const CHALLENGE_OPTIONS = paramChallenge && CHALLENGES.indexOf(paramChallenge) < 0
      ? [paramChallenge].concat(CHALLENGES) : CHALLENGES;

    // Fallback = the one-click email draft (attachment added by the user; a
    // mailto: can never attach files, so we say that plainly).
    function mailDraft(f) {
      const challengeLabel = f.side ? f.challenge + " — " + f.side : f.challenge;
      return "mailto:team@oriya.app?subject=" + encodeURIComponent("Oriya Challenge Submission")
        + "&body=" + encodeURIComponent("Email:\n" + f.email + "\n\nDevice:\n" + f.device + "\n\nRaw Score:\n" + f.score
          + (f.challenge ? "\n\nChallenge:\n" + challengeLabel : "") + (f.code ? "\n\nInvite code:\n" + f.code : "")
          + "\n\nSubmitted:\n" + new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })
          + "\n\n(Attach your recovery screenshot before sending.)");
    }

    function ManualProofUpload() {
      const [f, setF] = useState({
        email: "", device: params.get("device") || "", score: "",
        challenge: paramChallenge || CHALLENGES[0], side: paramSide, code: params.get("code") || "",
      });
      const [img, setImg] = useState(null);          // dataURL for POST + preview
      const [drag, setDrag] = useState(false);
      const [state, setState] = useState("form");    // form | sending | done | fallback
      const [err, setErr] = useState("");
      const fileRef = useRef(null);

      const pick = (file) => {
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { setErr("Keep the screenshot under 5MB — a phone screenshot is fine."); return; }
        const r = new FileReader();
        r.onload = () => { setImg(r.result); setErr(""); };
        r.readAsDataURL(file);
      };

      const needsSide = !!SIDES[f.challenge];
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email) && DEVICES.indexOf(f.device) >= 0
        && f.score !== "" && Number(f.score) >= 0 && Number(f.score) <= 100 && !!img
        && (!needsSide || !!f.side);

      const submit = async () => {
        if (!valid) { setErr(needsSide && !f.side ? "Pick a side before you submit." : "Fill everything in — email, device, score, screenshot."); return; }
        setState("sending"); setErr("");
        const challengeLabel = f.side ? f.challenge + " — " + f.side : f.challenge;
        // Ori's read rides along so the E1 receipt opens with the exact same
        // sentence the success card shows — the server can't compute it (par
        // lives in this browser).
        const idxNow = oriyaIndex(Number(f.score), f.device);
        const read = caddyLine(idxNow, personalPar(), f.side);
        try {
          const res = await fetch("/api/manual-submit", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: f.email, device: f.device, score: Number(f.score), challenge: challengeLabel, code: f.code, image: img, read: read }),
          });
          const out = await res.json();
          if (out.ok) {
            track("submit_success", { device: f.device, score: Number(f.score), oriya: idxNow, challenge: f.challenge, side: f.side });
            logHistory(idxNow);
            setState("done");
            return;
          }
          if (out.code === "config") { setState("fallback"); location.href = mailDraft(f); return; }
          setErr("That didn't go through (" + (out.code || res.status) + "). Try again, or email it instead below.");
          setState("form");
        } catch (e) { setState("fallback"); location.href = mailDraft(f); }
      };

      if (state === "done") {
        // Loop closure (panel, 2026-07-11): peak-intent moment gets a live tap
        // back to the exact board they entered — never "go wait in your inbox".
        // Sequence (panel, 2026-07-17): number instant → Ori's message → CTA.
        const back = params.get("back");
        const idx = oriyaIndex(Number(f.score), f.device);
        const par = personalPar();   // excludes today's entry — null on first card
        const gap = par == null ? 0 : idx - par;
        return (
          <div className="card success">
            <h2>You're in.</h2>
            <p className="sm" style={{ marginTop: 10 }}><b>{f.device} {f.score}</b> normalized onto the shared 0–100 scale, instantly:</p>
            <div style={{ margin: "16px 0 2px", textAlign: "center" }}>
              <span className="mono" style={{ fontSize: 56, fontWeight: 700, lineHeight: 1, color: "var(--accent)" }}>{idx}</span>
              <span className="xs dim" style={{ display: "block", marginTop: 8 }}>Provisional 0–100 read — one scale across every Oura, Whoop, Garmin &amp; Apple Watch. Three mornings in, it reads against your own par.</span>
            </div>
            <OriMessage oriya={idx} par={par} side={f.side} />
            <a className="btn arrive" style={{ display: "block", textAlign: "center", marginTop: 16, animationDelay: ".7s" }}
              onClick={() => track("board_return_clicked", { challenge: f.challenge, back: !!back })}
              href={back ? "../try.html?challenge=" + encodeURIComponent(back) : "index.html"}>
              <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: 99, background: "var(--accent)", marginRight: 8, verticalAlign: "middle" }}></span>{gap > 0 ? "See where " + gap + " over lands you →" : "Watch your board move →"}
            </a>
            <p className="xs dim arrive" style={{ marginTop: 12, animationDelay: ".7s" }}>The only human step is a quick check that your screenshot is a real device capture — it never changes your number. Same time tomorrow keeps the streak.</p>
          </div>
        );
      }

      return (
        <div className="card">
          <label>Email</label>
          <input type="email" placeholder="alex@example.com" value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} />
          <label>Device</label>
          <div className="devices">
            {DEVICES.map((d) => (
              <button key={d} type="button" className={"dev" + (f.device === d ? " on" : "")} onClick={() => setF({ ...f, device: d })}>{d}</button>
            ))}
          </div>
          <label>This morning's raw score</label>
          <input className="mono" type="number" min="0" max="100" placeholder="84" value={f.score} onChange={(e) => setF({ ...f, score: e.target.value })} />
          <label>Challenge</label>
          <select value={f.challenge} onChange={(e) => setF({ ...f, challenge: e.target.value, side: SIDES[e.target.value] && SIDES[e.target.value].indexOf(f.side) >= 0 ? f.side : "" })}>
            {CHALLENGE_OPTIONS.map((c) => <option key={c}>{c}</option>)}
          </select>
          {needsSide ? (
            <React.Fragment>
              <label>Pick your side</label>
              <div className="devices">
                {SIDES[f.challenge].map((s) => (
                  <button key={s} type="button" className={"dev" + (f.side === s ? " on" : "")} onClick={() => setF({ ...f, side: s })}>{s}</button>
                ))}
              </div>
            </React.Fragment>
          ) : TRY_ID[f.challenge] && !img && (
            /* Marina's sides don't map to this page's title — offer the board
               before commitment instead: new tab, form stays put. */
            <p className="xs dim" style={{ marginTop: 6 }}>Not sure which side? <a href={"../try.html?challenge=" + TRY_ID[f.challenge]} target="_blank" rel="noopener" style={{ color: "var(--accent)" }}>See the live board →</a> — opens a new tab, your form stays put.</p>
          )}
          <label>Recovery screenshot</label>
          <div
            className={"drop" + (drag ? " over" : "")}
            onClick={() => fileRef.current && fileRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={(e) => { e.preventDefault(); setDrag(false); pick(e.dataTransfer.files[0]); }}
          >
            {img ? (
              <React.Fragment>
                <img src={img} alt="your screenshot" />
                <button type="button" className="rm" onClick={(e) => { e.stopPropagation(); setImg(null); if (fileRef.current) fileRef.current.value = ""; }}>Remove</button>
              </React.Fragment>
            ) : (
              <p className="sm dim">Tap — or drop — the screenshot you already took</p>
            )}
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => pick(e.target.files[0])} />
          </div>
          {err && <p className="err">{err}</p>}
          <button className="btn" disabled={state === "sending"} onClick={submit}>{state === "sending" ? "Ori's reading your morning…" : "Get my Oriya Index →"}</button>
          {state === "fallback" && <p className="xs dim" style={{ marginTop: 10 }}>We opened an email draft instead — attach your screenshot and hit send. Same result, one extra tap.</p>}
          <p className="xs dim" style={{ marginTop: 12 }}>Your Oriya Index is calculated the instant you submit — a provisional 0–100 read that locks onto your own par within a few mornings. We only check your screenshot is a real device capture; that keeps the board honest and never changes your number.</p>
        </div>
      );
    }

    function App() {
      return (
        <React.Fragment>
          <span className="kicker">Oriya · daily submission</span>
          <h1>Send this morning's score.</h1>
          <div className="banner">Device sync isn't wired up yet — your morning screenshot is the entry. Your Oriya Index normalizes instantly the moment you submit; we only confirm the screenshot's a real device capture to keep the board honest.</div>
          <ManualProofUpload />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
