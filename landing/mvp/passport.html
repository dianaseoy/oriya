<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Oriya · Passport</title>
  <!-- ViralPassportCard — the screenshot-worthy card. Every field is computed
       from data/board.json (index, archetype, squad, rank, streak, stamps);
       ?code= / ?u=<handle> make any athlete's card shareable (the worker maps
       /p/<username> here), and a shared link exposes nothing the public board
       doesn't already show. The QR points at the /p/ URL: a screenshot can go
       stale or be doctored — this link renders live from the board.
       Empty state (no code on device, no ?u=) falls back to @mayaruns's card,
       labelled as a sample — never a blank page. -->
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="root" class="wrap"><p class="dim sm">Loading…</p></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script src="nav.js"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" crossorigin></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* Maya's sample week, read by Ori — one pre-generated MP3 (~31s, warm
       first-person Ori, scratchpad gen_scene_v3.py; numbers match board.json:
       par ~84, peak 88 — spoken spelled-out, never a scorecard recital).
       Hides itself if the file is missing. */
    function MayaVoice() {
      const [playing, setPlaying] = useState(false);
      const [dead, setDead] = useState(false);
      const ref = useRef(null);
      if (dead) return null;
      return (
        <span style={{ display: "inline-flex", alignItems: "center", gap: 8, marginTop: 10 }}>
          <button type="button" aria-label={playing ? "Pause Ori's read" : "Play Ori's read on Maya's week"}
            onClick={() => { const a = ref.current; if (a) { if (a.paused) a.play(); else a.pause(); } }}
            style={{ width: 30, height: 30, flex: "none", border: 0, borderRadius: 99, background: "var(--accent)", color: "#0B0C0E", fontSize: 10, cursor: "pointer" }}>
            {playing ? "❚❚" : "▶"}
          </button>
          <span className="xs" style={{ color: "var(--accent)", letterSpacing: ".06em", textTransform: "uppercase" }}>Ori on Maya's week · 30 sec</span>
          <audio ref={ref} src="../audio/passport/maya.mp3" preload="none"
            onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
            onEnded={() => setPlaying(false)} onError={() => setDead(true)} />
        </span>
      );
    }
    const DAY = MVP.todayKey();
    const slugOf = (p) => (p.handle ? p.handle.replace("@", "") : p.code);

    /* QR → the /p/ live link. Rendered as our own SVG (bone quiet zone, void
       modules — dark-on-light stays scannable; inverted QRs aren't). Falls
       back to the plain URL if the CDN lib didn't load. */
    function QRBlock({ url }) {
      const [svg, setSvg] = useState("");
      useEffect(() => {
        if (typeof qrcode === "undefined") { setSvg(""); return; }
        try {
          const qr = qrcode(0, "M");
          qr.addData(url); qr.make();
          const n = qr.getModuleCount();
          let rects = "";
          for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
            if (qr.isDark(r, c)) rects += '<rect x="' + (c + 2) + '" y="' + (r + 2) + '" width="1" height="1"/>';
          }
          setSvg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges" role="img" aria-label="QR link to this passport"><rect width="100%" height="100%" fill="#E6E7EA" rx="3"/><g fill="#0B0C0E">' + rects + "</g></svg>");
        } catch (e) { setSvg(""); }
      }, [url]);
      if (!svg) return <p className="mono xs dim" style={{ wordBreak: "break-all" }}>{url}</p>;
      return <div className="qr" dangerouslySetInnerHTML={{ __html: svg }} />;
    }

    /* Public ledger — squads, badges, earnings. Honest zero: no pots have
       settled in the founding season, so every balance is $0.00. */
    function Ledger({ board, me, row }) {
      const squads = MVP.groupBoard(board.participants, DAY, (p) => MVP.codeSource(p.code));
      const mySquad = squads.find((g) => g.members.some((p) => p.code === me.code));
      const devs = MVP.groupBoard(board.participants, DAY, (p) => MVP.deviceTag(p.device));
      const myDev = devs.find((g) => g.members.some((p) => p.code === me.code));
      const earned = MVP.stamps(me, DAY, row.rank).filter((s) => s.earned);
      return (
        <div className="card ledger">
          <p className="lkey">Passport ledger</p>
          <div className="lrow">
            <span className="ldot"></span>
            <div>
              <p className="lkey">Active squads</p>
              <p className="sm" style={{ marginTop: 3 }}>{mySquad.key} <span className="xs dim">· {mySquad.members.length} athletes · squad 7-day {mySquad.avg}</span></p>
              <p className="sm" style={{ marginTop: 2 }}>Device wars — {MVP.deviceTag(me.device)} side <span className="xs dim">· side 7-day {myDev.avg}</span></p>
            </div>
          </div>
          <div className="lrow">
            <span className="ldot"></span>
            <div>
              <p className="lkey">Badges</p>
              <div className="stamp-row" style={{ marginTop: 6 }}>
                {MVP.stamps(me, DAY, row.rank).map((s) => <span key={s.short} className={"stamp" + (s.earned ? "" : " lock")} title={s.hint}>{s.emoji} {s.short}</span>)}
              </div>
              <p className="xs dim" style={{ marginTop: 6 }}>{earned.length}/4 earned — locked ones show what unlocks them.</p>
            </div>
          </div>
          <div className="lrow">
            <span className="ldot" style={{ background: "var(--amber)" }}></span>
            <div>
              <p className="lkey">Earnings balance</p>
              <p className="mono" style={{ marginTop: 3, fontSize: 16 }}>$0.00 USD</p>
              <p className="xs dim" style={{ marginTop: 2 }}>Founding season — no pots settled yet. Pots are sponsor-funded; athletes win them.</p>
            </div>
          </div>
        </div>
      );
    }

    function ViralPassportCard({ board, me, row, own }) {
      const arch = MVP.archetype(me, DAY);
      const stamps = MVP.stamps(me, DAY, row.rank);
      const days = [0, 1, 2, 3, 4, 5, 6].map((i) => {
        const k = MVP.dayOffset(DAY, 6 - i);
        return { k: k, v: MVP.normalizedOn(me, k) };
      });
      const url = location.origin + "/p/" + encodeURIComponent(slugOf(me));
      const [copied, setCopied] = useState(false);
      const copy = () => {
        try { navigator.clipboard.writeText(url); setCopied(true); setTimeout(() => setCopied(false), 1600); } catch (e) {}
      };
      // Share copy leads with the challenge, not the stats — "beat your own
      // usual" is the hook that makes a recipient tap, whatever device they own.
      const shareTxt = (own ? "My week on one card" : me.name.split(" ")[0] + "'s week on one card")
        + " — Index " + row.avg + ", " + row.streak + "d streak. Any wearable, one scale."
        + " Think you can beat your own usual? " + url;
      const wa = "https://wa.me/?text=" + encodeURIComponent(shareTxt);
      const canNative = typeof navigator !== "undefined" && !!navigator.share;
      const nativeShare = () => {
        navigator.share({ title: "Oriya Body Passport", text: shareTxt, url: url }).catch(() => {});
      };
      return (
        <div className="pass-wrap">
          <div className="pass">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <span className="kicker">Oriya · Body Passport</span>
              <span className="mono xs dim">{MVP.deviceTag(me.device)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: 18 }}>
              <div>
                <div className="idx">{row.avg}<span style={{ fontSize: 15, color: "var(--dim)", fontWeight: 500 }}> / 100</span></div>
                <p className="xs dim" style={{ marginTop: 4 }}>Oriya Index · {row.window < 7 ? "day " + row.window + " of your first week" : "7-day avg"} · {row.logged}/{row.window} logged</p>
              </div>
              <div style={{ textAlign: "right", maxWidth: "55%" }}>
                {arch
                  ? <React.Fragment><p className="arch">{arch.type}</p><p className="xs dim" style={{ marginTop: 2 }}>{arch.note}</p></React.Fragment>
                  : <React.Fragment><p className="arch" style={{ color: "var(--dim)" }}>Archetype emerging</p><p className="xs dim" style={{ marginTop: 2 }}>3+ logged mornings reveal it</p></React.Fragment>}
              </div>
            </div>
            <div className="stats" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
              <div className="stat"><b style={{ fontSize: 14, paddingTop: 3 }}>{MVP.codeSource(me.code)}</b><span className="xs dim">squad</span></div>
              <div className="stat"><b>#{row.rank}</b><span className="xs dim">rank</span></div>
              <div className="stat"><b>{row.streak}d</b><span className="xs dim">streak</span></div>
            </div>
            <div className="bars" style={{ height: 40 }}>
              {days.map((d) => {
                const pre = me.joined && d.k < me.joined; // before their window opened — not a miss
                return <div key={d.k} className={"bar" + (d.k === DAY && d.v != null ? " hot" : "")} style={{ height: (d.v == null ? 2 : d.v) + "%", opacity: pre ? 0.25 : 1 }} title={d.k.slice(5) + " · " + (pre ? "before you joined" : d.v == null ? "missed" : d.v)} />;
              })}
            </div>
            <div className="stamp-row">
              {stamps.map((s) => <span key={s.short} className={"stamp" + (s.earned ? "" : " lock")} title={s.hint}>{s.emoji} {s.short}</span>)}
            </div>
            <div className="serial">
              <span className="sm" style={{ fontWeight: 600 }}>{me.name} {me.handle && <span className="xs dim">{me.handle}</span>}</span>
              <span className="mono xs dim">{me.code} · {board.season.split(" · ")[0]}</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "center", marginTop: 14 }}>
              <QRBlock url={url} />
              <p className="xs dim">Scan for the live card. A screenshot goes stale — this link renders straight from the board, so what it shows is what the board says.</p>
            </div>
            <div className="share-row">
              {canNative && <button type="button" className="share-btn" onClick={nativeShare}>Share this card…</button>}
              <button type="button" className="share-btn" onClick={copy}>{copied ? "Copied ✓" : "Copy shareable link"}</button>
              <a className="share-btn" href={wa} target="_blank" rel="noopener">Share to WhatsApp squad</a>
            </div>
            <p className="xs dim" style={{ marginTop: 10 }}>Computed from the last 7 mornings — the link shows only what the public board already shows.</p>
          </div>
        </div>
      );
    }

    function App() {
      const [board, setBoard] = useState(undefined); // undefined = loading, null = failed
      useEffect(() => { STORE.fetchBoard().then((b) => setBoard(b || null)); }, []);
      if (board === undefined) return <p className="dim sm">Loading…</p>;
      if (board === null) return (
        <div className="card">
          <p className="sm">The board didn't load this time — nothing's lost.</p>
          <p className="xs dim" style={{ marginTop: 6 }}>Check your connection and refresh, or open the live card at <a href="https://oriya.app/passport" style={{ color: "var(--accent)" }}>oriya.app/passport</a>.</p>
        </div>
      );
      const myCode = STORE.loadMe();
      const params = new URLSearchParams(location.search);
      const raw = params.get("u") || params.get("code") || myCode;
      const found = raw ? board.participants.find((p) => {
        const h = String(raw).replace(/^@/, "").toLowerCase();
        return p.code === MVP.cleanCode(raw) || (p.handle || "").replace("@", "").toLowerCase() === h;
      }) : null;
      // No passport here yet → show Maya's sample card instead of a dead end,
      // labelled as a sample so nobody mistakes it for their own.
      const demo = !found;
      const me = found || board.participants.find((p) => p.handle === "@mayaruns") || board.participants[0];
      const own = !demo && me.code === myCode;
      const row = MVP.rankBoard(board.participants, DAY).find((r) => r.p.code === me.code);
      const dev = me.device === "apple" ? "Apple Health" : MVP.deviceTag(me.device);
      return (
        <React.Fragment>
          <span className="kicker">Oriya · passport</span>
          <h1>{own ? "Your seven mornings." : me.name.split(" ")[0] + "'s seven mornings."}</h1>
          <p className="xs dim" style={{ marginTop: 6 }}>{board.season}{board.sample ? " · sample data" : ""}</p>
          <SubNavigation active="passport" />
          {demo && (
            <div className="card">
              <p className="sm">No passport on this device yet — <b>this is what yours will look like.</b></p>
              <p className="xs dim" style={{ marginTop: 6 }}>Below is <b style={{ color: "var(--text)" }}>Maya's sample card</b>. Submit your morning screenshots and your own Body Passport builds itself the same way — index, rank, streak and stamps, one morning at a time.</p>
              <MayaVoice />
              <a className="btn" style={{ marginTop: 12 }} href="submit.html?challenge=Founders%20vs%20Operators">Think you can beat your own usual? Start your card →</a>
            </div>
          )}
          {!demo && me.handle === "@mayaruns" && <div style={{ marginTop: 2 }}><MayaVoice /></div>}
          <ViralPassportCard board={board} me={me} row={row} own={own} />
          <Ledger board={board} me={me} row={row} />
          {own && !row.loggedToday && (
            <a className="btn" style={{ marginTop: 14 }} href={"submit.html?code=" + encodeURIComponent(me.code) + "&device=" + encodeURIComponent(dev)}>Send today's score →</a>
          )}
          {!own && (
            <div className="card">
              <p className="sm">Want one of these?</p>
              <p className="xs dim" style={{ marginTop: 6 }}>Every athlete is invited by hand during the founding sprint. Got a code? <a href="index.html" style={{ color: "var(--accent)" }}>Claim your slot</a>. No code? Email <a href="mailto:team@oriya.app" style={{ color: "var(--accent)" }}>team@oriya.app</a>.</p>
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
