<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Oriya · Outreach workbench (internal)</title>
  <!-- Internal founder tool — the 4-stage outreach matrix as an email workbench.
       Spec asked for Next.js /app/partners/dashboard/page.tsx; this repo deploys
       build-less (Worker + static assets), so it ships as this page instead.
       Everything is mailto: drafts — nothing sends automatically, nothing is
       stored, no contact list lives in the repo. Unguessable filename on
       purpose (like the ops console) — noindex + unlinked, but that's
       obscurity, not auth; Cloudflare Access is the real lock if needed. -->
  <style>
    :root { --bg:#0B0C0E; --panel:#101114; --line:#23252B; --text:#E6E7EA; --dim:#8A8F98; --accent:#7FB79E; --amber:#D7A25C; }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--text); font:14px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1100px; margin:0 auto; padding:28px 18px 80px; }
    .mono { font-family:ui-monospace,"JetBrains Mono",monospace; }
    .kicker { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
    h1 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin-top:6px; }
    h2 { font-size:14px; font-weight:600; letter-spacing:-.01em; }
    .dim { color:var(--dim); } .sm { font-size:12.5px; } .xs { font-size:11px; }
    .bar { display:grid; grid-template-columns:2fr 1.1fr 1.3fr .8fr; gap:8px; margin-top:16px; }
    label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:4px; }
    input { width:100%; font:inherit; background:#0D0E11; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px 11px; outline:none; transition:all .2s ease; }
    input:focus { border-color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
    .panels { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
    @media (max-width:980px) { .grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:620px) { .grid, .panels, .bar { grid-template-columns:1fr; } }
    .card { background:rgba(16,17,20,.55); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .tag { font-size:10px; letter-spacing:.14em; color:var(--accent); font-family:ui-monospace,monospace; }
    .subj { font-size:11px; color:var(--dim); border-left:2px solid var(--line); padding-left:8px; word-break:break-word; }
    .spacer { flex:1; }
    .btn { position:relative; overflow:hidden; display:block; text-align:center; text-decoration:none; background:var(--accent); color:#0B0C0E; border:0; border-radius:9px; padding:10px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s ease; }
    .btn:hover { filter:brightness(1.08); }
    .btn.off { opacity:.4; pointer-events:none; }
    .btn::after { content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); background-size:220% 100%; background-position:200% 0; opacity:0; transition:opacity .2s ease; pointer-events:none; }
    .btn:hover::after { opacity:1; animation:shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    @media (prefers-reduced-motion: reduce) { .btn:hover::after { animation:none; opacity:0; } }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px; font:inherit; font-size:12px; cursor:pointer; transition:all .2s ease; }
    .ghost:hover { border-color:#3A3D45; }
    .note { font-size:11px; color:var(--amber); }
    .krow { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding-top:8px; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const SIGN = "\n\n— Diana · founder, Oriya (oriya.app)";
    const JOIN_LINK = "oriya.app/play/foundersvsoperators"; // clean alias for oriya.app/try?challenge=founders — /_redirects + worker SHORTLINKS both point it there
    const BOARD_LINK = "oriya.app/board"; // clean alias → /mvp/ live rankings + scores (worker SHORTLINKS + _redirects both point it there)

    // Live side standing, no invented numbers (panel rule, still holds): a
    // fragment computed from the same board.json the live board renders, only
    // when it's real data (board.sample === false). Sample data never
    // produces a claim — templates get an honest "just opened" fallback
    // instead of a number that would mislead an outside recipient.
    function standingLine(standing) {
      if (!standing || standing === "none") return "The board just opened — nobody's ahead yet.";
      return standing.lead + " are ahead " + standing.leadAvg + "–" + standing.otherAvg + " on the live board right now.";
    }

    // Every body is honest about today's product: screenshot IS the entry (no
    // sync promise), /play is the canonical conversion link, the B2B/Reddit/
    // LinkedIn headcounts are typed in by hand off the real board (c.x), and
    // the side-standing line above is computed live, never hardcoded — this
    // page never invents a traction number.
    // Launch set (sable pass, 2026-07-13; revised 2026-07-13 evening — no
    // sponsor is signed for the day-to-day FvO board, so no template sells a
    // cash pot for it; the ask is validating that people want to socialize
    // their recovery, not win money. The $ hook lives on the Oriya Olympics
    // bracket instead — a founder-committed prize pool of at least $2,000 for
    // the season's highest sustained Index, separate from the FvO board
    // itself). Groups: L = launch (cold/warm doors, bump, confirm, recruit —
    // the Olympics prize sits in a P.S., never leads a first cold email, per
    // sable's 2026-07-13-evening pass), T/B/F = persona variants (team,
    // biohacker, follow-up), R = public posts + DMs (Reddit/LinkedIn/
    // Instagram — copy-only, no mailto, no invented headcounts or response
    // rates), P = in-person scripts (coach-not-owner, copy-only), S = sponsor
    // asks (VC / community / gym — logo or a sponsor-mediated intro, never a
    // raw contact export). The retired generic "Season 1 Pass" + confirm
    // templates are archived in the comment at the bottom of this script for
    // the day two sprints run concurrently.
    function seqs(c, standing) {
      const n = c.n || "there";
      const coStudio = c.co || "your studio", coFund = c.co || "your fund";
      const coCommunity = c.co || "your community", coTeam = c.co || "your team";
      const STAND = standingLine(standing);
      return [
        { id: "fvo_f", g: "L", tag: "L1 · COLD — THE FOUNDER DOOR", title: "Cold: founders",
          obj: "Triggers the founder identity (owns the calendar — prove it buys recovery). Ask = Founders side, not money. Sable pass (2026-07-13 eve): a first cold email shouldn't lead with a future-committed prize, so the Olympics line moved to a P.S. and the body's tighter.",
          s: "Founders own the schedule. Do they recover better?",
          b: "Hi " + n + ",\n\nDiana here, founder of Oriya. Founder to founder.\n\nEvery founder tells themselves the same story: I control my calendar, so I sleep on my terms, so I recover better than the operators grinding on-call at 2am. Oriya put a board in SF to settle it. " + STAND + "\n\nPick the Founders side, send one morning recovery screenshot (Oura / Whoop / Garmin / Apple), and a person normalizes it to your Oriya Index so every wearable competes fairly. Late joiners aren't punished -- your average only counts mornings since you entered.\n\nTwo-minute rundown: oriya.app/play\nTake the Founders side: " + JOIN_LINK + "\n\nProve the autonomy actually buys you recovery -- or find out the operators have been out-sleeping you the whole time.\n\nP.S. -- top your side and you're in the running for the Oriya Olympics, a bracket carrying a prize pool of at least $2,000 for the season's highest sustained Index. No bracket has run yet." + SIGN },
        { id: "fvo_o", g: "L", tag: "L2 · COLD — THE OPERATOR DOOR", title: "Cold: operators",
          obj: "Triggers the operator identity (runs the machine, eats the 2am pages). Ask = Operators side, not money. Same demote-and-tighten pass as fvo_f.",
          s: "The founders think their calendar beats your discipline",
          b: "Hi " + n + ",\n\nDiana here, founder of Oriya. This one's for the person who actually keeps the machine running.\n\nFounders love to claim they recover better because they own their schedule. Meanwhile the ops leads, chiefs of staff, and EMs are the ones eating the on-call pages and the 4am fires -- and still shipping the morning after. Oriya built an SF board to test the claim. " + STAND + "\n\nTake the Operators side, send one morning recovery screenshot (Oura / Whoop / Garmin / Apple), and a person normalizes it so no wearable gets a hardware advantage. Late entry isn't a penalty -- your average only counts mornings since you joined.\n\nTwo-minute rundown: oriya.app/play\nTake the Operators side: " + JOIN_LINK + "\n\nThe people who run the machine usually out-recover the people who own it. Put it on the board.\n\nP.S. -- top your side and you're in the running for the Oriya Olympics, a bracket carrying a prize pool of at least $2,000 for the season's highest sustained Index. No bracket has run yet." + SIGN },
        { id: "fvo_bump", g: "L", tag: "L3 · BUMP", title: "Follow-up nudge",
          obj: "No reply after 3-4 days. The join-window rule removes the stall excuse. Four lines, either side.",
          s: "re: Founders vs Operators",
          b: "Hi " + n + ",\n\nQuick nudge -- the SF board is open and filling now, and your average only starts counting the day you enter, so joining later costs you nothing. Pick a side and send one morning screenshot: " + JOIN_LINK + "\n\nWant the rules first? Two minutes: oriya.app/play" + SIGN },
        { id: "fvo_confirmed", g: "L", tag: "L4 · CONFIRM — DAY 1", title: "You're in — Day 1",
          obj: "Send the moment they pick a side. Day-1 mechanics only, plus the join-window rule so a late start never reads as a penalty.",
          s: "You're in — here's Day 1",
          b: "Hi " + n + ",\n\nYou're in. Here's the whole mechanic, once:\n\n1. Next morning you wake up, screenshot your recovery screen (Oura / Whoop / Garmin / Apple -- device sync isn't wired up yet, the screenshot IS the entry).\n2. Send it in about 60 seconds: oriya.app/submit\n3. A person reads it and normalizes it to your Oriya Index -- usually within the hour. Your board code comes back by email and opens your side of the Founders vs Operators board.\n\nHow your window works: your board starts the day you start. Your side average only counts mornings from your first drop forward -- you're not carrying any days you weren't in for. Log every morning and it compounds; miss one and it counts 0 for your side that day. The streak is the whole game.\n\nTop your board and you're seeded for the Oriya Olympics -- the SF bracket carrying a prize pool of at least $2,000 for the season's highest sustained Index. No bracket has run yet: the first one forms the week the founding boards fill.\n\nSee you on the board." + SIGN },
        { id: "fvo_recruit", g: "L", tag: "L5 · RECRUIT — TALK TRIGGER", title: "Recruit your side",
          obj: "Send once they're logging. The math (empty seat = a zero for your side) is the entire pitch; includes a forwardable Slack/text line.",
          s: "Every empty seat on your side logs a 0",
          b: "Hi " + n + ",\n\nYou're on the board -- now the math. Your side's score is the average of everyone logging that morning. Every person you pull onto your side is another reading holding the average up. Every colleague who sits out is a zero you're carrying.\n\nSo the move is obvious: bring the people who'd actually show up every morning. Two or three disciplined teammates move your side more than any single big score you can post.\n\nAnd there's no penalty for them starting now -- their board starts the day they start, average only counts from their first drop. \"Join late\" isn't a thing anymore.\n\nHere's a line you can paste straight into Slack or a text:\n\n\"Pulling a few of us onto our side in this SF recovery thing -- Oriya's Founders vs Operators board. No sponsor yet so no cash pot on the day-to-day board, but it's live and bragging rights (plus a shot at the Oriya Olympics' $2,000+ prize pool) are real. Our side's score is the group average, so every morning you log counts and every no-show is a zero we carry. Entry is one screenshot of your recovery score, and your board starts the day you join -- no catch-up. Rules: oriya.app/play  Pick our side: " + JOIN_LINK + "\"\n\nThat's it. Go stack your side." + SIGN },
        { id: "warm_founder", g: "W", tag: "W1 · WARM — FOUNDER YOU KNOW", title: "Warm: founder in your network",
          obj: "Personal network — met in person, LinkedIn-connected, mutuals. Short. Leads with the board, not a pitch. No pot — the challenge is the ask.",
          s: "quick one — pick your side",
          b: "Hi " + n + ",\n\nQuick one: " + STAND + "\n\nI built the handicap that makes every wearable fair on the same board -- Oura, Whoop, Garmin, Apple Watch, normalized by a person, not an algorithm. Seven-day challenge, no install, about 60 seconds a morning: screenshot your recovery score, send it, I post your rank.\n\nFounders say the schedule they control should buy them better recovery. Prove it's true.\n\nYour Body Passport: oriya.app/p/mayaruns (sample -- yours generates after day one)\nHow it works: oriya.app/play\nPick the founder side: " + JOIN_LINK + SIGN },
        { id: "warm_operator", g: "W", tag: "W2 · WARM — OPERATOR YOU KNOW", title: "Warm: operator in your network",
          obj: "Personal network — VP / Head of Product / COO / senior IC you know. Short, same board, operator framing.",
          s: "quick one — pick your side",
          b: "Hi " + n + ",\n\nQuick one: " + STAND + "\n\nNo app to install -- a morning wearable screenshot (Oura, Whoop, Garmin, Apple Watch), normalized by a person, posted to a live board. About 60 seconds a morning for seven days.\n\nThe founders on this board think owning their schedule buys them better recovery than the people actually running things day to day. You'd know.\n\nHow it works: oriya.app/play\nSample Body Passport: oriya.app/p/mayaruns\nPick the operator side: " + JOIN_LINK + SIGN },
        { id: "corporate_team", g: "T", tag: "T1 · TEAM — BRING YOUR COMPANY", title: "Bring your team (10-15)",
          obj: "Eng manager / Head of People / CPO. Ask is 'can your team represent a side,' not 'will you join' — a one-Slack-message decision, no procurement.",
          s: "bring " + coTeam + " onto the board",
          b: "Hi " + n + ",\n\nI'm running a 7-day recovery challenge -- Founders vs Operators -- and I want " + coTeam + " represented.\n\nNo app, no integration. Each person on your team takes a 60-second morning screenshot of their wearable score (Oura, Whoop, Garmin, Apple Watch) and sends it in. I normalize every device to the same fair index by hand and post the team average.\n\n" + STAND + "\n\nAnon mode is available -- the board can show just ◒ + @yourcompany.com if anyone on the team would rather not use their name.\n\nWhat it looks like: oriya.app/play\nSample athlete Passport: oriya.app/p/mayaruns\nClaim your team's spot: " + JOIN_LINK + "\n\nI'm running this by hand for a small founding cohort -- no commitment beyond 60 seconds a morning, and you can pull out any time." + SIGN },
        { id: "biohacker", g: "B", tag: "B1 · DUAL-DEVICE / HRV SKEPTIC", title: "Dual-device / HRV skeptic",
          obj: "Someone who wears two devices or argues Oura-vs-Whoop accuracy online. Lead with the normalization problem, not the competition — invite them to poke holes in it.",
          s: "Oura 73 ≠ Whoop 73",
          b: "Hi " + n + ",\n\nSaw your Oura/Whoop/HRV post -- the thing you're pointing at is real. An Oura readiness of 73 and a Whoop recovery of 73 aren't the same number: different sensors, different algorithms, different baselines.\n\nI built the normalization layer that handles this by hand -- a person reads your raw score against your own device's baseline and maps it onto a 0-100 Oriya Index, so Oura, Whoop, Garmin, and Apple Watch can sit on the same leaderboard without one device getting a free pass.\n\nI'm running a 7-day Founders vs Operators challenge -- a small founding cohort. No install, 60-second morning screenshot. I want your device on the board because the methodology only holds up if it survives someone who actually knows what RMSSD means.\n\nHow it works: oriya.app/play\nSample Passport: oriya.app/p/mayaruns\nPick your side: " + JOIN_LINK + "\n\nHappy to walk through the normalization logic if you want to find the holes before you log day one." + SIGN },
        { id: "vc_participant", g: "V", tag: "V1 · VC — PARTICIPATE OR PREDICT", title: "VC: pick a side or call it",
          obj: "Ask a VC to participate personally (log or free-prediction), not to sponsor. Frame as a thesis to test, not a product to try.",
          s: "which side would you bet on",
          b: "Hi " + n + ",\n\nQuick one: " + STAND + "\n\nI'm running a 7-day recovery challenge -- Founders vs Operators, SF. The question: does owning your calendar actually buy better recovery, or are the people running the machine more disciplined? No install -- a morning wearable screenshot, normalized by a person, posted to a live board.\n\nTwo ways in, no commitment either way:\n1. Pick a side and log your own score: " + JOIN_LINK + "\n2. Call the winner for free -- no morning screenshot, just a prediction on the board.\n\nTop the board and you're in the running for the Oriya Olympics -- a prize pool of at least $2,000 for the season's highest sustained Index.\n\nHow it works: oriya.app/play\nSample Body Passport: oriya.app/p/mayaruns\n\nWhich side would you bet on?" + SIGN },
        { id: "followup", g: "F", tag: "F1 · FOLLOW-UP — DAY 3, NEW ANGLE", title: "Follow-up (day 3)",
          obj: "For anyone who didn't reply to a cold or warm send. New information, not a repeated ask — removes the performance-anxiety reason people stall.",
          s: "one more thing",
          b: "Hi " + n + ",\n\nOne thing I didn't mention: a logged red morning outranks a forgotten green one. The board scores the log, not the score -- a rough night mid-week and logging it still keeps you on the board. Going dark leaves a zero.\n\nThat's the actual design: the challenge is about showing up under load, not posting a personal best.\n\nIf picking a side and logging daily doesn't fit right now, you can also just call the winner -- a free prediction, no morning screenshot, no data sent: " + JOIN_LINK + "\n\nNo reply needed either way." + SIGN },
        { id: "reddit_post", g: "R", post: true, tag: "R1 · PUBLIC POST — REDDIT", title: "Reddit: observation, not a pitch",
          obj: "Post as an observation, not a sales pitch — r/ouraring, r/whoop, r/QuantifiedSelf. Headcount below is gated to the real “Active athletes” number above, same rule as the team template. An invented count kills the pitch and the brand. Copy-only — there's no single recipient, so mailto stays off.",
          s: "Running a private normalization experiment",
          b: "Has anyone else noticed Oura's readiness and Whoop's recovery disagree by 20+ points on the same morning? I built a handicap system that normalizes both onto the same scale and I'm running a private 7-day leaderboard to test it against Garmin and Apple Watch too." + (c.x ? " " + c.x + " people already in." : "") + " Manually approving based on device diversity -- comment your device or DM me if you want in.\n\nHow it works if you're curious: oriya.app/play" },
        { id: "linkedin_post", g: "R", post: true, tag: "R2 · PUBLIC POST — LINKEDIN", title: "LinkedIn: post, then DM commenters",
          obj: "Post publicly, then DM every commenter within 2 hours using the DM template below with their real device. The ask (comment your device) is small on purpose.",
          s: "Running a private recovery challenge",
          b: "Running a 7-day recovery challenge -- Founders vs Operators, SF. Pick a side, screenshot your wearable each morning, get scored on a live board. No install." + (c.x ? " " + c.x + " people already in." : "") + " Comment your device (Oura / Whoop / Garmin / Apple Watch) and I'll send you an invite.\n\nRules: oriya.app/play" },
        { id: "linkedin_dm", g: "R", tag: "R3 · DM — EVERY LINKEDIN COMMENTER", title: "DM after they comment",
          obj: "Send within 2 hours of their comment. Don't invent a personal board position for them — use the live side-standing line, not a guessed number.",
          s: "here's your invite",
          b: "Hey " + n + " -- here's your invite: " + JOIN_LINK + "\n\n" + STAND + " Pick your side, screenshot your recovery score tomorrow morning, and you're on the board.\n\nHow it works: oriya.app/play" + SIGN },
        { id: "vc_sponsor", g: "S", tag: "S1 · SPONSOR — VC ASK", title: "VC sponsor pitch",
          obj: "Chosen angle: run it free for their portfolio as an engagement tool (gets portfolio founders/operators talking to each other), not a paid ask. Payment, if any, is logo placement or a sponsor-mediated intro — never a raw contact export.",
          s: "Run Founders vs Operators for " + coFund + "'s portfolio — free",
          b: "Hi " + n + ",\n\nDiana here, founder of Oriya. I'm running Founders vs Operators -- a 7-day SF recovery challenge: pick a side, send a morning wearable screenshot, get normalized into a fair Oriya Index, watch a live board. No app, no install.\n\nI'd like to run this for " + coFund + "'s portfolio, free. What's in it for you:\n\n1. Your portfolio founders and operators end up talking to each other -- the board is a built-in reason for people at different portfolio companies to compare notes, which is the kind of cross-portfolio connection you're usually engineering by hand.\n2. " + coFund + "'s name on the board and in every outreach email for the sprint, visible to everyone who joins.\n3. If you want to back the prize pot on top of that, it's optional: you fund it, athletes win it, you're never paid out -- prize sponsorship, not a wager.\n\nI don't need your portfolio's contact list -- forward this to your founders' Slack, or send me a short list of names and I'll invite them personally under your name. An intro from you converts better than a cold email from me anyway.\n\nWorth 15 minutes this week?" + SIGN },
        { id: "community_sponsor", g: "S", tag: "S2 · SPONSOR — COMMUNITY ASK", title: "Community sponsor pitch",
          obj: "Run clubs / Slack communities. Same numbered-benefit structure as the VC ask — logo or a sponsor-sent post to their own channel, never their member list handed to us.",
          s: "Get " + coCommunity + " in front of SF's recovery-obsessed operators",
          b: "Hi " + n + ",\n\nDiana here, founder of Oriya. I'm running Founders vs Operators -- a 7-day recovery challenge live in SF right now: pick a side, send a morning wearable screenshot, get a normalized Oriya Index, watch a live team board.\n\nI'd like " + coCommunity + " to sponsor a squad. What you get:\n\n1. A live, low-effort reason for your members to engage with each other daily -- the squad score is the group average, so people start checking in on each other's mornings.\n2. " + coCommunity + "'s name on the challenge board and every outreach email for the sprint.\n3. Your name in front of people who already care enough about their recovery to put a score on a public board -- a warmer audience than an ad ever gets you.\n\nYou post it once to your own list or channel, your framing -- I never ask for your members' contacts directly. Backing the prize pot is optional and separate: you fund it, athletes win it, you're never paid out.\n\nWant " + coCommunity + "'s name on a live SF board this week?" + SIGN },
        { id: "studio_gym_sponsor", g: "S", tag: "S3 · SPONSOR — GYM/STUDIO ASK", title: "Gym/studio partnership pitch",
          obj: "In-person or DM ask to a gym/studio (Barry's, CrossFit, run clubs). They become the squad captain — the benefit is a built-in engagement hook for their own members plus board exposure.",
          s: "Turn your " + coStudio + " class into a leaderboard squad",
          b: "Hi " + n + ",\n\nDiana here, founder of Oriya. I'm running a 7-day recovery challenge in SF -- Founders vs Operators, no app to install, one morning wearable screenshot a day.\n\nI want " + coStudio + " to run one squad. What that gets you:\n\n1. A reason for your members to talk to each other outside class -- the squad's score is the group average, so people start comparing mornings and pushing each other, not just showing up and leaving.\n2. " + coStudio + "'s name on the challenge board and in outreach for the length of the sprint.\n3. A ready-made retention hook -- something for your regulars to check every morning besides the class schedule.\n\nYou'd be the squad captain: share one link in your class group chat, and I run the rest -- normalization, the board, reminders. Free to run; backing the prize pot is a separate conversation once the squad's live.\n\nHow it works: oriya.app/play\nSquad link: " + JOIN_LINK + "\n\nWorth five minutes after class this week?" + SIGN },
        { id: "b2b", tag: "04 · SCALE — B2B PARTNER PIVOT", title: "The B2B partner pivot",
          obj: "For larger/enterprise partners once there's a real number to cite — not gyms (use studio_gym_sponsor for those, it converts a single squad faster). Send at 20 / 30 / 50 active locals, real count only.",
          s: (c.x || "[X]") + " athletes logging on Oriya — a season for " + coStudio,
          b: "Hi " + n + ",\n\nI run Oriya. " + (c.x || "[X]") + " athletes are logging morning recovery scores onto live boards right now. I want to run a season for " + coStudio + ".\n\nThree tiers:\n· Seed ($0) -- a named squad + a live board. No cost, proves the room first.\n· Sponsor ($300–500) -- funds a squad's prize pot for a season. Athletes win it; sponsors are never paid out -- prize sponsorship, not a wager.\n· Enterprise ($1k–2k) -- a branded season across multiple squads, aggregate reporting only, never individual data.\n\nWorth 15 minutes this week?" + SIGN },
        { id: "ig_dm", g: "R", post: true, tag: "R4 · DM — INSTAGRAM (public score posters)", title: "IG DM: people who post their score",
          obj: "Highest-intent audience — target people who publicly post their Oura/Whoop/Garmin score in a caption or story; they already have the habit. Keep it DM-length (3 lines), not email-length. Send within a few hours of their post, while it's fresh — no response-rate claim here, we haven't sent any yet.",
          s: "the leaderboard you've been missing",
          b: "Saw your [Oura/Whoop/Garmin] score post -- I built the leaderboard you've been missing. Puts your score next to someone on a totally different device, normalized fairly by a person, not an algorithm.\n\nWant a Body Passport? " + JOIN_LINK },
        { id: "coach_script", g: "P", post: true, tag: "P1 · IN-PERSON — COACH SCRIPT", title: "In-person: the coach, not the owner",
          obj: "CrossFit boxes and run clubs alike. Talk to the coach, not the owner or front desk — the coach is the trust layer. Bring a live leaderboard already open on your phone; demonstrate, don't pitch. Offer a free 2-week squad pilot for their next training block.",
          s: "Your athletes check their recovery score alone every morning",
          b: "[Say this, phone in hand, leaderboard already open]\n\n\"Your athletes check their recovery score alone every morning. What if the whole box competed on it together -- fairly, even across different devices?\"\n\n[Show the live board. Let them scroll it themselves.]\n\n\"Takes about five minutes to set up. I'll run a free two-week pilot for your next training block -- I handle the normalization, you just share one link in the group chat.\"\n\n[Get their number. Follow up same day: " + JOIN_LINK + "]" },
        // ---- WhatsApp auto-flow (Boardy.ai inversion: the system opens the
        //   thread, the athlete only ever responds — one tap or one screenshot,
        //   zero compose friction). These are the bot's scripts, not sends from
        //   this page, so they're copy-only (wa:true drops the "Subject:" prefix
        //   and the mailto). Every number is a [TOKEN] the automation fills live
        //   per athlete from the real board at send time — the same
        //   no-invented-stat rule the email templates follow; nothing here is a
        //   hardcoded standing. Live rankings link is BOARD_LINK (→ /mvp/).
        { id: "wa_welcome", g: "WA", wa: true, post: true, tag: "WA1 · AUTO — WELCOME (SYSTEM OPENS)", title: "WhatsApp: welcome + pick a side",
          obj: "Fires the instant they drop their phone number on oriya.app. Boardy inversion — the system opens so there's no \"what do I write?\" load; their whole reply is 1 or 2. First commitment is the side. No numbers here to get wrong.",
          s: "TRIGGER · right after phone number entered on oriya.app",
          b: "Hey [NAME] 👋 You're in the Oriya founding cohort — Founders vs Operators, Season 1.\n\nEvery morning: screenshot your recovery score → send it here. ~45 seconds. I normalize it and drop you onto the board.\n\nWhich side are you on?\n1️⃣ Founders\n2️⃣ Operators" },
        { id: "wa_locked", g: "WA", wa: true, post: true, tag: "WA2 · AUTO — SIDE LOCKED", title: "WhatsApp: side locked + first action",
          obj: "Fires when they reply 1/2. Confirms the side, states the live stakes, gives exactly one next action. The standing line is filled from the live board at send time — or the honest \"board just opened\" fallback when it's too early — never a hardcoded number.",
          s: "TRIGGER · they reply 1 or 2",
          b: "[SIDE] side locked 🏴\n\n[LIVE STANDING — e.g. \"Operators lead [X]–[Y] right now\", or \"The board just opened — nobody's ahead yet\" when too early.] Your first morning score moves it.\n\nDrop your recovery screenshot whenever you wake up — Oura, Whoop, Garmin, Apple Watch all work. I normalize it and put you on the board.\n\nSample Passport: oriya.app/p/mayaruns" },
        { id: "wa_score", g: "WA", wa: true, post: true, tag: "WA3 · AUTO — SCORE DELIVERED (~60s)", title: "WhatsApp: normalized score + rank + streak",
          obj: "The retention moment. Fires ~60s after they send a screenshot: normalized Oriya Index, exact rank on their side, side average, and streak — every [TOKEN] computed live per athlete from the real board, nothing typed or invented. Ends on the live rankings link so scoring pulls them to the board.",
          s: "TRIGGER · they send a morning screenshot",
          b: "[DEVICE] [RAW] → Oriya Index [INDEX] 🎯\n\nYou're #[RANK] of [FIELD] on the [SIDE] side.\n[SIDE] avg: [SIDE_AVG] ([±Δ] vs yesterday)\nOther side leads: [LEAD_AVG]\n\n🔥 Day [STREAK] streak.\n\nLive rankings + every score: " + BOARD_LINK + "\nYour Passport is live: oriya.app/p/[HANDLE]\nReply BOARD for the full leaderboard." },
        { id: "wa_board", g: "WA", wa: true, post: true, tag: "WA4 · AUTO — BOARD (ON DEMAND)", title: "WhatsApp: live board + invite hook",
          obj: "Fires when they reply BOARD — keeps the thread alive without daily push spam, and every board view ends on a recruit action (a side's score is its group average, so pulling one teammate in literally moves it). Numbers live-filled; the invite uses the canonical join link.",
          s: "TRIGGER · they reply BOARD",
          b: "Founders vs Operators · Day [N]\n\nFounders 🏴 avg [F_AVG] ([±Δ])\nOperators 🏳️ avg [O_AVG] ([±Δ])\n\nYour rank: #[RANK] of [FIELD] [SIDE]\nTop today: [HANDLE] · [INDEX] 🔥[STREAK]d\n\nGap to close: [GAP] pts.\n\nFull live board: " + BOARD_LINK + "\nPull a teammate onto your side → " + JOIN_LINK },
        { id: "wa_nudge", g: "WA", wa: true, post: true, tag: "WA5 · AUTO — 08:25 NUDGE (IF NOT LOGGED)", title: "WhatsApp: morning accountability nudge",
          obj: "The Day-7 retention lever — fires ~08:25 local only if they haven't logged. Leads with the creed so a rough morning still gets logged instead of skipped, and states the real mechanic (a blank counts 0 for your side). A prompt, not a report — no numbers to invent. Deliberately no \"board closes at 09:00\" claim; that cutoff isn't built.",
          s: "TRIGGER · 08:25 local, no screenshot logged yet today",
          b: "Morning 🌅 Quick one — you haven't logged today yet.\n\nA logged 61 outranks a forgotten 90. The board scores the log, not the flex — your side carries every blank as a 0.\n\nDrop your screenshot now → oriya.app/submit" },
      ];
    }
    /* Archived (2026-07-13) — retired the day Founders vs Operators became the
       sole active sprint. Restore into seqs() the day a second concurrent
       sprint needs a generic (non-FvO) convert/confirm pair:
    { id: "pass", tag: "02 · CONVERT — SEASON 1 PASS", title: "The Season 1 Pass pitch",
      obj: "They showed interest — convert to a Season 1 seat + a chosen sprint. /play is the link.",
      s: "Your Season 1 seat — pick a side",
      b: "Hi " + n + ",\n\nSeason 1 of Oriya is a 7-day sprint: pick a side, send one morning screenshot — that's the whole entry — and your score counts toward your team's average every day you log.\n\nThe game in 5 steps (2-minute read): oriya.app/play\nPick your sprint and your side: oriya.app/try\n\nFounding-season athletes get the FOUNDING 50 stamp on their public Body Passport, and every sprint runs on a live team board.\n\nWin your 7-day board and you hold a seed for the Oriya Olympics — the SF bracket that crowns the season's highest sustained recovery Index. It's a founder commitment, not a running event: the first bracket forms the week the founding boards fill.\n\nThis is a closed-out 7-day sprint — sample athlete, the real card format: oriya.app/p/mayaruns\n\nWhich side are you taking?" + SIGN },
    { id: "confirm", tag: "03 · ONBOARD — SPRINT CONFIRMED", title: "The sprint confirmation",
      obj: "Send the moment they confirm a sprint. Day-1 mechanics only, nothing new to decide.",
      s: "You're in — Day 1 is tomorrow morning",
      b: "Hi " + n + ",\n\nYou're on the board. Here's Day 1:\n\n1. Tomorrow morning, screenshot your recovery score (any device — device sync isn't wired up yet, the screenshot IS the entry).\n2. Send it in about 60 seconds: oriya.app/submit\n3. A person reads it and posts your Oriya Index, usually within the hour. Your athlete-board code comes back by email — it opens your 7-day board at oriya.app/board.\n\nYour public Body Passport lives at oriya.app/p/ + your code — share it or don't, your call (anonymous mode included).\n\nMiss a morning and it counts 0 for your squad. The streak is the game." + SIGN },
    */

    const PRIVACY = "Privacy as architecture: corporate partners get aggregate squad averages only — no individual recovery data appears in any partner report. Athletes control their own public passports (anonymous mode included), so there is no employee health file for anyone to review.";

    /* "What seven mornings buys you" — numbers computed live from the same
       board.json the public card renders (panel rule: generated, never lore).
       Headline deliberately avoids "win": passports prove logged mornings and
       rank, not pot money. */
    function WinPanel({ copied, copy }) {
      const [s, setS] = useState(null);
      useEffect(() => {
        STORE.fetchBoard().then((b) => {
          if (!b) return;
          const day = MVP.todayKey();
          const r = MVP.rankBoard(b.participants, day).find((x) => (x.p.handle || "").toLowerCase() === "@mayaruns");
          if (r) setS({ avg: r.avg, logged: r.logged, rank: r.rank, stamps: MVP.stamps(r.p, day, r.rank).filter((x) => x.earned).length });
        });
      }, []);
      const line = "This is a closed-out 7-day sprint — sample athlete, the real card format: oriya.app/p/mayaruns";
      return (
        <div className="card">
          <span className="tag">WHAT SEVEN MORNINGS BUYS YOU</span>
          {s ? (
            <React.Fragment>
              <p className="sm">End of a 7-day sprint, an athlete walks away with a card like this:</p>
              <p className="mono" style={{ fontSize: 15 }}>Index {s.avg} / 100 · {s.stamps} stamps · {s.logged}/7 mornings · #{s.rank} on the board</p>
              <a className="btn" href="passport.html?u=mayaruns" target="_blank" rel="noopener">Open the live sample card →</a>
              <div className="spacer"></div>
              <p className="xs dim">These numbers render from the same board.json the public card uses. Paste-ready, pre-disclosed line — drop it into any template above:</p>
              <button className="ghost" onClick={() => copy("win", line)}>{copied === "win" ? "Copied ✓" : "Copy sample-card line"}</button>
            </React.Fragment>
          ) : <p className="sm dim">Loading the live sample card…</p>}
        </div>
      );
    }

    // KEY_FACTS mirrors the founder's own cheat sheet — canonical phrasing so
    // every template (and every ad-hoc reply) says the same true things the
    // same way. "Algorithm" is deliberately never used — it's a person.
    const KEY_FACTS = [
      ["No app to install", "Send a screenshot of your wearable's recovery screen. That's it."],
      ["~60 seconds/morning", "Wake up → screenshot → send. The effort bar has to stay this low."],
      ["Human normalization", "“A person adjusts your raw score” — say this, not “algorithm.” More accurate, more trustworthy."],
      ["Not a wager (Oriya Olympics only)", "The day-to-day FvO board carries no cash pot right now — don't imply one. The Oriya Olympics bracket carries a founder-committed prize pool of at least $2,000 for the season's highest sustained Index; backers (if any) fund it, athletes win it, backers are never paid out."],
      ["Anon mode", "Work email shows only ◒ anon + @company.com. Good for operators who don't want their employer to know their sleep score."],
      ["Bad score still counts", "“A logged red morning outranks a forgotten green one. The board scores the log, not the flex.” Use this to remove performance anxiety."],
      ["How to play", "oriya.app/play — send this before the join link if someone asks how it works."],
      ["Sample Passport", "oriya.app/p/mayaruns — send this to show what their Passport looks like after day one."],
      ["Join link", JOIN_LINK + " — always use this for Founders vs Operators (redirects to the working deep link)."],
    ];

    function App() {
      const [c, setC] = useState({ email: "", n: "", co: "", x: "" });
      const [copied, setCopied] = useState("");
      const [standing, setStanding] = useState(null);
      useEffect(() => {
        STORE.fetchBoard().then((b) => {
          if (!b || b.sample) { setStanding("none"); return; } // sample data never produces an outbound claim
          const day = MVP.todayKey();
          const sides = MVP.groupBoard(b.participants.filter((p) => p.fvo), day, (p) => p.fvo);
          if (sides.length < 2 || !sides[0].members.length || !sides[1].members.length) { setStanding("none"); return; }
          setStanding({ lead: sides[0].key, leadAvg: sides[0].avg, other: sides[1].key, otherAvg: sides[1].avg });
        });
      }, []);
      const set = (k) => (e) => setC({ ...c, [k]: e.target.value });
      const copy = (id, text) => { navigator.clipboard.writeText(text); setCopied(id); setTimeout(() => setCopied(""), 1400); };
      return (
        <div className="wrap">
          <span className="kicker">Oriya · outreach workbench — internal</span>
          <h1>Founders vs Operators launch set. One inbox at a time.</h1>
          <p className="sm dim" style={{ marginTop: 4 }}>Drafts open in your own mail client (mailto:) — nothing sends automatically, nothing is stored, no contact list lives on this page.</p>
          <p className="xs dim" style={{ marginTop: 6 }}>The <span className="mono" style={{ color: "var(--accent)" }}>WA1–WA5</span> cards are the WhatsApp auto-reply scripts for the bot (copy-only). Every number is a live-filled <span className="mono">[TOKEN]</span> — computed per athlete from the real board at send time, never hardcoded here.</p>
          <p className="xs dim" style={{ marginTop: 6 }}>Live standing baked into every template below: <span className="mono" style={{ color: "var(--accent)" }}>{standingLine(standing)}</span>{standing === "none" && " (sample data or too early — no outbound claim made)"}</p>
          <div className="bar">
            <div><label>Target email</label><input type="email" placeholder="alex@barrys.com" value={c.email} onChange={set("email")} /></div>
            <div><label>First name</label><input placeholder="Alex" value={c.n} onChange={set("n")} /></div>
            <div><label>Company / fund / studio</label><input placeholder="Barry's Castro" value={c.co} onChange={set("co")} /></div>
            <div><label>Active athletes</label><input className="mono" type="number" min="0" placeholder="20" value={c.x} onChange={set("x")} /></div>
          </div>
          <div className="grid">
            {seqs(c, standing).map((t) => {
              const ok = !t.post && /@/.test(c.email) && (t.id !== "b2b" || Number(c.x) > 0);
              return (
                <div className="card" key={t.id}>
                  <span className="tag">{t.tag}</span>
                  <h2>{t.title}</h2>
                  <p className="sm dim">{t.obj}</p>
                  <p className="subj mono">{t.s}</p>
                  {t.id === "b2b" && <p className="note">Launch unlocks once “Active athletes” is filled — and only with the real number off the live board. An invented stat kills the pitch and the brand.</p>}
                  {(t.id === "reddit_post" || t.id === "linkedin_post") && !c.x && <p className="note">Headcount line stays off until “Active athletes” holds a real number.</p>}
                  <div className="spacer"></div>
                  <button className="ghost" onClick={() => copy(t.id, t.wa ? t.b : "Subject: " + t.s + "\n\n" + t.b)}>{copied === t.id ? "Copied ✓" : (t.wa ? "Copy message" : "Copy template")}</button>
                  {!t.post && <a className={"btn" + (ok ? "" : " off")} href={"mailto:" + c.email + "?subject=" + encodeURIComponent(t.s) + "&body=" + encodeURIComponent(t.b)}>Launch email →</a>}
                </div>
              );
            })}
          </div>
          <div className="panels">
            <WinPanel copied={copied} copy={copy} />
            <div className="card">
              <span className="tag">COMMERCIAL MATRIX — REFERENCE</span>
              <div className="krow"><span>Tier 1 · Seed</span><span className="mono">$0</span></div>
              <p className="xs dim">Named studio squad + live board. The pilot proves the room before any money moves.</p>
              <div className="krow"><span>Tier 2 · Sponsor <span className="dim">(Barry's / CrossFit operators)</span></span><span className="mono">$300–500</span></div>
              <p className="xs dim">Brand funds a squad's prize pot for a season. Athletes win the pot; sponsors are never paid out — prize sponsorship, not a wager.</p>
              <div className="krow"><span>Tier 3 · Enterprise</span><span className="mono">$1k–2k</span></div>
              <p className="xs dim">Branded season across multiple squads + aggregate recovery reporting.</p>
              <p className="note">Money never moves from this page: invoices go out as Airwallex links from team@oriya.app after manual verification.</p>
            </div>
            <div className="card">
              <span className="tag">PRIVACY PITCH — PASTE-READY</span>
              <p className="sm" style={{ borderLeft: "2px solid var(--accent)", paddingLeft: 10 }}>{PRIVACY}</p>
              <div className="spacer"></div>
              <p className="xs dim">Reworded from “zero-knowledge bypasses HR review”: zero-knowledge means something specific in cryptography that this isn't, and we make no claims about anyone's HR process. This version promises only what the architecture enforces.</p>
              <button className="ghost" onClick={() => copy("privacy", PRIVACY)}>{copied === "privacy" ? "Copied ✓" : "Copy snippet"}</button>
            </div>
            <div className="card">
              <span className="tag">KEY FACTS — NEVER GET THESE WRONG</span>
              {KEY_FACTS.map(([k, v]) => (
                <div key={k} style={{ marginTop: 6 }}>
                  <p className="sm" style={{ fontWeight: 600 }}>{k}</p>
                  <p className="xs dim" style={{ marginTop: 1 }}>{v}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
