<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Oriya · Outreach workbench (internal)</title>
  <!-- Internal founder tool — the 4-stage outreach matrix as an email workbench.
       Spec asked for Next.js /app/partners/dashboard/page.tsx; this repo deploys
       build-less (Worker + static assets), so it ships as this page instead.
       Everything is mailto: drafts — nothing sends automatically, nothing is
       stored, no contact list lives in the repo. Unguessable filename on
       purpose (like the ops console) — noindex + unlinked, but that's
       obscurity, not auth; Cloudflare Access is the real lock if needed. -->
  <style>
    :root { --bg:#0B0C0E; --panel:#101114; --line:#23252B; --text:#E6E7EA; --dim:#8A8F98; --accent:#7FB79E; --amber:#D7A25C; }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--text); font:14px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1100px; margin:0 auto; padding:28px 18px 80px; }
    .mono { font-family:ui-monospace,"JetBrains Mono",monospace; }
    .kicker { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
    h1 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin-top:6px; }
    h2 { font-size:14px; font-weight:600; letter-spacing:-.01em; }
    .dim { color:var(--dim); } .sm { font-size:12.5px; } .xs { font-size:11px; }
    .bar { display:grid; grid-template-columns:2fr 1.1fr 1.3fr .8fr; gap:8px; margin-top:16px; }
    label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:4px; }
    input { width:100%; font:inherit; background:#0D0E11; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px 11px; outline:none; transition:all .2s ease; }
    input:focus { border-color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
    .panels { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
    @media (max-width:980px) { .grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:620px) { .grid, .panels, .bar { grid-template-columns:1fr; } }
    .card { background:rgba(16,17,20,.55); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .tag { font-size:10px; letter-spacing:.14em; color:var(--accent); font-family:ui-monospace,monospace; }
    .subj { font-size:11px; color:var(--dim); border-left:2px solid var(--line); padding-left:8px; word-break:break-word; }
    .spacer { flex:1; }
    .btn { position:relative; overflow:hidden; display:block; text-align:center; text-decoration:none; background:var(--accent); color:#0B0C0E; border:0; border-radius:9px; padding:10px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s ease; }
    .btn:hover { filter:brightness(1.08); }
    .btn.off { opacity:.4; pointer-events:none; }
    .btn::after { content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); background-size:220% 100%; background-position:200% 0; opacity:0; transition:opacity .2s ease; pointer-events:none; }
    .btn:hover::after { opacity:1; animation:shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    @media (prefers-reduced-motion: reduce) { .btn:hover::after { animation:none; opacity:0; } }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px; font:inherit; font-size:12px; cursor:pointer; transition:all .2s ease; }
    .ghost:hover { border-color:#3A3D45; }
    .note { font-size:11px; color:var(--amber); }
    .krow { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding-top:8px; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;
    const SIGN = "\n\n— Diana · founder, Oriya (oriya.app)";

    // Every body is honest about today's product: screenshot IS the entry (no
    // sync promise), /play is the canonical conversion link, and the B2B count
    // is typed in by hand — this page never invents a traction number.
    function seqs(c) {
      const n = c.n || "there", co = c.co || "your studio";
      return [
        { id: "list", tag: "01 · COLD — LIST BUILDER", title: "Audience & list builder",
          obj: "Advertise the concept, grow the list. The only ask is one weekly email.",
          s: "Morning recovery scores, as a team sport (SF)",
          b: "Hi " + n + ",\n\nI'm Diana, founder of Oriya. The recovery score you already check every morning (Oura / Whoop / Garmin / Apple) becomes a team game — squads, 7-day sprints, one live board.\n\nWe're hand-picking the founding SF group right now. The build-in-public email is one a week, unsubscribe anytime: oriya.app/reads\n\nRather just see the game? oriya.app/play" + SIGN },
        { id: "pass", tag: "02 · CONVERT — SEASON 1 PASS", title: "The Season 1 Pass pitch",
          obj: "They showed interest — convert to a Season 1 seat + a chosen sprint. /play is the link.",
          s: "Your Season 1 seat — pick a side",
          b: "Hi " + n + ",\n\nSeason 1 of Oriya is a 7-day sprint: pick a side, send one morning screenshot — that's the whole entry — and your score counts toward your team's average every day you log.\n\nThe game in 5 steps (2-minute read): oriya.app/play\nPick your sprint and your side: oriya.app/try\n\nFounding-season athletes get the FOUNDING 50 stamp on their public Body Passport, and every sprint runs on a live team board.\n\nWhich side are you taking?" + SIGN },
        { id: "confirm", tag: "03 · ONBOARD — SPRINT CONFIRMED", title: "The sprint confirmation",
          obj: "Send the moment they confirm a sprint. Day-1 mechanics only, nothing new to decide.",
          s: "You're in — Day 1 is tomorrow morning",
          b: "Hi " + n + ",\n\nYou're on the board. Here's Day 1:\n\n1. Tomorrow morning, screenshot your recovery score (any device — device sync isn't wired up yet, the screenshot IS the entry).\n2. Send it in about 60 seconds: oriya.app/submit\n3. A person reads it and posts your Oriya Index, usually within the hour. Your athlete-board code comes back by email — it opens your 7-day board at oriya.app/board.\n\nYour public Body Passport lives at oriya.app/p/ + your code — share it or don't, your call (anonymous mode included).\n\nMiss a morning and it counts 0 for your squad. The streak is the game." + SIGN },
        { id: "b2b", tag: "04 · SCALE — B2B PARTNER PIVOT", title: "The B2B partner pivot",
          obj: "Send at 20 / 30 / 50 active locals. Social proof into the 3-tier pitch — real count only.",
          s: (c.x || "[X]") + " athletes on a live SF board — Oriya × " + co,
          b: "Hi " + n + ",\n\nI run Oriya — SF athletes logging their morning recovery scores onto live squad boards. We have " + (c.x || "[X]") + " active athletes sprinting in SF right now — let's get " + co + " on the board they check every morning.\n\nThree ways in:\n· Seed ($0) — a named " + co + " squad + live board. Pilot, no cost.\n· Sponsor ($300–500) — your brand funds a squad's prize pot for a season. Athletes win the pot; sponsors are never paid out — prize sponsorship, not a wager.\n· Enterprise ($1k–2k) — a branded season across multiple squads, aggregate recovery reporting only (never individual data).\n\nWorth 15 minutes this week?" + SIGN },
      ];
    }

    const PRIVACY = "Privacy as architecture: corporate partners get aggregate squad averages only — no individual recovery data appears in any partner report. Athletes control their own public passports (anonymous mode included), so there is no employee health file for anyone to review.";

    function App() {
      const [c, setC] = useState({ email: "", n: "", co: "", x: "" });
      const [copied, setCopied] = useState("");
      const set = (k) => (e) => setC({ ...c, [k]: e.target.value });
      const copy = (id, text) => { navigator.clipboard.writeText(text); setCopied(id); setTimeout(() => setCopied(""), 1400); };
      return (
        <div className="wrap">
          <span className="kicker">Oriya · outreach workbench — internal</span>
          <h1>Four sequences. One inbox at a time.</h1>
          <p className="sm dim" style={{ marginTop: 4 }}>Drafts open in your own mail client (mailto:) — nothing sends automatically, nothing is stored, no contact list lives on this page.</p>
          <div className="bar">
            <div><label>Target email</label><input type="email" placeholder="alex@barrys.com" value={c.email} onChange={set("email")} /></div>
            <div><label>First name</label><input placeholder="Alex" value={c.n} onChange={set("n")} /></div>
            <div><label>Company / squad</label><input placeholder="Barry's Castro" value={c.co} onChange={set("co")} /></div>
            <div><label>Active athletes</label><input className="mono" type="number" min="0" placeholder="20" value={c.x} onChange={set("x")} /></div>
          </div>
          <div className="grid">
            {seqs(c).map((t) => {
              const ok = /@/.test(c.email) && (t.id !== "b2b" || Number(c.x) > 0);
              return (
                <div className="card" key={t.id}>
                  <span className="tag">{t.tag}</span>
                  <h2>{t.title}</h2>
                  <p className="sm dim">{t.obj}</p>
                  <p className="subj mono">{t.s}</p>
                  {t.id === "b2b" && <p className="note">Launch unlocks once “Active athletes” is filled — and only with the real number off the live board. An invented stat kills the pitch and the brand.</p>}
                  <div className="spacer"></div>
                  <button className="ghost" onClick={() => copy(t.id, "Subject: " + t.s + "\n\n" + t.b)}>{copied === t.id ? "Copied ✓" : "Copy template"}</button>
                  <a className={"btn" + (ok ? "" : " off")} href={"mailto:" + c.email + "?subject=" + encodeURIComponent(t.s) + "&body=" + encodeURIComponent(t.b)}>Launch email →</a>
                </div>
              );
            })}
          </div>
          <div className="panels">
            <div className="card">
              <span className="tag">COMMERCIAL MATRIX — REFERENCE</span>
              <div className="krow"><span>Tier 1 · Seed</span><span className="mono">$0</span></div>
              <p className="xs dim">Named studio squad + live board. The pilot proves the room before any money moves.</p>
              <div className="krow"><span>Tier 2 · Sponsor <span className="dim">(Barry's / CrossFit operators)</span></span><span className="mono">$300–500</span></div>
              <p className="xs dim">Brand funds a squad's prize pot for a season. Athletes win the pot; sponsors are never paid out — prize sponsorship, not a wager.</p>
              <div className="krow"><span>Tier 3 · Enterprise</span><span className="mono">$1k–2k</span></div>
              <p className="xs dim">Branded season across multiple squads + aggregate recovery reporting.</p>
              <p className="note">Money never moves from this page: invoices go out as Airwallex links from team@oriya.app after manual verification.</p>
            </div>
            <div className="card">
              <span className="tag">PRIVACY PITCH — PASTE-READY</span>
              <p className="sm" style={{ borderLeft: "2px solid var(--accent)", paddingLeft: 10 }}>{PRIVACY}</p>
              <div className="spacer"></div>
              <p className="xs dim">Reworded from “zero-knowledge bypasses HR review”: zero-knowledge means something specific in cryptography that this isn't, and we make no claims about anyone's HR process. This version promises only what the architecture enforces.</p>
              <button className="ghost" onClick={() => copy("privacy", PRIVACY)}>{copied === "privacy" ? "Copied ✓" : "Copy snippet"}</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
