<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oriya — Your Body Passport</title>
  <meta name="description" content="Drop a recovery screenshot. We OCR-verify it, normalize it to the Oriya Index, and drop you into live recovery challenges." />
  <meta name="theme-color" content="#020617">
  <script>
    /* Theme boot — before first paint; same key as index.html so the choice
       follows the visitor across pages. Brand default is dark. */
    (function () {
      var t = "dark";
      try { var s = localStorage.getItem("oriya:theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
      document.documentElement.dataset.theme = t;
      try { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#F4F2EB" : "#020617"; } catch (e) {}
    })();
  </script>

  <!-- No build step. UMD React + ReactDOM + Babel Standalone (plain text/babel).
       Tesseract.js (OCR) and html-to-image (share PNG) are lazy-loaded on demand. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* var-based so the light/dark toggle re-colors every utility class;
               triplets live in :root / :root[data-theme="light"] in the page stylesheet */
            void: "rgb(var(--c-void) / <alpha-value>)", ink: "rgb(var(--c-ink) / <alpha-value>)", graphite: "rgb(var(--c-graphite) / <alpha-value>)",
            bone: "rgb(var(--c-bone) / <alpha-value>)", ash: "rgb(var(--c-ash) / <alpha-value>)",
            jade: { DEFAULT: "rgb(var(--c-jade) / <alpha-value>)", deep: "rgb(var(--c-jade-deep) / <alpha-value>)", glow: "rgb(var(--c-jade-glow) / <alpha-value>)" },
            amber: { brand: "rgb(var(--c-amber) / <alpha-value>)", deep: "rgb(var(--c-amber-deep) / <alpha-value>)", glow: "rgb(var(--c-amber-glow) / <alpha-value>)" },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            display: ['"Instrument Serif"', 'ui-serif', 'Georgia', 'serif'],
          },
          keyframes: {
            "fade-up": { "0%": { opacity: 0, transform: "translateY(8px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
            "pop-in": { "0%": { opacity: 0, transform: "scale(.96)" }, "100%": { opacity: 1, transform: "scale(1)" } },
            "sheet-up": { "0%": { opacity: 0, transform: "translateY(24px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
          },
          animation: {
            "fade-up": "fade-up .5s cubic-bezier(.2,.7,.2,1) both",
            "pop-in": "pop-in .35s cubic-bezier(.2,.7,.2,1) both",
            "sheet-up": "sheet-up .34s cubic-bezier(.2,.7,.2,1) both",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    :root{
      --void:#020617; --ink:#0c0e12; --graphite:#16191F;
      --bone:#ECEAE4; --ash:#8A8F98; --hairline:rgba(236,234,228,.10);
      --jade:#7FB79E; --jade-deep:#3E6F5E; --amber:#D7A25C; --amber-deep:#B5723C;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
      /* space-separated triplets feed tailwind's rgb(var() / <alpha-value>) colors */
      --c-void:2 6 23; --c-ink:12 14 18; --c-graphite:22 25 31;
      --c-bone:236 234 228; --c-ash:138 143 152;
      --c-jade:127 183 158; --c-jade-deep:62 111 94; --c-jade-glow:159 211 187;
      --c-amber:215 162 92; --c-amber-deep:181 114 60; --c-amber-glow:240 192 131;
      color-scheme:dark;
    }
    :root[data-theme="light"]{
      color-scheme:light;
      --void:#F4F2EB; --ink:#FAF8F2; --graphite:#ECE9E0;
      --bone:#181C25; --ash:#5C6270; --hairline:rgba(24,28,37,.14);
      --jade:#3E7A5F; --jade-deep:#2E5C47; --amber:#A9691F; --amber-deep:#8A5518;
      --c-void:244 242 235; --c-ink:250 248 242; --c-graphite:236 233 224;
      --c-bone:24 28 37; --c-ash:92 98 112;
      --c-jade:62 122 95; --c-jade-deep:46 92 71; --c-jade-glow:78 148 116;
      --c-amber:169 105 31; --c-amber-deep:138 85 24; --c-amber-glow:185 126 44;
    }
    /* dark-pinned islands: the passport artifact and the neon challenge cards
       keep the night palette in light mode (dark console on a light page) */
    :root[data-theme="light"] :is(.dark-pin, .passport-card){
      --bone:#ECEAE4; --ash:#8A8F98; --hairline:rgba(236,234,228,.10);
      --jade:#7FB79E; --jade-deep:#3E6F5E; --amber:#D7A25C; --amber-deep:#B5723C;
      --c-void:2 6 23; --c-ink:12 14 18; --c-graphite:22 25 31;
      --c-bone:236 234 228; --c-ash:138 143 152;
      --c-jade:127 183 158; --c-jade-deep:62 111 94; --c-jade-glow:159 211 187;
      --c-amber:215 162 92; --c-amber-deep:181 114 60; --c-amber-glow:240 192 131;
      color-scheme:dark;
    }
    :root[data-theme="light"] .topnav{ background:rgba(250,248,242,.78); border-bottom:1px solid rgba(24,28,37,.12); }
    .theme-toggle{ width:32px; height:32px; border-radius:50%; border:1px solid var(--hairline);
      background:transparent; color:var(--bone); font-size:14px; line-height:1; cursor:pointer;
      display:inline-grid; place-items:center; flex:none; transition:border-color .25s; }
    .theme-toggle:hover{ border-color:var(--jade-deep); }
    html, body { background:var(--void); }
    body { -webkit-font-smoothing:antialiased; }
    /* serif display — mirrors landing index.html for cross-page cohesion */
    .display{ font-family:'Instrument Serif',ui-serif,Georgia,serif; font-weight:400; letter-spacing:-0.005em; }
    .display em{ font-style:italic; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Live Challenges arena: neon cyber-sport accents (scoped to the
       challenge cards; base tokens elsewhere stay jade/amber on void) ---- */
    .chal-scan { background:linear-gradient(105deg, transparent 42%, rgba(0,255,135,.055) 50%, transparent 58%);
      background-size:260% 100%; animation:chalScan 4.4s linear infinite; }
    @keyframes chalScan { from { background-position:200% 0; } to { background-position:-100% 0; } }
    .live-ring { animation:chalPulseRing 2.2s ease-out infinite; }
    @keyframes chalPulseRing { 0%{ box-shadow:0 0 0 0 rgba(0,255,135,.4); } 70%{ box-shadow:0 0 0 6px rgba(0,255,135,0); } 100%{ box-shadow:0 0 0 0 rgba(0,255,135,0); } }
    /* physics-feel bar fill: overshoot spring curve, fired on scroll-into-view */
    .race-fill { transition:width 1.15s cubic-bezier(.34,1.56,.64,1); }
    @media (prefers-reduced-motion: reduce){
      .chal-scan, .live-ring { animation:none; }
      .race-fill { transition:none; }
    }

    /* ---- Credit-card Body Passport (mirrors landing .passport) ---- */
    .passport-card{
      position:relative; height:100%; width:100%; border-radius:20px;
      background:linear-gradient(155deg,#16191F 0%,#0c0e12 100%);
      border:1px solid var(--hairline); padding:22px;
      display:flex; flex-direction:column; justify-content:space-between;
      box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(236,234,228,.10), inset 0 1px 1px rgba(255,255,255,.06);
      overflow:hidden; color:var(--bone);
    }
    .passport-card::after{ content:""; position:absolute; top:-40%; left:-22%; width:80%; height:180%;
      background:linear-gradient(90deg,transparent,rgba(236,234,228,.05),transparent);
      transform:rotate(18deg); pointer-events:none; }
    .pp-holo{ position:absolute; inset:0; border-radius:20px; pointer-events:none;
      background:linear-gradient(115deg,transparent 28%,rgba(127,183,158,.10) 44%,rgba(215,162,92,.12) 56%,transparent 72%);
      mix-blend-mode:screen; opacity:.75; }
    .pp-chip{ width:42px; height:30px; border-radius:6px; position:relative;
      background:linear-gradient(135deg,var(--amber-deep),var(--amber)); opacity:.92;
      box-shadow:inset 0 1px 1px rgba(255,255,255,.35); }
    .pp-chip::after{ content:""; position:absolute; inset:6px 11px; border:1px solid rgba(0,0,0,.28); border-radius:3px; }
    .mono{ font-family:var(--font-mono); }
    .tnum{ font-variant-numeric:tabular-nums; }
    .emboss{ text-shadow:0 1px 0 rgba(255,255,255,.14), 0 -1px 0 rgba(0,0,0,.45); }
    .pp-name-input{ background:transparent; border:0; outline:0; color:var(--bone);
      font-family:var(--font-mono); letter-spacing:.14em; text-transform:uppercase; }
    .pp-name-input::placeholder{ color:rgba(138,143,152,.6); }
    .pp-dev{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
      padding:6px 12px; border:1px solid var(--hairline); border-radius:999px; color:var(--ash);
      transition:all .25s cubic-bezier(.2,.7,.2,1); cursor:pointer; }
    .pp-dev:hover{ color:var(--bone); border-color:var(--jade-deep); }
    .pp-dev.active{ color:var(--void); background:var(--jade); border-color:var(--jade); }
    .flash{ color:var(--jade) !important; transition:color .45s; }

    /* ---- dual-sided 3D flip ---- */
    .pp-flip{ perspective:1900px; }
    .pp-flip-inner{ position:relative; aspect-ratio:1.586/1; transform-style:preserve-3d;
      transition:transform .82s cubic-bezier(.2,.85,.2,1); cursor:pointer; }
    .pp-flip.flipped .pp-flip-inner{ transform:rotateY(180deg); }
    .pp-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:20px; }
    .pp-face.back{ transform:rotateY(180deg); }

    /* ---- front: glowing chip + holographic member strip ---- */
    .pp-chip-glow{ box-shadow:0 0 18px 2px rgba(215,162,92,.55), inset 0 1px 1px rgba(255,255,255,.4); }
    .pp-strip{ background:linear-gradient(100deg,rgba(236,234,228,.06),rgba(127,183,158,.22),rgba(215,162,92,.30),rgba(236,234,228,.08));
      border:1px solid rgba(236,234,228,.16); border-radius:5px; }

    /* ---- back: brushed metal ---- */
    .passport-card.back{
      background:linear-gradient(135deg,#cfd3d9 0%,#eceef1 20%,#b8bcc4 46%,#dee1e6 70%,#c3c7ce 100%);
      border:1px solid rgba(20,23,28,.18); color:#14171c;
      box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,255,255,.5), inset 0 1px 1px rgba(255,255,255,.7);
    }
    .pp-brushed{ position:absolute; inset:0; border-radius:20px; pointer-events:none; opacity:.55;
      background:repeating-linear-gradient(96deg, rgba(255,255,255,.10) 0 1px, transparent 1px 3px); }

    /* ---- stamps + badges + vault ---- */
    .pp-stamp{ font-family:var(--font-mono); border:1.5px solid rgba(20,23,28,.5); color:rgba(20,23,28,.78);
      border-radius:999px; box-shadow:inset 0 0 0 1px rgba(20,23,28,.16);
      display:flex; align-items:center; justify-content:center; text-align:center; line-height:1; transform:rotate(-8deg); }
    .pp-stamp.locked{ border-style:dashed; border-color:rgba(20,23,28,.3); color:rgba(20,23,28,.4); box-shadow:none; opacity:.6; transform:rotate(5deg); }
    .pp-badge-stamp{ font-family:var(--font-mono); border:1.5px solid rgba(20,23,28,.5); border-radius:6px; color:rgba(20,23,28,.82);
      box-shadow:inset 0 0 0 1px rgba(20,23,28,.16); display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.05; transform:rotate(-3deg); }
    .pp-badge-stamp.locked{ border-style:dashed; border-color:rgba(20,23,28,.3); color:rgba(20,23,28,.4); box-shadow:none; opacity:.5; }
    .pp-vault-gold{ background:linear-gradient(135deg,#B5723C,#F0C083); border:1px solid rgba(20,23,28,.28); border-radius:7px;
      box-shadow:0 2px 6px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.55); }
    .holo-text{ background:linear-gradient(90deg,#9FD3BB,#F0C083,#9FD3BB); -webkit-background-clip:text; background-clip:text; color:transparent; }

    /* ---- competitiveness tier ladder (engagement-based — never score-shame) ---- */
    .pp-tier-badge{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
      font-size:9px; letter-spacing:.16em; text-transform:uppercase; padding:4px 10px; border-radius:999px;
      border:1px solid var(--tier,#C7CDD6); color:var(--tier,#C7CDD6); background:rgba(0,0,0,.28); white-space:nowrap; }
    .pp-tier-dot{ width:7px; height:7px; border-radius:50%; background:var(--tier,#C7CDD6); box-shadow:0 0 7px var(--tier,#C7CDD6); }
    .tier-bronze{ --tier:#C8895A; } .tier-silver{ --tier:#C7CDD6; } .tier-gold{ --tier:#F0C083; } .tier-obsidian{ --tier:#9FD3BB; }
    /* apex tier gets a faint holographic edge on the card */
    .pp-face.tier-obsidian{ box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(159,211,187,.35), inset 0 1px 1px rgba(255,255,255,.08); }
    .pp-face.tier-gold{ box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(240,192,131,.28), inset 0 1px 1px rgba(255,255,255,.06); }

    /* ---- guided preview tour (de-sterilizes the cold dropzone) ---- */
    .tour{ overflow:hidden; max-height:0; transition:max-height .42s ease; }
    .tour.open{ max-height:360px; }
    .tour-stage{ position:relative; border:1px solid var(--hairline); border-radius:16px; background:#05070d;
      padding:18px; margin-top:12px; min-height:214px; overflow:hidden; }
    .tour-cursor{ position:absolute; width:20px; height:20px; z-index:20; pointer-events:none;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); animation:tourCursor 7.5s ease-in-out infinite; }
    @keyframes tourCursor{
      0%{left:50%;top:80%;opacity:0}6%{opacity:1}
      18%{left:50%;top:32%}22%{transform:scale(.82)}26%{transform:scale(1)}
      46%{left:50%;top:32%}
      64%{left:34%;top:66%}68%{transform:scale(.82)}72%{transform:scale(1)}
      92%{left:34%;top:66%}100%{left:50%;top:80%;opacity:.5} }
    .tour-step{ position:absolute; inset:18px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:9px; text-align:center; opacity:0; animation:tourStep 7.5s infinite; }
    .tour-step:nth-of-type(1){ animation-delay:0s }
    .tour-step:nth-of-type(2){ animation-delay:2.5s }
    .tour-step:nth-of-type(3){ animation-delay:5s }
    @keyframes tourStep{ 0%{opacity:0}3%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0} }
    .tour-drop{ width:78%; max-width:280px; border:2px dashed rgba(127,183,158,.5); border-radius:14px; padding:18px;
      color:var(--jade); font-family:var(--font-mono); font-size:12px; background:rgba(127,183,158,.05); }
    .tour-ocr{ width:70%; max-width:240px; height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
    .tour-ocr i{ display:block; height:100%; border-radius:999px;
      background:linear-gradient(90deg,var(--jade-deep),var(--jade)); animation:tourOcr 2.5s ease-out infinite; }
    @keyframes tourOcr{ 0%{width:8%}80%{width:100%}100%{width:100%} }
    .tour-flip{ display:flex; align-items:baseline; gap:10px; }
    .tour-raw{ font-family:var(--font-mono); font-size:22px; color:var(--ash); position:relative; }
    .tour-raw::after{ content:""; position:absolute; left:-2px; right:-2px; top:52%; height:2px; background:var(--amber); border-radius:2px; }
    .tour-arrow{ color:var(--jade); font-size:18px; }
    .tour-score{ font-family:var(--font-mono); font-size:52px; font-weight:600; color:var(--jade); font-variant-numeric:tabular-nums; line-height:1; }
    .tour-row{ width:80%; max-width:260px; display:grid; grid-template-columns:20px 1fr auto; gap:8px; padding:8px 11px;
      border-radius:9px; border:1px solid rgba(127,183,158,.4); background:linear-gradient(90deg,rgba(127,183,158,.14),transparent);
      font-family:var(--font-mono); font-size:13px; }
    /* shared chrome + seamless cross-page fade */
    .topnav{ position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:rgba(2,6,23,.72); border-bottom:1px solid rgba(255,255,255,.08); }
    .topnav-in{ max-width:48rem; margin:0 auto; height:54px; padding:0 1.25rem; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .topnav .brand{ display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:17px; color:var(--bone); }
    .topnav .brand svg{ width:23px; height:23px; }
    .topnav .lnks{ display:flex; align-items:center; gap:16px; font-size:13px; }
    .topnav .lnks a{ color:var(--ash); transition:color .2s; }
    .topnav .lnks a:hover{ color:var(--bone); }
    .topnav .lnks a.cta{ background:var(--jade); color:var(--void); border-radius:999px; padding:8px 15px; font-weight:600; box-shadow:0 0 40px -12px rgba(127,183,158,.5); transition:transform .35s; }
    .topnav .lnks a.cta:hover{ transform:translateY(-2px); color:var(--void); }
    html.pf body{ animation:pfIn .5s ease both; }
    body.pf-out{ opacity:0; transition:opacity .26s ease; }
    @keyframes pfIn{ from{opacity:0} to{opacity:1} }
    @media (max-width:520px){
      .topnav .lnks a.sci{ display:none }
      .topnav .lnks{ gap:12px }
      /* comfortable tap target for the device-swap pills on touch */
      .pp-dev{ padding:9px 15px; font-size:12px }
    }
    @media (prefers-reduced-motion: reduce){
      .tour-cursor,.tour-step,.tour-ocr i{ animation:none }
      .tour-step:nth-of-type(1){ opacity:1 } .tour-step:nth-of-type(2),.tour-step:nth-of-type(3){ display:none }
      html.pf body{ animation:none } }
    /* ---- boot skeleton (shown while Babel compiles; React replaces it on mount) ---- */
    .boot{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; }
    .boot-card{ width:300px; max-width:80vw; aspect-ratio:1.586/1; border-radius:20px; border:1px solid var(--hairline);
      background:linear-gradient(155deg,#16191F,#0c0e12); box-shadow:0 40px 80px -34px rgba(0,0,0,.85); position:relative; overflow:hidden; }
    .boot-card::after{ content:""; position:absolute; inset:0; transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(236,234,228,.09),transparent); animation:bootSheen 1.15s infinite; }
    @keyframes bootSheen{ to{ transform:translateX(100%); } }
    .boot-t{ font-family:var(--font-mono); font-size:12px; letter-spacing:.05em; color:var(--ash); }
    .boot-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--jade); margin-right:8px;
      box-shadow:0 0 8px var(--jade); animation:bootPulse 1s infinite; vertical-align:middle; }
    @keyframes bootPulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce){ .boot-card::after,.boot-dot{ animation:none } }
    /* pulsed default preset on the hook */
    .qt-pulse{ animation:qtPulse 2.4s ease-in-out infinite; }
    @keyframes qtPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(127,183,158,0); } 50%{ box-shadow:0 0 22px -5px rgba(127,183,158,.5); } }
    @media (prefers-reduced-motion: reduce){ .qt-pulse{ animation:none } }
  
    /* ---- LIGHT MODE: white-alpha utility remaps (generated). Dark washes on
       cream; .dark-pin/.passport-card re-pin the originals inside islands ---- */
    [data-theme="light"] .bg-white\/\[0\.015\] { background-color:rgba(16,20,33,0.035); }
    [data-theme="light"] .bg-white\/\[0\.02\] { background-color:rgba(16,20,33,0.042); }
    [data-theme="light"] .bg-white\/\[0\.03\] { background-color:rgba(16,20,33,0.056); }
    [data-theme="light"] .bg-white\/\[0\.04\] { background-color:rgba(16,20,33,0.069); }
    [data-theme="light"] .bg-white\/\[0\.05\] { background-color:rgba(16,20,33,0.083); }
    [data-theme="light"] .bg-white\/5 { background-color:rgba(16,20,33,0.083); }
    [data-theme="light"] .bg-white\/8 { background-color:rgba(16,20,33,0.123); }
    [data-theme="light"] .bg-white\/10 { background-color:rgba(16,20,33,0.15); }
    [data-theme="light"] .bg-white\/15 { background-color:rgba(16,20,33,0.218); }
    [data-theme="light"] .hover\:bg-white\/\[0\.04\]:hover { background-color:rgba(16,20,33,0.069); }
    [data-theme="light"] .hover\:bg-white\/\[0\.06\]:hover { background-color:rgba(16,20,33,0.096); }
    [data-theme="light"] .hover\:bg-white\/\[0\.07\]:hover { background-color:rgba(16,20,33,0.11); }
    [data-theme="light"] .border-white\/5 { border-color:rgba(16,20,33,0.118); }
    [data-theme="light"] .border-white\/8 { border-color:rgba(16,20,33,0.158); }
    [data-theme="light"] .border-white\/10 { border-color:rgba(16,20,33,0.185); }
    [data-theme="light"] .border-white\/12 { border-color:rgba(16,20,33,0.212); }

    /* =============================== Normalizing view (OCR or preset) =============================== */
    function Normalizing({ pending, onDone }) {
      const [progress, setProgress] = useState(0);
      const [msg, setMsg] = useState("Warming up…");
      useEffect(() => {
        let cancelled = false;
        (async () => {
          if (pending.type === "preset") {
            const m = DEVICE_MODEL[pending.deviceKey];
            const steps = ["Reading your " + m.tag + " score…", "Applying " + m.tag + " correction (×" + m.factor + ")…", "Computing Oriya Index…"];
            for (let i = 0; i < steps.length; i++) { if (cancelled) return; setMsg(steps[i]); setProgress((i + 1) / steps.length * 0.92); await wait(440); }
            if (cancelled) return; setProgress(1);
            onDone({ deviceKey: pending.deviceKey, native: pending.native, name: null, confident: true, from: "preset" });
            return;
          }
          // screenshot → OCR
          try {
            setMsg("Loading reader…");
            await loadScript(TESS_URL);
            if (cancelled) return;
            setMsg("Reading your screenshot…"); setProgress(0.12);
            const { data } = await window.Tesseract.recognize(pending.dataUrl, "eng", {
              logger: (mm) => { if (mm.status === "recognizing text" && !cancelled) setProgress(0.12 + mm.progress * 0.72); },
            });
            if (cancelled) return;
            const text = (data && data.text) || "";
            const deviceKey = detectDevice(text);
            const native = extractScore(text);
            const name = extractName(text);
            track("ocr_result", { device: deviceKey, rawScore: native, nameFound: !!name });
            if (deviceKey && native != null) {
              const m = DEVICE_MODEL[deviceKey];
              setMsg("Applying " + m.tag + " correction (×" + m.factor + ")…"); setProgress(0.94); await wait(520);
              if (cancelled) return; setProgress(1);
              onDone({ deviceKey, native, name, confident: true, from: "screenshot" });
            } else {
              track("ocr_fallback", { device: deviceKey, rawScore: native });
              onDone({ deviceKey: deviceKey || null, native: native || null, name: name || null, confident: false, from: "screenshot" });
            }
          } catch (e) {
            if (cancelled) return;
            track("ocr_fallback", { error: String(e && e.message || e) });
            onDone({ deviceKey: null, native: null, name: null, confident: false, from: "screenshot" });
          }
        })();
        return () => { cancelled = true; };
      }, []);

      return (
        <div className="min-h-screen flex flex-col items-center justify-center px-5 bg-void">
          {pending.type === "screenshot" && (
            <img src={pending.dataUrl} alt="" className="w-24 h-24 object-cover rounded-xl border border-white/10 mb-6 opacity-80" />
          )}
          <div className="relative mb-7">
            <div className="w-20 h-20 rounded-full border-2 border-white/10 border-t-jade spin" />
            <Activity className="w-7 h-7 text-jade absolute inset-0 m-auto" />
          </div>
          <div className="font-mono text-sm text-bone/90 h-6 text-center px-4">{msg}</div>
          <div className="mt-5 w-56 h-1.5 rounded-full bg-white/10 overflow-hidden">
            <div className="h-full bg-jade transition-all duration-300" style={{ width: Math.round(progress * 100) + "%" }} />
          </div>
          <p className="text-xs text-ash/70 mt-6 font-mono">{pending.type === "screenshot" ? "OCR-verifying your recovery score" : "Normalizing to the Oriya Index"}</p>
        </div>
      );
    }

    /* =============================== Challenge card =============================== */
    /* live standing bar — the "race" read of the table, leader glows */
    function RaceBar({ race }) {
      const max = Math.max.apply(null, race.map((s) => s.v));
      const sorted = race.slice().sort((a, b) => b.v - a.v);
      const second = sorted.length > 1 ? sorted[1].v : null;
      const sum = race.reduce((s, x) => s + x.v, 0) || 1;
      /* spring-fill: bars start at 0 and overshoot into place on scroll-into-view */
      const [go, setGo] = useState(false);
      const barRef = useRef(null);
      useEffect(() => {
        const el = barRef.current;
        if (!el || !("IntersectionObserver" in window)) { setGo(true); return; }
        const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { setGo(true); io.disconnect(); } }), { threshold: 0.4 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      const tone = (v) => v === max
        ? "bg-[#00FF87] shadow-[0_0_8px_rgba(0,255,135,0.6)]"
        : v === second && sorted[0].v !== second
        ? "bg-[#FF5A36]/80 shadow-[0_0_6px_rgba(255,90,54,0.35)]"
        : "bg-white/15";
      const toneText = (v) => v === max ? "text-[#00FF87]" : v === second && sorted[0].v !== second ? "text-[#FF5A36]/90" : "text-ash";
      return (
        <div className="mt-3" ref={barRef}>
          <div className="flex h-1.5 w-full gap-px overflow-hidden rounded-full bg-white/5">
            {race.map((s) => (
              <span key={s.t} className={"h-full race-fill " + tone(s.v)} style={{ width: go ? (s.v / sum * 100) + "%" : "0%" }} />
            ))}
          </div>
          <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5">
            {race.map((s) => (
              <span key={s.t} className={"font-mono tabular-nums text-[10px] " + toneText(s.v)}>{s.t} {s.v}{s.v === max ? " · leads" : ""}</span>
            ))}
          </div>
        </div>
      );
    }

    /* Slack-ready dare — the snippet leads with who's beating whom by how much,
       because the margin is the line people paste to their team channel.

    function slackSnippet(c, race) {
      const link = "https://oriya.app/try.html?challenge=" + c.id;
      let live = "";
      if (race && race.length > 1) {
        const s = race.slice().sort((a, b) => b.v - a.v);
        const margin = Math.round((s[0].v - s[1].v) * 10) / 10;
        live = "\n" + s[0].t + " is beating " + s.slice(1).map((x) => x.t).join(" and ") + " by " + margin + " point" + (margin === 1 ? "" : "s") + " on the recovery board (founding-season board — sample athletes until sides fill).";
      }
      return "🟩 [Oriya] *" + c.title + "*" + live
        + (c.prize ? "\nPot: " + c.prize + (c.split ? " · " + c.split : "") : "")
        + "\nAny wearable, one fair index. Join to defend your side: " + link;
    }

        const msg = "I'm holding " + (myTeam || "my side") + " down in " + c.title + " on Oriya — my normalized recovery score is on the board. Where would yours land? " + challengeLink;

      /* ---- call the winner: free prediction, no buy-in — the opinion IS the hook.
             Locking a call requires a founding account (name+email) — the sign-up moment. ---- */
      const [call, setCall] = useState(() => { try { return readJSON("oriya:calls", {})[c.id] || null; } catch (e) { return null; } });
      const [account, setAccount] = useState(() => { try { return readJSON("oriya:account", null); } catch (e) { return null; } });
      const [pendingCall, setPendingCall] = useState(null);
      const [acctName, setAcctName] = useState("");
      const [acctEmail, setAcctEmail] = useState("");
      const createAccount = () => {
        const email = acctEmail.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { if (onToast) onToast("Enter a real email — that's the whole account"); return; }
        const acct = { name: acctName.trim(), email, ts: Date.now() };
        try { writeJSON("oriya:account", acct); } catch (e) {}
        setAccount(acct);
        track("account_created", { from: "call_winner", challenge: c.id, email });
        logUserEmail(email, "founding_account", { challenge: c.id, name: acct.name });
        if (pendingCall) { lockCall(pendingCall); setPendingCall(null); }
      };
      /* ---- challenge a coworker: stage the invite (explicit submit → captured
             under source 'challenge_invite') + copy the dare to the clipboard ---- */
      const [invEmail, setInvEmail] = useState("");
      const [invStaged, setInvStaged] = useState(false);
      const stageInvite = () => {
        if (!logUserEmail(invEmail, "challenge_invite", { challenge: c.id, team: myTeam || null })) { if (onToast) onToast("That's not an email yet"); return; }

      const callWeights = (c.teams || []).map((t) => ({ t, w: 30 + (Math.abs(hashStr(c.id + t)) % 41) }));

      const callPcts = callWeights.map((x, i) => ({ t: x.t,
        pct: i === callWeights.length - 1
          ? 100 - callWeights.slice(0, -1).reduce((s, y) => s + Math.round(y.w / wSum * 100), 0)
          : Math.round(x.w / wSum * 100) }));
      const lockCall = (t) => {
        setCall(t);
        try { const m = readJSON("oriya:calls", {}); m[c.id] = t; writeJSON("oriya:calls", m); } catch (e) {}
        track("challenge_winner_called", { challenge: c.id, team: t });

      board.sort((a, b) => b.score - a.score);
      const myRank = joined ? board.findIndex((r) => r.you) + 1 : null;

    function Dashboard({ passport, setPassport, deepId }) {
      const [selected, setSelected] = useState(null);
      // deep-linked from a challenge card — drop them straight onto the board they came for
      useEffect(() => {
        if (!deepId) return;
        const c = CHALLENGES.find((x) => x.id === deepId);
        if (c) { setSelected(c); track("challenge_deeplink_opened", { challenge: deepId }); }
      }, []);
      const [joined, setJoined] = useState({});
      const [userSquads, setUserSquads] = useState([]);
      const [teammates, setTeammates] = useState([]);
      const [toast, setToast] = useState("");
      const [showSim, setShowSim] = useState(false);
      const [creating, setCreating] = useState(false);
      const [squadName, setSquadName] = useState("");
      const [squadEmoji, setSquadEmoji] = useState(SQUAD_EMOJIS[0]);
      const [squadPh, setSquadPh] = useState("Name your squad — e.g. Dawn Patrol RC");
      const startSquadType = (t) => { setSquadEmoji(t.emoji); setSquadPh(t.ph); setSquadName(""); setCreating(true); track("squad_type_picked", { type: t.label }); };
      const [igHandle, setIgHandle] = useState("");
      const [igOpen, setIgOpen] = useState(false);
      const [igInput, setIgInput] = useState("");
      const cardRef = useRef(null);

      const flashToast = (msg) => { setToast(msg); window.clearTimeout(flashToast._t); flashToast._t = window.setTimeout(() => setToast(""), 2600); };

      const swapDevice = (k) => setPassport((p) => ({ ...p, deviceKey: k, native: nativeForOriya(p.oriya, k) }));
      const setName = (v) => setPassport((p) => ({ ...p, name: v }));
      const cycleNation = () => setPassport((p) => {
        const i = NATIONS.findIndex((n) => n.code === p.nationality);
        return { ...p, nationality: NATIONS[(i + 1) % NATIONS.length].code };
      });

      /* ---- derived Body Passport identity (back of card) ---- */
      const hasSquad = !!passport.squad;
      const personality = personalityFor(passport);
      const badges = {};
      if (passport.oriya >= 78) badges.hrvelite = true;
      if (passport.oriya >= 85) badges.peak85 = true;
      if (hasSquad) { badges.warrior7 = true; badges.sleep10 = true; }
      const allChallengeList = userSquads.concat(CHALLENGES);
      const joinedChallenges = Object.keys(joined).map((id) => allChallengeList.find((c) => c && c.id === id)).filter(Boolean);
      const earnings = joinedChallenges.reduce((s, c) => s + (c.projectedPayout || 0), 0);
      const natObj = NATIONS.find((n) => n.code === passport.nationality) || NATIONS[0];
      const countryStamps = [{ label: natObj.code }, { label: "SEASON 1" }];
      joinedChallenges.slice(0, 1).forEach((c) => countryStamps.push({ label: (joined[c.id] || c.joinTeam) }));
      if (countryStamps.length < 3) countryStamps.push({ label: "LOCKED", locked: true });

      /* ---- dynamic rivalry: a founding-account email on a known tech domain elevates
             the board pitting their company against its natural rival ---- */
      const account = readJSON("oriya:account", null);
      const rivalId = rivalryFor(account && account.email);

      /* ---- "where you'd land" — the status payoff BEFORE commitment (Mom Test: lead with the rank, not after) ---- */
      const hotChallenge = CHALLENGES.find((c) => c.id === deepId && c.status === "LIVE" && c.leaderboard && c.leaderboard.length > 0)
        || CHALLENGES.find((c) => c.id === rivalId && c.status === "LIVE" && c.leaderboard && c.leaderboard.length > 0)
        || CHALLENGES.find((c) => c.status === "LIVE" && c.leaderboard && c.leaderboard.length > 0);
      const hotPreviewRank = hotChallenge ? hotChallenge.leaderboard.filter((r) => r.score > passport.oriya).length + 1 : null;
      const hotField = hotChallenge ? hotChallenge.leaderboard.length + 1 : null;
      const alreadyJoinedHot = hotChallenge ? !!joined[hotChallenge.id] : false;

      /* ---- competitiveness tier — climbs with engagement, not the recovery number ---- */
      const tierState = { hasSquad, joinedCount: joinedChallenges.length, earnings, teammates: teammates.length };
      const tier = tierFor(tierState);
      const tierHint = nextTierHint(tierState);
      // LIVE clusters first — a board with people on it, never an empty marketplace for user #1.
      // Within each status group, the visitor's company rivalry (if known) floats to the top.
      const sortedChallenges = CHALLENGES.slice().sort((a, b) =>
        ((a.status === "LIVE" ? 0 : 1) - (b.status === "LIVE" ? 0 : 1))
        || ((a.id === rivalId ? 0 : 1) - (b.id === rivalId ? 0 : 1)));

      const shareUrl = "https://oriya.app/?ref=" + slug(passport.name) + "-" + passport.oriya + (passport.squad ? "&squad=" + encodeURIComponent(passport.squad) : "");
      const caption = (passport.squad ? "Running " + passport.squad + " on Oriya. " : "") + "My readiness normalizes to " + passport.oriya + " on the Oriya Index — same number on any wearable (" + DEVICE_MODEL[passport.deviceKey].tag + ")." + (igHandle ? " @" + igHandle : "") + " Squad's open, pull up 👇";

      const sharePassport = async () => {
        try {
          await loadScript(HTI_URL);
          const dataUrl = await window.htmlToImage.toPng(cardRef.current, { pixelRatio: 2, backgroundColor: "#0c0e12" });
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], "oriya-passport.png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text: caption, url: shareUrl });
            track("passport_shared", { method: "image" });
            return;
          }
          const a = document.createElement("a"); a.href = dataUrl; a.download = "oriya-passport.png"; a.click();
          try { await navigator.clipboard.writeText(shareUrl); } catch (e) {}
          track("passport_shared", { method: "image" });
          flashToast("Passport saved — link copied to share!");
        } catch (e) {
          try { await navigator.clipboard.writeText(shareUrl); } catch (e2) {}
          track("passport_shared", { method: "link" });
          flashToast("Invite link copied to clipboard!");
        }
      };

      const joinChallenge = (c, team) => {
        const t = team || c.joinTeam;
        setJoined((j) => ({ ...j, [c.id]: t }));
        setPassport((p) => ({ ...p, squad: t }));
        track("door_selected", { door: "join" });

    /* =============================== App =============================== */
    function App() {
      const [view, setView] = useState("hook"); // hook | normalizing | confirm | dashboard
      const [pending, setPending] = useState(null);
      const [prefill, setPrefill] = useState(null);
      const [passport, setPassport] = useState(null);
      const [privacy, setPrivacy] = useState(false);
      const [connectKey, setConnectKey] = useState(null);
      const [resume, setResume] = useState(() => { const t = loadTrial(); return t && t.passport ? t.passport : null; });
      // arrived via a challenge card (index.html?challenge=<id>) — carry that intent through the whole flow
      const [deepId, setDeepId] = useState(() => {
        try {
          const c = new URLSearchParams(location.search).get("challenge");
          return c && CHALLENGES.some((x) => x.id === c) ? c : null;
        } catch (e) { return null; }
      });
      const deepChallenge = deepId ? CHALLENGES.find((x) => x.id === deepId) : null;

      useEffect(() => {
        try {
          const p = new URLSearchParams(location.search);
          if (p.get("ref") || p.get("squad")) track("door_selected", { door: "join", squad: p.get("squad") || null, ref: p.get("ref") || null });
          if (deepId) track("challenge_deeplink", { challenge: deepId });
        } catch (e) {}
      }, []);

      useEffect(() => {
        const open = () => { setPrivacy(true); track("privacy_opened", {}); };
        window.addEventListener("oriya:privacy", open);
        if (location.hash === "#privacy") open();
        return () => window.removeEventListener("oriya:privacy", open);
      }, []);

      const beginNormalize = (deviceKey, native) => { setPending({ type: "preset", deviceKey, native }); setView("normalizing"); };
      const startScreenshot = (dataUrl) => { track("device_connect_started", { method: "screenshot" }); setPending({ type: "screenshot", dataUrl }); setView("normalizing"); };
      const startConnect = (key) => { track("device_connect_started", { method: "sync_demo", device: DEVICE_MODEL[key].tag }); setConnectKey(key); };
      const onConnected = (native) => { const key = connectKey; setConnectKey(null); if (key) beginNormalize(key, native); };
      const doResume = () => { track("trial_resumed", { oriya: resume && resume.oriya }); setPassport(resume); setView("dashboard"); };

      const finalize = (deviceKey, native, name, via) => {
        const m = DEVICE_MODEL[deviceKey];
        const oriya = toOriyaStandard(native, deviceKey);
        track("device_connect_completed", { device: m.tag, via: via || "auto" });
        track("passport_generated", { device: m.tag, native, oriya });
        const p = { deviceKey, native, oriya, name: name || "", squad: null, nationality: "USA", personaIdx: pickPersona(deviceKey, native, oriya) };
        setPassport(p);
        saveTrial({ passport: p, device: m.tag, native, oriya, via: via || "auto" }); // durable: survives reload, resumable
        setResume(p);
        setView("dashboard");
      };
      // screenshots ALWAYS pass through the verify step (editable, pre-filled) — the user
      // confirms the OCR read before it becomes their number; presets/sync skip it.
      const handleResolved = (r) => { if (r.from === "screenshot" || !r.confident) { setPrefill(r); setView("confirm"); return; } finalize(r.deviceKey, r.native, r.name); };

      const screen = view === "hook" ? <Hook onScreenshot={startScreenshot} onConnect={startConnect} resume={resume} onResume={doResume} deep={deepChallenge} />
        : view === "normalizing" ? <Normalizing pending={pending} onDone={handleResolved} />
        : view === "confirm" ? <Confirm prefill={prefill} onConfirm={(d) => finalize(d.deviceKey, d.native, d.name, "manual")} onBack={() => setView("hook")} />
        : <Dashboard passport={passport} setPassport={setPassport} deepId={deepId} />;
      return (
        <React.Fragment>
          {screen}
          {connectKey && <ConnectSheet deviceKey={connectKey} onConnected={onConnected} onClose={() => setConnectKey(null)} />}
          {privacy && <PrivacyVault onClose={() => setPrivacy(false)} />}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
