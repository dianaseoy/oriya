<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oriya — Your Body Passport</title>
  <meta name="description" content="Drop a recovery screenshot. We OCR-verify it, normalize it to the Oriya Standard, and drop you into live recovery challenges." />

  <!-- No build step. UMD React + ReactDOM + Babel Standalone (plain text/babel).
       Tesseract.js (OCR) and html-to-image (share PNG) are lazy-loaded on demand. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: "#020617", ink: "#0c0e12", graphite: "#16191F",
            bone: "#ECEAE4", ash: "#8A8F98",
            jade: { DEFAULT: "#7FB79E", deep: "#3E6F5E", glow: "#9FD3BB" },
            amber: { brand: "#D7A25C", deep: "#B5723C", glow: "#F0C083" },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          keyframes: {
            "fade-up": { "0%": { opacity: 0, transform: "translateY(8px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
            "pop-in": { "0%": { opacity: 0, transform: "scale(.96)" }, "100%": { opacity: 1, transform: "scale(1)" } },
          },
          animation: {
            "fade-up": "fade-up .5s cubic-bezier(.2,.7,.2,1) both",
            "pop-in": "pop-in .35s cubic-bezier(.2,.7,.2,1) both",
          },
        },
      },
    };

  <style>
    :root{
      --void:#020617; --ink:#0c0e12; --graphite:#16191F;
      --bone:#ECEAE4; --ash:#8A8F98; --hairline:rgba(236,234,228,.10);
      --jade:#7FB79E; --jade-deep:#3E6F5E; --amber:#D7A25C; --amber-deep:#B5723C;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    html, body { background:#020617; }
    body { -webkit-font-smoothing:antialiased; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Credit-card Body Passport (mirrors landing .passport) ---- */
    .passport-card{
      position:relative; height:100%; width:100%; border-radius:20px;
      background:linear-gradient(155deg,#16191F 0%,#0c0e12 100%);
      border:1px solid var(--hairline); padding:22px;
      display:flex; flex-direction:column; justify-content:space-between;
      box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(236,234,228,.10), inset 0 1px 1px rgba(255,255,255,.06);
      overflow:hidden; color:var(--bone);
    }
    .passport-card::after{ content:""; position:absolute; top:-40%; left:-22%; width:80%; height:180%;
      background:linear-gradient(90deg,transparent,rgba(236,234,228,.05),transparent);
      transform:rotate(18deg); pointer-events:none; }
    .pp-holo{ position:absolute; inset:0; border-radius:20px; pointer-events:none;
      background:linear-gradient(115deg,transparent 28%,rgba(127,183,158,.10) 44%,rgba(215,162,92,.12) 56%,transparent 72%);
      mix-blend-mode:screen; opacity:.75; }
    .pp-chip{ width:42px; height:30px; border-radius:6px; position:relative;
      background:linear-gradient(135deg,var(--amber-deep),var(--amber)); opacity:.92;
      box-shadow:inset 0 1px 1px rgba(255,255,255,.35); }
    .pp-chip::after{ content:""; position:absolute; inset:6px 11px; border:1px solid rgba(0,0,0,.28); border-radius:3px; }
    .mono{ font-family:var(--font-mono); }
    .tnum{ font-variant-numeric:tabular-nums; }
    .emboss{ text-shadow:0 1px 0 rgba(255,255,255,.14), 0 -1px 0 rgba(0,0,0,.45); }
    .pp-name-input{ background:transparent; border:0; outline:0; color:var(--bone);
      font-family:var(--font-mono); letter-spacing:.14em; text-transform:uppercase; }
    .pp-name-input::placeholder{ color:rgba(138,143,152,.6); }
    .pp-dev{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
      padding:6px 12px; border:1px solid var(--hairline); border-radius:999px; color:var(--ash);
      transition:all .25s cubic-bezier(.2,.7,.2,1); cursor:pointer; }
    .pp-dev:hover{ color:var(--bone); border-color:var(--jade-deep); }
    .pp-dev.active{ color:var(--void); background:var(--jade); border-color:var(--jade); }
    .flash{ color:var(--jade) !important; transition:color .45s; }

    /* ---- dual-sided 3D flip ---- */
    .pp-flip{ perspective:1900px; }
    .pp-flip-inner{ position:relative; aspect-ratio:1.586/1; transform-style:preserve-3d;
      transition:transform .82s cubic-bezier(.2,.85,.2,1); cursor:pointer; }
    .pp-flip.flipped .pp-flip-inner{ transform:rotateY(180deg); }
    .pp-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:20px; }
    .pp-face.back{ transform:rotateY(180deg); }

    /* ---- front: glowing chip + holographic member strip ---- */
    .pp-chip-glow{ box-shadow:0 0 18px 2px rgba(215,162,92,.55), inset 0 1px 1px rgba(255,255,255,.4); }
    .pp-strip{ background:linear-gradient(100deg,rgba(236,234,228,.06),rgba(127,183,158,.22),rgba(215,162,92,.30),rgba(236,234,228,.08));
      border:1px solid rgba(236,234,228,.16); border-radius:5px; }

    /* ---- back: brushed metal ---- */
    .passport-card.back{
      background:linear-gradient(135deg,#cfd3d9 0%,#eceef1 20%,#b8bcc4 46%,#dee1e6 70%,#c3c7ce 100%);
      border:1px solid rgba(20,23,28,.18); color:#14171c;
      box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,255,255,.5), inset 0 1px 1px rgba(255,255,255,.7);
    }
    .pp-brushed{ position:absolute; inset:0; border-radius:20px; pointer-events:none; opacity:.55;
      background:repeating-linear-gradient(96deg, rgba(255,255,255,.10) 0 1px, transparent 1px 3px); }

    /* ---- stamps + badges + vault ---- */
    .pp-stamp{ font-family:var(--font-mono); border:1.5px solid rgba(20,23,28,.5); color:rgba(20,23,28,.78);
      border-radius:999px; box-shadow:inset 0 0 0 1px rgba(20,23,28,.16);
      display:flex; align-items:center; justify-content:center; text-align:center; line-height:1; transform:rotate(-8deg); }
    .pp-stamp.locked{ border-style:dashed; border-color:rgba(20,23,28,.3); color:rgba(20,23,28,.4); box-shadow:none; opacity:.6; transform:rotate(5deg); }
    .pp-badge-stamp{ font-family:var(--font-mono); border:1.5px solid rgba(20,23,28,.5); border-radius:6px; color:rgba(20,23,28,.82);
      box-shadow:inset 0 0 0 1px rgba(20,23,28,.16); display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.05; transform:rotate(-3deg); }
    .pp-badge-stamp.locked{ border-style:dashed; border-color:rgba(20,23,28,.3); color:rgba(20,23,28,.4); box-shadow:none; opacity:.5; }
    .pp-vault-gold{ background:linear-gradient(135deg,#B5723C,#F0C083); border:1px solid rgba(20,23,28,.28); border-radius:7px;
      box-shadow:0 2px 6px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.55); }
    .holo-text{ background:linear-gradient(90deg,#9FD3BB,#F0C083,#9FD3BB); -webkit-background-clip:text; background-clip:text; color:transparent; }

    /* ---- competitiveness tier ladder (engagement-based — never score-shame) ---- */
    .pp-tier-badge{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
      font-size:9px; letter-spacing:.16em; text-transform:uppercase; padding:4px 10px; border-radius:999px;
      border:1px solid var(--tier,#C7CDD6); color:var(--tier,#C7CDD6); background:rgba(0,0,0,.28); white-space:nowrap; }
    .pp-tier-dot{ width:7px; height:7px; border-radius:50%; background:var(--tier,#C7CDD6); box-shadow:0 0 7px var(--tier,#C7CDD6); }
    .tier-bronze{ --tier:#C8895A; } .tier-silver{ --tier:#C7CDD6; } .tier-gold{ --tier:#F0C083; } .tier-obsidian{ --tier:#9FD3BB; }
    /* apex tier gets a faint holographic edge on the card */
    .pp-face.tier-obsidian{ box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(159,211,187,.35), inset 0 1px 1px rgba(255,255,255,.08); }
    .pp-face.tier-gold{ box-shadow:0 40px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(240,192,131,.28), inset 0 1px 1px rgba(255,255,255,.06); }

    /* ---- guided preview tour (de-sterilizes the cold dropzone) ---- */
    .tour{ overflow:hidden; max-height:0; transition:max-height .42s ease; }
    .tour.open{ max-height:360px; }
    .tour-stage{ position:relative; border:1px solid var(--hairline); border-radius:16px; background:#05070d;
      padding:18px; margin-top:12px; min-height:214px; overflow:hidden; }
    .tour-cursor{ position:absolute; width:20px; height:20px; z-index:20; pointer-events:none;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); animation:tourCursor 9s ease-in-out infinite; }
    @keyframes tourCursor{
      0%{left:50%;top:80%;opacity:0}6%{opacity:1}
      18%{left:50%;top:32%}22%{transform:scale(.82)}26%{transform:scale(1)}
      46%{left:50%;top:32%}
      64%{left:34%;top:66%}68%{transform:scale(.82)}72%{transform:scale(1)}
      92%{left:34%;top:66%}100%{left:50%;top:80%;opacity:.5} }
    .tour-step{ position:absolute; inset:18px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:10px; text-align:center; opacity:0; animation:tourStep 9s infinite; }
    .tour-step:nth-of-type(1){ animation-delay:0s }
    .tour-step:nth-of-type(2){ animation-delay:3s }
    .tour-step:nth-of-type(3){ animation-delay:6s }
    @keyframes tourStep{ 0%{opacity:0}3%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0} }
    .tour-drop{ width:78%; max-width:280px; border:2px dashed rgba(127,183,158,.5); border-radius:14px; padding:18px;
      color:var(--jade); font-family:var(--font-mono); font-size:12px; background:rgba(127,183,158,.05); }
    .tour-ocr{ width:70%; max-width:240px; height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
    .tour-ocr i{ display:block; height:100%; border-radius:999px;
      background:linear-gradient(90deg,var(--jade-deep),var(--jade)); animation:tourOcr 3s ease-out infinite; }
    @keyframes tourOcr{ 0%{width:8%}80%{width:100%}100%{width:100%} }
    .tour-score{ font-family:var(--font-mono); font-size:42px; color:var(--jade); font-variant-numeric:tabular-nums; line-height:1; }
    .tour-row{ width:80%; max-width:260px; display:grid; grid-template-columns:20px 1fr auto; gap:8px; padding:8px 11px;
      border-radius:9px; border:1px solid rgba(127,183,158,.4); background:linear-gradient(90deg,rgba(127,183,158,.14),transparent);
      font-family:var(--font-mono); font-size:13px; }
    /* shared chrome + seamless cross-page fade */
    .topnav{ position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:rgba(2,6,23,.72); border-bottom:1px solid rgba(255,255,255,.08); }
    .topnav-in{ max-width:48rem; margin:0 auto; height:54px; padding:0 1.25rem; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .topnav .brand{ display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:17px; color:var(--bone); }
    .topnav .brand svg{ width:23px; height:23px; }
    .topnav .lnks{ display:flex; align-items:center; gap:16px; font-size:13px; }
    .topnav .lnks a{ color:var(--ash); transition:color .2s; }
    .topnav .lnks a:hover{ color:var(--bone); }
    .topnav .lnks a.cta{ background:var(--jade); color:var(--void); border-radius:999px; padding:8px 15px; font-weight:600; box-shadow:0 0 40px -12px rgba(127,183,158,.5); transition:transform .35s; }
    .topnav .lnks a.cta:hover{ transform:translateY(-2px); color:var(--void); }
    html.pf body{ animation:pfIn .5s ease both; }
    body.pf-out{ opacity:0; transition:opacity .26s ease; }
    @keyframes pfIn{ from{opacity:0} to{opacity:1} }
    @media (max-width:520px){ .topnav .lnks a.sci{ display:none } }
    @media (prefers-reduced-motion: reduce){
      .tour-cursor,.tour-step,.tour-ocr i{ animation:none }
      .tour-step:nth-of-type(1){ opacity:1 } .tour-step:nth-of-type(2),.tour-step:nth-of-type(3){ display:none }
      html.pf body{ animation:none } }
  </style>
</head>
<body class="bg-void text-bone font-sans">
  <script>
  (function(){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.documentElement.classList.add("pf");
    addEventListener("pageshow", function(){ document.body && document.body.classList.remove("pf-out"); });
    document.addEventListener("click", function(e){
      var a = e.target.closest && e.target.closest("a"); if(!a) return;
      var h = a.getAttribute("href") || "";
      if (a.target === "_blank" || a.hasAttribute("download")) return;
      if (/^(https?:|mailto:|tel:|#)/.test(h) || h === "") return;
      if (/\.html(#.*)?$/.test(h)) { e.preventDefault(); document.body.classList.add("pf-out"); setTimeout(function(){ location.href = h; }, 240); }
    });
  })();
  </script>

        ["ultrahuman", /ultrahuman|movement\s*index/],
        ["apple", /\bapple\b|vitals|cardio|\bhrv\b|\bsdnn\b|recovery\s*rate/],

      for (const [k, re] of tests) if (re.test(t)) return k;

    /* =============================== Normalizing view (OCR or preset) =============================== */
    function Normalizing({ pending, onDone }) {
      const [progress, setProgress] = useState(0);
      const [msg, setMsg] = useState("Warming up…");
      useEffect(() => {
        let cancelled = false;
        (async () => {
          if (pending.type === "preset") {
            const m = DEVICE_MODEL[pending.deviceKey];
            const steps = ["Reading your " + m.tag + " score…", "Applying " + m.tag + " correction (×" + m.factor + ")…", "Computing Oriya Standard…"];
            for (let i = 0; i < steps.length; i++) { if (cancelled) return; setMsg(steps[i]); setProgress((i + 1) / steps.length * 0.92); await wait(440); }
            if (cancelled) return; setProgress(1);
            onDone({ deviceKey: pending.deviceKey, native: pending.native, name: null, confident: true });
            return;
          }
          // screenshot → OCR
          try {
            setMsg("Loading reader…");
            await loadScript(TESS_URL);
            if (cancelled) return;
            setMsg("Reading your screenshot…"); setProgress(0.12);
            const { data } = await window.Tesseract.recognize(pending.dataUrl, "eng", {
              logger: (mm) => { if (mm.status === "recognizing text" && !cancelled) setProgress(0.12 + mm.progress * 0.72); },
            });
            if (cancelled) return;
            const text = (data && data.text) || "";
            const deviceKey = detectDevice(text);
            const native = extractScore(text);
            const name = extractName(text);
            track("ocr_result", { device: deviceKey, rawScore: native, nameFound: !!name });
            if (deviceKey && native != null) {
              const m = DEVICE_MODEL[deviceKey];
              setMsg("Applying " + m.tag + " correction (×" + m.factor + ")…"); setProgress(0.94); await wait(520);
              if (cancelled) return; setProgress(1);
              onDone({ deviceKey, native, name, confident: true });
            } else {
              track("ocr_fallback", { device: deviceKey, rawScore: native });
              onDone({ deviceKey: deviceKey || null, native: native || null, name: name || null, confident: false });
            }
          } catch (e) {
            if (cancelled) return;
            track("ocr_fallback", { error: String(e && e.message || e) });
            onDone({ deviceKey: null, native: null, name: null, confident: false });
          }
        })();
        return () => { cancelled = true; };
      }, []);

      return (
        <div className="min-h-screen flex flex-col items-center justify-center px-5 bg-void">
          {pending.type === "screenshot" && (
            <img src={pending.dataUrl} alt="" className="w-24 h-24 object-cover rounded-xl border border-white/10 mb-6 opacity-80" />
          )}
          <div className="relative mb-7">
            <div className="w-20 h-20 rounded-full border-2 border-white/10 border-t-jade spin" />
            <Activity className="w-7 h-7 text-jade absolute inset-0 m-auto" />
          </div>
          <div className="font-mono text-sm text-bone/90 h-6 text-center px-4">{msg}</div>
          <div className="mt-5 w-56 h-1.5 rounded-full bg-white/10 overflow-hidden">
            <div className="h-full bg-jade transition-all duration-300" style={{ width: Math.round(progress * 100) + "%" }} />
          </div>
          <p className="text-xs text-ash/70 mt-6 font-mono">{pending.type === "screenshot" ? "OCR-verifying your recovery score" : "Normalizing to the Oriya Standard"}</p>
        </div>
      );
    }

      useEffect(() => {
        if (n >= feed.length) { setTyping(false); return; }
        setTyping(true);
        const t = setTimeout(() => { setTyping(false); setN((x) => x + 1); }, 2000);
        return () => clearTimeout(t);

      const shown = feed.slice(0, n);
      return (
        <div className="mt-7">

                      <span className={"w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-semibold " + (r.you ? "bg-jade text-void" : "bg-white/8 text-bone")}>{r.init}</span>
                      <span className={"flex-1 min-w-0 truncate " + (r.you ? "text-jade font-semibold" : "text-bone")}>{r.you ? (me.name || "you") + " (you)" : r.handle}</span>
                      <span className="text-xs text-ash font-mono hidden sm:block w-24 truncate">{r.team}</span>
                      <span className="font-mono tnum text-bone w-8 text-right">{r.score}</span>
                      <span className="text-[11px] text-ash font-mono w-10 text-right">🔥 {r.streak}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {c.feed && c.feed.length > 0 && <LiveFeed feed={c.feed} />}

            <div className="mt-7">
              <h3 className="text-sm font-semibold text-bone uppercase tracking-wider mb-3">Rules & How it Works</h3>
              <ul className="space-y-2">
                {BASE_RULES.concat([c.payout]).filter(Boolean).map((r, i) => (
                  <li key={i} className="flex gap-2.5 text-sm text-ash"><Check className="w-4 h-4 text-jade shrink-0 mt-0.5" /><span>{r}</span></li>
                ))}
              </ul>
            </div>

            <div className="mt-7 flex flex-wrap gap-2">
              {c.categories.map((cat) => (
                <span key={cat} className="text-[11px] font-mono text-ash rounded-full border border-white/10 px-3 py-1">{cat}</span>
              ))}
            </div>

            <div className="mt-8 rounded-xl border border-white/10 bg-white/[0.02] p-5">
              <p className="text-sm text-bone font-medium">Want to run one for your team?</p>
              <p className="text-xs text-ash mt-1">We run the normalization, scoring, and payout. You bring the crew and the pool.</p>
              <p className="text-xs font-mono mt-3"><a href="mailto:team@oriya.app" className="text-jade">team@oriya.app</a> <span className="text-ash">·</span> <a href="mailto:hello@oriya.app" className="text-jade">hello@oriya.app</a></p>
            </div>
          </div>

          {/* sticky JOIN — the primary action */}
          {!joined && (
            <div className="fixed bottom-0 inset-x-0 z-50 border-t border-white/10 bg-void/90 backdrop-blur-xl">
              <div className="max-w-2xl mx-auto px-5 py-4">
                <button onClick={() => team && onJoin(c, team)} disabled={!team}
                  className={"w-full rounded-full py-3.5 font-semibold transition inline-flex items-center justify-center gap-2 " + (team ? "bg-jade text-void hover:brightness-110 shadow-[0_0_50px_-12px_rgba(127,183,158,0.7)]" : "bg-white/10 text-ash cursor-not-allowed")}>
                  <UserPlus className="w-4 h-4" /> {!team ? "Pick your team above" : c.status === "LIVE" ? "Join " + team : "Notify me — " + team}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =============================== Dashboard =============================== */
    function Dashboard({ passport, setPassport }) {
      const [selected, setSelected] = useState(null);
      const [joined, setJoined] = useState({});
      const [userSquads, setUserSquads] = useState([]);
      const [teammates, setTeammates] = useState([]);
      const [toast, setToast] = useState("");
      const [showSim, setShowSim] = useState(false);
      const [creating, setCreating] = useState(false);
      const [squadName, setSquadName] = useState("");
      const [squadEmoji, setSquadEmoji] = useState(SQUAD_EMOJIS[0]);
      const [igHandle, setIgHandle] = useState("");
      const [igOpen, setIgOpen] = useState(false);
      const [igInput, setIgInput] = useState("");
      const cardRef = useRef(null);

      const flashToast = (msg) => { setToast(msg); window.clearTimeout(flashToast._t); flashToast._t = window.setTimeout(() => setToast(""), 2600); };

      const swapDevice = (k) => setPassport((p) => ({ ...p, deviceKey: k, native: nativeForOriya(p.oriya, k) }));
      const setName = (v) => setPassport((p) => ({ ...p, name: v }));
      const cycleNation = () => setPassport((p) => {
        const i = NATIONS.findIndex((n) => n.code === p.nationality);
        return { ...p, nationality: NATIONS[(i + 1) % NATIONS.length].code };
      });

      /* ---- derived Body Passport identity (back of card) ---- */
      const hasSquad = !!passport.squad;
      const personality = personalityFor(passport);
      const badges = {};
      if (passport.oriya >= 78) badges.hrvelite = true;
      if (passport.oriya >= 85) badges.peak85 = true;
      if (hasSquad) { badges.warrior7 = true; badges.sleep10 = true; }
      const allChallengeList = userSquads.concat(CHALLENGES);
      const joinedChallenges = Object.keys(joined).map((id) => allChallengeList.find((c) => c && c.id === id)).filter(Boolean);
      const earnings = joinedChallenges.reduce((s, c) => s + (c.projectedPayout || 0), 0);
      const natObj = NATIONS.find((n) => n.code === passport.nationality) || NATIONS[0];
      const countryStamps = [{ label: natObj.code }, { label: "SEASON 1" }];
      joinedChallenges.slice(0, 1).forEach((c) => countryStamps.push({ label: (joined[c.id] || c.joinTeam) }));
      if (countryStamps.length < 3) countryStamps.push({ label: "LOCKED", locked: true });

      /* ---- "where you'd land" — the status payoff BEFORE commitment (Mom Test: lead with the rank, not after) ---- */
      const hotChallenge = CHALLENGES.find((c) => c.status === "LIVE" && c.leaderboard && c.leaderboard.length > 0);
      const hotPreviewRank = hotChallenge ? hotChallenge.leaderboard.filter((r) => r.score > passport.oriya).length + 1 : null;
      const hotField = hotChallenge ? hotChallenge.leaderboard.length + 1 : null;
      const alreadyJoinedHot = hotChallenge ? !!joined[hotChallenge.id] : false;

      /* ---- competitiveness tier — climbs with engagement, not the recovery number ---- */
      const tierState = { hasSquad, joinedCount: joinedChallenges.length, earnings, teammates: teammates.length };
      const tier = tierFor(tierState);
      const tierHint = nextTierHint(tierState);
      // LIVE clusters first — a board with people on it, never an empty marketplace for user #1
      const sortedChallenges = CHALLENGES.slice().sort((a, b) => (a.status === "LIVE" ? 0 : 1) - (b.status === "LIVE" ? 0 : 1));

      const shareUrl = "https://oriya.app/?ref=" + slug(passport.name) + "-" + passport.oriya + (passport.squad ? "&squad=" + encodeURIComponent(passport.squad) : "");
      const caption = (passport.squad ? "Running " + passport.squad + " on Oriya. " : "") + "My readiness normalizes to " + passport.oriya + " on the Oriya Standard — same number on any wearable (" + DEVICE_MODEL[passport.deviceKey].tag + ")." + (igHandle ? " @" + igHandle : "") + " Squad's open, pull up 👇";

      const sharePassport = async () => {
        try {
          await loadScript(HTI_URL);
          const dataUrl = await window.htmlToImage.toPng(cardRef.current, { pixelRatio: 2, backgroundColor: "#0c0e12" });
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], "oriya-passport.png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text: caption, url: shareUrl });
            track("passport_shared", { method: "image" });
            return;
          }
          const a = document.createElement("a"); a.href = dataUrl; a.download = "oriya-passport.png"; a.click();
          try { await navigator.clipboard.writeText(shareUrl); } catch (e) {}
          track("passport_shared", { method: "image" });
          flashToast("Passport saved — link copied to share!");
        } catch (e) {
          try { await navigator.clipboard.writeText(shareUrl); } catch (e2) {}
          track("passport_shared", { method: "link" });
          flashToast("Invite link copied to clipboard!");
        }
      };

      const joinChallenge = (c, team) => {
        const t = team || c.joinTeam;
        setJoined((j) => ({ ...j, [c.id]: t }));
        setPassport((p) => ({ ...p, squad: t }));
        track("door_selected", { door: "join" });
        track("squad_joined", { challenge: c.id, team: t });
        if (c.projectedPayout) track("ledger_unlocked", { challenge: c.id, amount: c.projectedPayout });
        setShowSim(true);
        flashToast("You joined " + t + " — you're on the board!");
      };

      const createNamedSquad = () => {
        const name = squadName.trim();
        if (!name) return;
        const sq = {
          id: "sq_" + Date.now(), emoji: squadEmoji, icon: Users, status: "LIVE", sponsor: null,
          title: name, subtitle: "Your squad · pull your crew in", days: null, prize: null,
          payout: "Invite friends — your team average climbs as they join.",
          participants: 1, avg: passport.oriya, joinTeam: name, teams: [name], createdByYou: true,
          categories: ["Your Squad", "Open", "Founder"],
          description: "You started " + name + ". Share your Body Passport to bring your people in — every friend who joins lifts your team average.",
          leaderboard: [{ you: true, init: initials(passport.name), handle: passport.name || "you", team: name, score: passport.oriya, streak: "1d" }],
        };
        setUserSquads((s) => [sq, ...s]);
        setJoined((j) => ({ ...j, [sq.id]: name }));
        setPassport((p) => ({ ...p, squad: name }));
        track("door_selected", { door: "create" });
        track("squad_created", { source: "try_mvp", name });
        setCreating(false); setSquadName(""); setShowSim(true);
        flashToast("Squad created — " + name + " is on your Passport!");
      };

      const connectInstagram = () => {
        const h = igInput.replace(/^@+/, "").trim();
        if (!h) return;
        setIgHandle(h); setIgOpen(false); setIgInput("");
        setPassport((p) => ({ ...p, name: p.name || h }));
        track("social_connected", { platform: "instagram", handle: h });
        flashToast("Instagram connected — @" + h);
      };

      const simulateFriend = () => {
        const f = FRIEND_POOL[teammates.length % FRIEND_POOL.length];
        const key = Date.now() + "-" + teammates.length;
        setTeammates((t) => [...t, { ...f, key }]);
        const sqTitle = userSquads.length ? userSquads[0].title : (passport.squad || "your squad");
        setUserSquads((list) => list.length ? list.map((sq, i) => i === 0
          ? { ...sq, participants: sq.participants + 1, avg: Math.round((sq.avg * sq.participants + f.score) / (sq.participants + 1)),
              leaderboard: [...sq.leaderboard, { init: initials(f.name), handle: slug(f.name), team: sq.joinTeam, score: f.score, streak: "1d" }] }
          : sq) : list);
        const sq0 = userSquads[0];
        const newAvg = sq0 ? Math.round((sq0.avg * sq0.participants + f.score) / (sq0.participants + 1)) : null;
        track("invite_accepted", { teammate: f.name });
        flashToast(newAvg != null
          ? f.name + " logged a " + f.score + " — " + sqTitle + " avg → " + newAvg
          : f.name + " joined " + sqTitle + "!");
      };

      return (
        <div className="min-h-screen bg-void pb-28">
          <div className="max-w-3xl mx-auto px-5 pt-8">
            <div className="flex items-center justify-between mb-6">
              <a href="index.html" className="inline-flex items-center gap-1.5 text-xs text-ash hover:text-bone font-mono"><ArrowLeft className="w-3.5 h-3.5" /> oriya.app</a>
              <span className="text-xs font-mono text-ash">Body Passport · SF Bay</span>
            </div>

            <div className="max-w-md mx-auto">
              <PassportCard passport={passport} cardRef={cardRef} onSwap={swapDevice} onSetName={setName} social={igHandle}
                personality={personality} badges={badges} countryStamps={countryStamps} earnings={earnings} onCycleNation={cycleNation} tier={tier} />
              {tierHint && (
                <div className="mt-3 flex items-center justify-center gap-2 text-[11px] font-mono animate-fade-up">
                  <span className="inline-flex items-center gap-1.5" style={{ color: tier.accent }}><span className="w-2 h-2 rounded-full" style={{ background: tier.accent, boxShadow: "0 0 7px " + tier.accent }} /> {tier.name}</span>
                  <span className="text-ash/40">·</span>
                  <span className="text-ash">{tierHint}</span>
                </div>
              )}
              <div className="mt-4 flex gap-2">
                <button onClick={sharePassport} className="flex-1 rounded-full bg-jade py-3 font-semibold text-void hover:brightness-110 transition inline-flex items-center justify-center gap-2 shadow-[0_0_40px_-14px_rgba(127,183,158,0.8)]">
                  <Share2 className="w-4 h-4" /> Share my Passport
                </button>
                {igHandle
                  ? <span className="rounded-full border border-jade/40 bg-jade/[0.08] px-4 py-3 text-sm text-jade inline-flex items-center gap-2"><Instagram className="w-4 h-4" /> @{igHandle}</span>
                  : <button onClick={() => setIgOpen((o) => !o)} className="rounded-full border border-white/12 bg-white/[0.03] px-4 py-3 text-sm text-bone hover:bg-white/[0.07] transition inline-flex items-center gap-2"><Instagram className="w-4 h-4" /> Connect</button>}
              </div>
              {igOpen && !igHandle && (
                <div className="mt-2 flex gap-2 animate-fade-up">
                  <input value={igInput} onChange={(e) => setIgInput(e.target.value)} placeholder="@yourhandle"
                    onKeyDown={(e) => { if (e.key === "Enter") connectInstagram(); }}
                    className="flex-1 rounded-full bg-white/[0.04] border border-white/10 px-4 py-2.5 text-sm text-bone outline-none focus:border-jade" />
                  <button onClick={connectInstagram} className="rounded-full bg-jade px-4 py-2.5 text-sm font-semibold text-void">Link</button>
                </div>
              )}
              <p className="text-center text-[11px] text-ash mt-2 font-mono">Post your Passport — your crew drops their own screenshot and lands on your board</p>

              {/* WHERE YOU'D LAND — surface the rank payoff before the user commits a side */}
              {hotChallenge && !alreadyJoinedHot && (
                <button onClick={() => { setSelected(hotChallenge); track("rank_preview_clicked", { challenge: hotChallenge.id, rank: hotPreviewRank }); }}
                  className="mt-5 w-full text-left rounded-2xl border border-amber-brand/30 bg-gradient-to-br from-amber-brand/[0.10] to-transparent p-4 hover:border-amber-brand/60 transition group animate-fade-up">
                  <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-[10px] uppercase tracking-wider font-mono text-amber-glow/80 mb-1">Where you'd land right now</div>
                      <div className="text-bone text-sm leading-snug">
                        Your Oriya <span className="font-mono text-amber-glow font-semibold">{passport.oriya}</span> drops in around
                        <span className="font-mono text-amber-glow font-semibold"> #{hotPreviewRank}</span> of {hotField} in <span className="font-semibold">{hotChallenge.title}</span>.
                      </div>
                      <div className="text-xs text-ash mt-1">{hotChallenge.participants} already logging · {hotChallenge.sponsor}</div>
                    </div>
                    <span className="shrink-0 inline-flex items-center gap-1 text-xs font-semibold text-amber-glow group-hover:translate-x-0.5 transition-transform">Drop in <ChevronRight className="w-4 h-4" /></span>
                  </div>
                </button>
              )}

              <NormalizeExplainer />
            </div>

            {/* live teammates strip */}
            <div className="mt-8 flex items-center gap-3">
              <span className="text-xs text-ash font-mono shrink-0">Your squad</span>
              <div className="flex items-center -space-x-2">
                <div className="w-8 h-8 rounded-full bg-jade/20 border-2 border-void ring-1 ring-jade/50 flex items-center justify-center text-[10px] font-semibold text-jade">{initials(passport.name)}</div>
                {teammates.map((t) => (
                  <div key={t.key} title={t.name + " · " + t.score} className="w-8 h-8 rounded-full bg-white/8 border-2 border-void flex items-center justify-center text-[10px] font-semibold text-bone animate-pop-in">{initials(t.name)}</div>
                ))}
                {teammates.length === 0 && <span className="pl-3 text-xs text-ash">{passport.squad ? "pull your crew in →" : "join a squad below →"}</span>}
              </div>
            </div>

            {/* CREATE YOUR SQUAD — the #1 priority move */}
            <div className="mt-9 rounded-2xl border border-jade/40 bg-jade/[0.06] p-5 relative overflow-hidden">
              <div className="absolute -top-12 -right-10 w-40 h-40 rounded-full bg-jade/10 blur-3xl pointer-events-none" />
              <span className="inline-flex items-center gap-1.5 text-[10px] uppercase tracking-wider font-mono text-amber-glow mb-2"><Star className="w-3 h-3" /> Start here · the move</span>
              <h2 className="text-lg font-semibold text-bone">Create your own Squad</h2>
              <p className="text-sm text-ash mt-1 mb-4">Name it, stamp it on your Passport, and drag your training partners in. Every one who logs lifts your team average — an empty squad is a dead squad.</p>

              {!creating && (
                <button onClick={() => setCreating(true)} className="rounded-full bg-jade px-5 py-2.5 text-sm font-semibold text-void hover:brightness-110 transition inline-flex items-center gap-2">
                  <Plus className="w-4 h-4" /> {userSquads.length ? "Create another squad" : "Create your Squad"}
                </button>
              )}
              {creating && (
                <div className="animate-fade-up">
                  <div className="flex flex-wrap gap-1.5 mb-3">
                    {SQUAD_EMOJIS.map((e) => (
                      <button key={e} onClick={() => setSquadEmoji(e)} className={"w-9 h-9 rounded-lg text-lg flex items-center justify-center border transition " + (e === squadEmoji ? "border-jade bg-jade/10" : "border-white/10 hover:border-white/25")}>{e}</button>
                    ))}
                  </div>
                  <input value={squadName} onChange={(e) => setSquadName(e.target.value)} maxLength={28}
                    onKeyDown={(e) => { if (e.key === "Enter") createNamedSquad(); }}
                    placeholder="Name your squad — e.g. Dawn Patrol RC"
                    className="w-full rounded-full bg-white/[0.05] border border-white/10 px-4 py-2.5 text-sm text-bone outline-none focus:border-jade" />
                  <button onClick={createNamedSquad} disabled={!squadName.trim()}
                    className={"mt-3 w-full rounded-full py-2.5 text-sm font-semibold transition " + (squadName.trim() ? "bg-jade text-void hover:brightness-110" : "bg-white/10 text-ash cursor-not-allowed")}>
                    Create &amp; stamp my Passport
                  </button>
                </div>
              )}
              {userSquads.length > 0 && !creating && (
                <p className="mt-3 text-xs font-mono text-jade">Your squad <span className="text-bone">{userSquads[0].title}</span> is live below ↓ — share your Passport to grow it.</p>
              )}
            </div>

            <div className="mt-8 mb-1 flex items-center gap-2">
              <Flame className="w-4 h-4 text-amber-glow" />
              <h2 className="text-sm font-semibold text-bone uppercase tracking-wider">Live challenges near you</h2>
            </div>
            <p className="text-xs text-ash mb-4">Live boards first — real people already logging. Pick a side and your Oriya Standard drops straight onto the leaderboard.</p>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {userSquads.map((c) => <ChallengeCard key={c.id} c={c} joined={true} onOpen={setSelected} />)}
              {sortedChallenges.map((c) => <ChallengeCard key={c.id} c={c} joined={!!joined[c.id]} onOpen={setSelected} />)}
            </div>

            {showSim && (
              <button onClick={simulateFriend} className="mt-6 w-full rounded-xl border border-dashed border-jade/40 bg-jade/5 py-3 text-sm font-medium text-jade hover:bg-jade/10 transition inline-flex items-center justify-center gap-2 animate-fade-up">
                <UserPlus className="w-4 h-4" /> Pull in a teammate — watch the average move <span className="text-jade/60 font-mono text-xs">(demo)</span>
              </button>
            )}
          </div>

          {selected && (
            <ChallengeDetail c={selected} joined={!!joined[selected.id]} joinedTeam={joined[selected.id]} me={passport}
              onJoin={(c, team) => joinChallenge(c, team)} onClose={() => setSelected(null)} onShare={sharePassport} />
          )}

          {toast && (
            <div className="fixed bottom-6 inset-x-0 z-[60] flex justify-center px-5 animate-fade-up pointer-events-none">
              <div className="rounded-full border border-jade/40 bg-graphite px-4 py-2.5 text-sm text-bone shadow-xl inline-flex items-center gap-2">
                <Check className="w-4 h-4 text-jade" /> {toast}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =============================== App =============================== */
    function App() {
      const [view, setView] = useState("hook"); // hook | normalizing | confirm | dashboard
      const [pending, setPending] = useState(null);
      const [prefill, setPrefill] = useState(null);
      const [passport, setPassport] = useState(null);

      useEffect(() => {
        try {
          const p = new URLSearchParams(location.search);
          if (p.get("ref") || p.get("squad")) track("door_selected", { door: "join", squad: p.get("squad") || null, ref: p.get("ref") || null });
        } catch (e) {}
      }, []);

      const startPreset = (deviceKey, native) => { track("device_connect_started", { method: "preset", device: DEVICE_MODEL[deviceKey].tag }); setPending({ type: "preset", deviceKey, native }); setView("normalizing"); };
      const startScreenshot = (dataUrl) => { track("device_connect_started", { method: "screenshot" }); setPending({ type: "screenshot", dataUrl }); setView("normalizing"); };

      const finalize = (deviceKey, native, name, via) => {
        const m = DEVICE_MODEL[deviceKey];
        const oriya = toOriyaStandard(native, deviceKey);
        track("device_connect_completed", { device: m.tag, via: via || "auto" });
        track("passport_generated", { device: m.tag, native, oriya });
        setPassport({ deviceKey, native, oriya, name: name || "", squad: null, nationality: "USA", personaIdx: pickPersona(deviceKey, native, oriya) });
        setView("dashboard");
      };
      const handleResolved = (r) => { if (!r.confident) { setPrefill(r); setView("confirm"); return; } finalize(r.deviceKey, r.native, r.name); };

      if (view === "hook") return <Hook onPreset={startPreset} onScreenshot={startScreenshot} />;
      if (view === "normalizing") return <Normalizing pending={pending} onDone={handleResolved} />;
      if (view === "confirm") return <Confirm prefill={prefill} onConfirm={(d) => finalize(d.deviceKey, d.native, d.name, "manual")} onBack={() => setView("hook")} />;
      return <Dashboard passport={passport} setPassport={setPassport} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
